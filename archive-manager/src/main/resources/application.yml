server:
  port: 9090
  error:
    include-stacktrace: always
    include-message: always
    include-binding-errors: always
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    # A different, connector-level setting from server.servlet.encoding above --
    # that one is applied by a Spring filter partway through request processing;
    # this one controls how the embedded Tomcat connector itself decodes the
    # request URI and (some Tomcat versions/configurations) multipart form
    # field parsing before Spring's filter chain even runs. Setting both closes
    # a gap the servlet-level setting alone doesn't necessarily cover.
    uri-encoding: UTF-8

spring:
  application:
    name: archive-manager
  thymeleaf:
    cache: false
    encoding: UTF-8
  servlet:
    multipart:
      # A real "bulk" Bulk Upload Spreadsheet CSV (rows of catalogue
      # metadata, no digital objects themselves -- those go to Eternal
      # separately, see README) can comfortably run to several thousand
      # rows; Spring Boot's own default (1MB) is too small for that.
      # Also the largest transformed file that can be uploaded (Transform with another application).
      max-file-size: 512MB
      max-request-size: 512MB

logging:
  level:
    info.oais.archive.manager: INFO

# Where the TDB2 triple store lives on disk. Relative paths are resolved
# against the JVM's working directory at startup (logged at INFO level so
# you can always see exactly where your data lives); use an absolute path
# here if you want the location to be independent of how/where you launch
# the app. This is a directory (TDB2 manages its own files inside it), not
# a single file.
archive:
  tdb-location: data/tdb2
  # Where the archive keeps bits it makes itself, e.g. a transformed Data
  # Object's, served at /api/bits/{id}/{name}. Env: ARCHIVE_BITS_LOCATION.
  bits-location: data/bits
  # Python interpreter with drb-python installed (`pip install drb`), used by
  # RepInfo Tools to test a generated drb-python driver against a sample file.
  # Empty means: try python3, then python. Env: ARCHIVE_DRB_PYTHON_EXECUTABLE.
  drb-python:
    executable: ""
    # A drb-python driver can carry a hand-written add-in: Python code. Sample
    # tests run it only if this is true, which lets anyone who can log in run
    # code on this server as the app's user. Leave it false unless everyone
    # with the edit password is trusted that far.
    # Env: ARCHIVE_DRB_PYTHON_RUN_HAND_WRITTEN_ADD_INS.
    run-hand-written-add-ins: false
  # Serving a Data Object as VOTable (/api/data-objects/{id}/votable, "View in
  # TOPCAT") fetches its bits from its storage location (im:hasStorageLocation).
  # Only http(s), at most max-bytes, within timeout-seconds; never from loopback
  # or private-network addresses unless allow-private-addresses is true (which
  # lets anyone who can set a storage location make this server fetch from its
  # own network). Env: ARCHIVE_FETCH_MAX_BYTES, ARCHIVE_FETCH_TIMEOUT_SECONDS,
  # ARCHIVE_FETCH_ALLOW_PRIVATE_ADDRESSES.
  fetch:
    max-bytes: 104857600
    timeout-seconds: 60
    allow-private-addresses: false
  # RepInfo Tools' Kaitai sample test runs the bundled Kaitai Struct compiler
  # as a separate Java process (with this JVM's own java); it's stopped after
  # this many seconds. Env: ARCHIVE_KAITAI_TIMEOUT_SECONDS.
  kaitai:
    timeout-seconds: 120
  # The single shared password required to create/edit/delete data (browsing
  # stays open without it). This is intentionally left set for deployment use,
  # since the password must remain available when the application is run in a
  # controlled environment. Keep it in the deployment config or environment,
  # not in source control if you need a reusable secret outside this local setup.
  edit-password: OAISisGreat14721
