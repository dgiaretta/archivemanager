<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Shared by the "Test against a sample file" sections of preview.html (Kaitai, DFDL, drb-python, DRB). -->
<div th:fragment="sampleResult(result)">
    <p>
        <strong th:text="${sampleFileName}">sample.bin</strong>
        <span th:text="#{sample.bytes(${sampleFileSize})}">(0 bytes):</span>
        <span th:if="${result.ok()}" th:text="#{sample.decoded}">decoded successfully.</span>
        <span th:unless="${result.ok()}" th:text="#{sample.notDecoded}">could not be decoded.</span>
    </p>
    <pre class="sparql" th:unless="${result.ok()}" th:text="${result.error()}">diagnostics</pre>
    <p class="notice error" th:if="${result.ok() and result.trailingBytes() != null and result.trailingBytes() > 0}"
       th:text="${result.trailingBytes() == 1} ? #{sample.trailingOne} : #{sample.trailing(${result.trailingBytes()})}">leftover</p>
    <p class="muted" th:if="${result.ok() and result.trailingBytes() != null and result.trailingBytes() == 0}"
       th:text="#{sample.everyByte}">The description accounts for every byte of the sample.</p>
    <p class="notice" th:if="${result.warning() != null}" th:text="${result.warning()}">warning</p>
    <table th:if="${result.ok()}" class="listing">
        <thead>
        <tr><th th:text="#{sample.col.element}">Element</th><th th:text="#{sample.col.kind}">Kind</th>
            <th th:text="#{sample.col.value}">Value</th><th th:if="${result.hasMeanings()}" th:text="#{sample.col.meaning}">Meaning</th>
            <th th:if="${result.hasPositions()}" th:text="#{sample.col.position}">Position</th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${result.rows()}">
            <td th:style="'padding-left:' + (${row.depth()} * 1.25 + 0.5) + 'em'"><code th:text="${row.name()}">x</code></td>
            <td th:text="${row.kind()}">LEAF</td>
            <td th:text="${row.value()}">42</td>
            <td th:if="${result.hasMeanings()}" th:text="${row.meaning()}">housekeeping</td>
            <td class="muted" th:if="${result.hasPositions()}" th:text="${row.byteRange()}">bytes 0&ndash;3</td>
        </tr>
        </tbody>
    </table>
    <p class="muted" th:if="${result.truncated()}" th:text="#{sample.truncated(${result.rows().size()})}">
        Showing the first 2000 elements only.
    </p>
</div>
</body>
</html>
