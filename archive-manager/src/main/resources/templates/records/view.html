<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}" th:dir="${#locale.language == 'dv'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments :: head(${title})}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <p class="breadcrumb"><a th:href="@{/records}" th:utext="'&larr; ' + #{nav.records}">&larr; Records</a></p>
    <h1 th:text="${title}">Title</h1>
    <p class="types">
        <span class="pill" th:each="t : ${types}" th:text="${t}">Type</span>
        &middot; <code th:text="${iri}">iri</code>
    </p>

    <p>
        <a class="button" th:href="@{/oais/{id}(id=${id})}" th:utext="#{records.viewOais} + ' &rarr;'">View OAIS mapping &rarr;</a>
        <a class="button button-secondary" th:href="@{/graph/{id}(id=${id})}" th:utext="#{action.viewInGraph} + ' &rarr;'">View in graph &rarr;</a>
        <a class="button button-secondary" th:href="@{/entities/{id}/edit(id=${id})}" th:utext="#{action.edit} + ' &rarr;'">Edit &rarr;</a>
    </p>

    <p th:if="${description}" th:text="${description}">Description</p>

    <div class="grid">
        <section th:if="${!creators.isEmpty()}">
            <h3 th:text="#{records.creators}">Creator(s)</h3>
            <ul><li th:each="c : ${creators}"><a th:href="@{/agents/{id}(id=${c.id})}" th:text="${c.title}">Agent</a></li></ul>
        </section>

        <section th:if="${parent != null}">
            <h3 th:text="#{records.partOf}">Part of</h3>
            <a th:href="@{/records/{id}(id=${parent.id})}" th:text="${parent.title}">Parent</a>
        </section>

        <section th:if="${!constituents.isEmpty()}">
            <h3 th:text="#{records.constituents}">Constituents</h3>
            <ul><li th:each="c : ${constituents}"><a th:href="@{/records/{id}(id=${c.id})}" th:text="${c.title}">Part</a></li></ul>
        </section>

        <section th:if="${!instantiations.isEmpty()}">
            <h3 th:text="#{records.instantiations}">Instantiation(s)</h3>
            <ul>
                <li th:each="i : ${instantiations}">
                    <span th:text="${i.title}">Instantiation</span>
                    <span class="pill">rico:Instantiation</span>
                </li>
            </ul>
        </section>

        <section th:if="${!mandates.isEmpty()}">
            <h3 th:text="#{records.regulatedBy}">Regulated by</h3>
            <ul><li th:each="m : ${mandates}"><a th:href="@{/mandates/{id}(id=${m.id})}" th:text="${m.title}">Mandate</a></li></ul>
        </section>

        <section th:if="${!provenanceActivities.isEmpty()}">
            <h3 th:text="#{records.provenance}">Provenance</h3>
            <ul><li th:each="a : ${provenanceActivities}"><a th:href="@{/activities/{id}(id=${a.id})}" th:text="${a.title}">Activity</a></li></ul>
        </section>

        <section th:if="${!attributes.isEmpty()}">
            <h3 th:text="#{records.otherProperties}">Other properties</h3>
            <table class="attrs">
                <tr th:each="a : ${attributes}">
                    <td class="prop" th:text="${a.propertyLocalName}">prop</td>
                    <td>
                        <a th:if="${a.value != null and (a.value.startsWith('http://') or a.value.startsWith('https://'))}"
                           th:href="${a.value}" th:text="${a.value}"
                           target="_blank" rel="noopener noreferrer" th:title="#{link.newTab}">value &#8599;</a>
                        <span th:unless="${a.value != null and (a.value.startsWith('http://') or a.value.startsWith('https://'))}" th:text="${a.value}">value</span>
                    </td>
                </tr>
            </table>
        </section>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
