<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}" th:dir="${#locale.language == 'dv'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments :: head(#{nav.records})}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <h1 th:text="#{records.title}">Records, Record Parts &amp; Record Sets</h1>
    <p>
        <a class="button" th:href="@{/records/new}" th:text="'+ ' + #{records.new}">+ New record</a>
        <span th:replace="~{graph-button :: viewAsGraph(${resultPage.items.![id]})}"></span>
    </p>
    <table class="listing">
        <thead>
        <tr><th th:text="#{col.type}">Type</th><th th:text="#{col.title}">Title</th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${resultPage.items}">
            <td><span class="pill" th:text="${r.typeLocalName}">Record</span></td>
            <td><a th:href="@{/records/{id}(id=${r.id})}" th:text="${r.title}">Title</a></td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{pagination :: pagination(${resultPage}, '/records')}"></div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
