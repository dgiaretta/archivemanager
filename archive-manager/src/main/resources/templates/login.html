<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container container-narrow">
    <h1>Log in to edit</h1>
    <p class="muted">
        Browsing is always open. A password is only needed to create, edit, or delete entities.
    </p>

    <div class="callout" th:if="${error}">
        <strong>Wrong password.</strong> Try again.
    </div>

    <form th:action="@{/login}" method="post" class="form">
        <input type="hidden" name="redirect" th:value="${redirect}"/>
        <label>
            Password
            <input type="password" name="password" autofocus="autofocus" required/>
        </label>
        <button type="submit">Log in</button>
    </form>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
