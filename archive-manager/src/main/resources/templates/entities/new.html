<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{entities.new})}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <p class="breadcrumb"><a th:href="@{/entities}" th:utext="'&larr; ' + #{nav.entities}">&larr; Entities</a></p>
    <h1 th:text="#{entities.new}">New entity</h1>
    <p class="muted" th:text="#{entities.new.intro}">
        Pick any RiC-O or OAIS class. The entity is created with just that type; add its
        properties and relationships on the next screen.
    </p>

    <form th:action="@{/entities}" method="post" class="form">
        <label>
            <span th:text="#{entities.class}">Class</span>
            <input type="text" class="select-filter" data-target="classIri-select" th:placeholder="#{entities.filterClasses}"/>
            <select name="classIri" id="classIri-select">
                <option value="" th:text="#{option.choose}">-- choose --</option>
                <optgroup label="OAIS">
                    <option th:each="c : ${classes}" th:if="${c.source == 'oais'}"
                            th:value="${c.iri}" th:text="'im:' + ${c.localName} + ' (' + ${c.label} + ')'">im:InformationObject</option>
                </optgroup>
                <optgroup label="RiC-O">
                    <option th:each="c : ${classes}" th:if="${c.source == 'rico'}"
                            th:value="${c.iri}" th:text="'rico:' + ${c.localName} + ' (' + ${c.label} + ')'">rico:Record</option>
                </optgroup>
            </select>
        </label>

        <label>
            <span th:text="#{entities.customClass}">Or a custom class IRI / prefixed name (overrides the dropdown if filled)</span>
            <input type="text" name="customClass" th:placeholder="#{entities.customClassExample}"/>
        </label>

        <button type="submit" th:text="#{action.create}">Create</button>
    </form>
</main>
<div th:replace="~{fragments :: footer}"></div>

<script th:src="@{/js/select-filter.js}"></script>
<script>
    (function () {
        var form = document.querySelector('form');
        var dirty = false;
        form.querySelectorAll('input[type="text"]:not(.select-filter), select').forEach(function (el) {
            el.addEventListener('input', function () { dirty = true; });
            el.addEventListener('change', function () { dirty = true; });
        });
        form.addEventListener('submit', function () { dirty = false; });
        window.addEventListener('beforeunload', function (e) {
            if (dirty) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    })();
</script>
</body>
</html>
