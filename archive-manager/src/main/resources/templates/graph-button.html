<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  One button that graphs exactly the items passed in, starting at depth 1 --
  reused across every listing page (entities, agents, records, activities,
  mandates, accession register, catalogue search/explore, the SPARQL console)
  so "view this list as a graph" behaves identically everywhere rather than
  each page growing its own slightly different version. A GET form, not a
  link, because the id list can be long enough (one per row on the page) that
  it belongs in the request body/query built from form fields, not hand-built
  into an href.
-->
<form th:fragment="viewAsGraph(ids)" th:if="${ids != null and !ids.isEmpty()}"
      th:action="@{/graph/multi}" method="get" style="display:inline;">
    <input type="hidden" th:each="i : ${ids}" name="id" th:value="${i}"/>
    <input type="hidden" name="depth" value="1"/>
    <button type="submit" class="button-secondary">View this page as a graph &rarr;</button>
</form>
</body>
</html>
