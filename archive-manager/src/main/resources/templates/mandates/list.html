<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{mandates.title})}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <h1 th:text="#{mandates.title}">Mandates</h1>
    <p th:text="#{mandates.intro}">rico:Mandate individuals &mdash; the bridge maps these to OAIS Access Rights Information.</p>
    <p><span th:replace="~{graph-button :: viewAsGraph(${resultPage.items.![id]})}"></span></p>
    <table class="listing">
        <thead><tr><th th:text="#{col.name}">Name</th></tr></thead>
        <tbody>
        <tr th:each="m : ${resultPage.items}">
            <td><a th:href="@{/mandates/{id}(id=${m.id})}" th:text="${m.title}">Mandate</a></td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{pagination :: pagination(${resultPage}, '/mandates')}"></div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
