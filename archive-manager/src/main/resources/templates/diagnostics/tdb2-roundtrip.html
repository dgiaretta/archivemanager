<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{diag.tdb2.short})}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <p class="breadcrumb"><a th:href="@{/diagnostics/encoding}" th:utext="'&larr; ' + #{diag.encoding.title}">&larr; Encoding diagnostics</a></p>
    <h1 th:text="#{diag.tdb2.title}">TDB2 storage round-trip test</h1>
    <p class="muted" th:text="#{diag.tdb2.intro}">
        Does a Dhivehi string survive being written to the data graph, committed, and read back in a
        later, separate request?
    </p>

    <div class="editor-section">
        <h2 th:text="#{diag.tdb2.expected}">Expected</h2>
        <p style="font-size:1.4rem; padding:1rem; background:var(--accent-soft); border-radius:8px;" th:text="${expectedValue}">expected</p>
    </div>

    <div class="editor-section">
        <h2 th:text="#{diag.tdb2.readBack}">What was read back from TDB2</h2>
        <p th:if="${storedValue != null}"
           style="font-size:1.4rem; padding:1rem; background:var(--accent-soft); border-radius:8px;"
           th:text="${storedValue}">stored</p>
        <p th:if="${storedValue == null}" class="muted" th:text="#{diag.tdb2.nothing}">
            Nothing written yet.
        </p>
    </div>

    <form th:action="@{/diagnostics/tdb2-roundtrip}" method="post">
        <button type="submit" th:text="#{diag.tdb2.action}">Write test string, then read it back</button>
    </form>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
