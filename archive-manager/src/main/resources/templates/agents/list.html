<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}" th:dir="${#locale.language == 'dv'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments :: head(#{nav.agents})}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <h1 th:text="#{nav.agents}">Agents</h1>
    <p><span th:replace="~{graph-button :: viewAsGraph(${resultPage.items.![id]})}"></span></p>
    <table class="listing">
        <thead><tr><th th:text="#{col.type}">Type</th><th th:text="#{col.name}">Name</th></tr></thead>
        <tbody>
        <tr th:each="a : ${resultPage.items}">
            <td><span class="pill" th:text="${a.typeLocalName}">Type</span></td>
            <td><a th:href="@{/agents/{id}(id=${a.id})}" th:text="${a.title}">Name</a></td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{pagination :: pagination(${resultPage}, '/agents')}"></div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
