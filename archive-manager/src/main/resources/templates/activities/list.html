<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}" th:dir="${#locale.language == 'dv'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments :: head(#{nav.activities})}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <h1 th:text="#{activities.title}">Provenance events / activities</h1>
    <p th:text="#{activities.intro}">rico:Event / rico:Activity individuals are what the bridge maps to OAIS Provenance Information &mdash; open a record's "OAIS mapping" view to see it applied.</p>
    <p><span th:replace="~{graph-button :: viewAsGraph(${resultPage.items.![id]})}"></span></p>
    <table class="listing">
        <thead><tr><th th:text="#{col.type}">Type</th><th th:text="#{col.description}">Description</th></tr></thead>
        <tbody>
        <tr th:each="a : ${resultPage.items}">
            <td><span class="pill" th:text="${a.typeLocalName}">Type</span></td>
            <td><a th:href="@{/activities/{id}(id=${a.id})}" th:text="${a.title}">Description</a></td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{pagination :: pagination(${resultPage}, '/activities')}"></div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
