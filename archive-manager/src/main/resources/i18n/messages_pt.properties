preview.drbPython.writeBack=Isto usa o complemento de gravação do driver.
preview.drbJava.sdf=Um esquema SDF do DRB: um XML Schema cujas anotações <code>sdf:block</code> dão o comprimento, a ordem dos bytes e a codificação de cada campo — a própria linguagem declarativa de descrição do DRB, aplicada pelo DRB em Java da GAEL (LGPL v3). A definição de cada campo se torna seu <code>xs:documentation</code>.
preview.drbJava.reference=Um esquema documentado para referência, não algo que o DRB lê — os esquemas SDF do DRB descrevem layouts de bytes sequenciais, e o DRB não tem implementação de HDF5.
preview.drbJava.test=Aplica o esquema acima com o DRB em Java, dentro deste aplicativo, e mostra a árvore de nós decodificada com a posição em bytes de cada campo. O arquivo só é usado nesta requisição; nada é armazenado.
preview.drbJava.writeBack=O DRB grava cada valor onde ele foi lido: um valor delimitado pode mudar de comprimento, um de comprimento fixo não.
preview.viewers=Abrir no TOPCAT, no SPLAT ou num visualizador de imagens
preview.viewers.zip=Um zip com tudo de que o TOPCAT (com o leitor <code>oais-structure-topcat</code>) ou o SPLAT (com <code>oais-structure-splat</code>) precisam para abrir seus dados: um manifesto de Informação de Representação (Turtle) que nomeia o arquivo de dados, as descrições DFDL e DRB SDF — qualquer uma serve — uma visão de tabela gerada a partir da árvore de elementos (o primeiro registro repetido como linhas, seus campos como colunas, com unidades e significados), e o que cada elemento significa. Todo arquivo é nomeado no manifesto, então podem ser renomeados ou movidos editando-o. Ponha seu arquivo de dados ao lado do manifesto, com o nome que você der aqui.
preview.viewers.image=Uma imagem — um registro repetido (uma linha) com um campo numérico repetido (seus pixels) — também ganha uma visão de imagem: o <code>oais-structure-image</code> a grava como FITS para o Fiji/ImageJ, o SAOImage DS9 ou o Aladin, e, depois de salva no arquivo com um local de armazenamento, o próprio arquivo serve esse FITS.
preview.viewers.dataFile=Nome do arquivo de dados
preview.viewers.download=Baixar para os visualizadores (.zip)
preview.save.note=Cria Informação de Representação Estrutural/Semântica ligada a um Objeto de Dados, do mesmo jeito que o resto do arquivo modela a Informação de Representação de qualquer formato. Escolha quais das descrições geradas acima manter como Informação de Representação Estrutural — a semântica dos campos é salva de qualquer forma, como um indivíduo de Informação de Representação Semântica por campo/linha (nome semântico como seu <code>rdfs:label</code>, definição como seu <code>skos:definition</code>, unidades ligadas por <code>im:hasUnitOfMeasurement</code>), reunidos sob uma Informação de Representação Semântica geral para a descrição como um todo.
preview.filterEntities=Digite para filtrar as entidades...
preview.save.description=Salvar a descrição {0}
