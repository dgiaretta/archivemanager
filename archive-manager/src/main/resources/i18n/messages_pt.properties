# ---- Transformation ----
transform.title=Transformar {0}
transform.intro=Uma Transformação regrava este Objeto de Dados em outro formato — aqui, mapeando-o para um formato descrito no arquivo, ou <a href="#external">com outro aplicativo</a>. Aqui, ele é decodificado com sua própria Informação de Representação, cada elemento do novo formato é feito a partir dos seus elementos como você indicar abaixo, e o resultado é gravado com a descrição DFDL do novo formato. Os novos dados são então decodificados de novo com essa descrição para verificar cada Propriedade de Informação de Transformação. Fazê-lo guarda os novos dados no arquivo e registra um novo Objeto de Dados, em uma Versão do AIP cuja Informação de Proveniência registra a Transformação — este Objeto de Dados fica como está.
transform.notTransformable=Este Objeto de Dados não pode ser transformado: seus bits precisam de um local de armazenamento, e sua Informação de Representação de uma descrição DFDL, DRB SDF ou Kaitai Struct para decodificá-los.
transform.newFormat=O novo formato
transform.into=Transformá-lo em
transform.chooseFormat=Escolha um formato
transform.noTargets=Ainda não há formato para o qual transformar: é preciso uma descrição DFDL no arquivo, usada por algum Objeto de Dados. Descreva-o nas Ferramentas de RepInfo e salve-o no arquivo.
transform.choose=Escolher
transform.mapping=O que forma cada elemento do novo formato
transform.mappingNote=Um elemento que se repete ocorre uma vez para cada ocorrência do elemento do formato antigo sobre o qual se repete; dentro dele, os elementos do formato antigo sob aquele são os daquela ocorrência. Um valor é copiado (vezes uma escala, mais um deslocamento, se informados), contado ou uma constante. Os elementos foram associados primeiro pelo nome ou significado: confira-os.
