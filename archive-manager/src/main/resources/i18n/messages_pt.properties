# ---- Diagnostics ----
diag.encoding.title=Diagnóstico de codificação
diag.encoding.intro=Esta página existe para responder de vez a uma pergunta: o texto em dhivehi aparece como pontos de interrogação porque já estava corrompido antes de chegar a este aplicativo (o mais comum: uma exportação "CSV (separado por vírgulas)" do Excel, que usa a página de código ANSI do sistema e não representa a escrita thaana), ou porque algo no próprio processamento deste aplicativo está errado?
diag.encoding.testString=Texto de teste
diag.encoding.testStringNote=O texto abaixo está escrito diretamente no código-fonte Java deste aplicativo — nunca passou por um arquivo enviado, uma planilha ou algo que você digitou. Se aparecer corretamente, a exibição deste aplicativo funciona e o problema está antes, na planilha de origem. Se <em>também</em> aparecer como pontos de interrogação, o erro está no próprio processamento deste aplicativo, não nos seus dados.
diag.encoding.jvm=Configuração da JVM
diag.encoding.notUtf8=<strong>O conjunto de caracteres padrão da JVM não é UTF-8.</strong> Esta é a causa mais provável de o texto em dhivehi se corromper em algum ponto do processamento deste aplicativo (e não já no seu arquivo de origem) — o Java 17 é anterior à mudança "UTF-8 por padrão" do Java 18, então, no Windows em especial, uma JVM sem configuração usa a página de código ANSI do Windows, que não suporta thaana. Correção: inicie com <code>-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8</code> explicitamente — veja <code>run.bat</code> neste projeto, ou a seção de internacionalização do README.
diag.encoding.utf8=<strong>O conjunto de caracteres padrão da JVM é UTF-8.</strong> Essa causa está descartada; se ainda aparecem pontos de interrogação, a corrupção muito provavelmente já existia na planilha de origem antes de este aplicativo lê-la (veja a nota acima do texto de teste).
diag.encoding.defaultCharset=Conjunto de caracteres padrão
diag.encoding.os=Sistema operacional
diag.encoding.javaVersion=Versão do Java
diag.encoding.locale=Se LANG/LC_ALL/LC_CTYPE estão todos "(not set)", ou algo como <code>C</code> ou <code>POSIX</code> simples (só ASCII, sem Unicode), é um problema de configuração de localidade, independente do sistema operacional — afeta o Linux/WSL tanto quanto o Windows. <code>C.UTF-8</code> <strong>não</strong> é um desses casos — é a ordenação no estilo C com suporte completo a UTF-8, uma localidade real e capaz de Unicode, muitas vezes usada de propósito em contêineres e imagens mínimas de servidor. <code>run.sh</code> (Linux/macOS) e <code>run.bat</code> (Windows) forçam UTF-8 explicitamente na JVM, seja qual for a localidade, para os casos (Java 17 e anteriores, antes da JEP 400) em que isso importa; no Java 18+ a JVM já usa UTF-8 por padrão em todo lugar, então esse tipo de correção não tem mais o que fazer.
diag.encoding.still=Ainda vê pontos de interrogação com um envio real?
diag.encoding.stillXlsx=O texto de teste acima só exercita a metade de exibição do processamento — nunca passou pela leitura de arquivos. Se o seu arquivo de origem passa nesta página mas ainda mostra pontos de interrogação depois de importado, ou se quiser testar diretamente o arquivo que está dando problema, use o <a href="{0}">teste de leitura de XLSX</a>: envie o arquivo real e veja exatamente o que o Apache POI extrai dele, antes de qualquer outra parte deste aplicativo entrar em ação.
diag.encoding.stillTdb2=Se <em>aquela</em> página também aparece corretamente mas uma importação real ainda corrompe, o único elo restante não testado é a ida e volta do próprio armazenamento do Jena/TDB2 — nem esta página nem o teste de leitura de XLSX gravam ou leem o grafo de dados. O <a href="{0}">teste de ida e volta no TDB2</a> grava o mesmo texto em dhivehi no grafo de dados, confirma e o lê de volta em uma requisição realmente separada — a mesma ida e volta por que passam uma importação real e uma visita posterior a uma página do Catálogo.
diag.tdb2.short=Teste de ida e volta no TDB2
diag.tdb2.title=Teste de ida e volta no armazenamento TDB2
diag.tdb2.intro=Nem o texto de teste fixo da página de diagnóstico de codificação nem o teste de leitura de XLSX passam pelo Jena/TDB2 — um pula toda a leitura de arquivos, o outro pula todo o armazenamento. Esta página testa o elo restante: um texto em dhivehi sobrevive a ser gravado no grafo de dados, confirmado e lido de volta em uma requisição posterior e separada — a mesma ida e volta por que passam uma importação real e uma visita posterior a uma página do Catálogo.
diag.tdb2.expected=Esperado
diag.tdb2.readBack=O que foi lido de volta do TDB2
diag.tdb2.nothing=Nada gravado ainda — clique no botão abaixo, que grava o texto esperado acima no grafo de dados e volta imediatamente para cá em uma nova requisição, de modo que o que você vê depois é uma leitura de verdade, não só um eco do que acabou de ser enviado.
diag.tdb2.action=Gravar o texto de teste e lê-lo de volta
diag.xlsx.title=Teste de leitura de XLSX
diag.xlsx.intro=Envie o .xlsx real que está dando problema. Esta página mostra exatamente o que o Apache POI extrai das suas primeiras linhas — nada mais o toca: nem o grafo de dados, nem o armazenamento, nem a exibição. Se o texto em dhivehi já aparece como pontos de interrogação aqui, a corrupção ou já está no próprio arquivo, ou surge no momento em que este arquivo é lido (um erro de verdade, não um problema do ambiente) — de qualquer forma, acontece antes de qualquer outra parte deste aplicativo entrar em ação. Se aparece corretamente aqui mas ainda como pontos de interrogação no Catálogo depois de uma importação real, o problema está mais adiante (armazenamento ou exibição), para o que <a href="{0}">a outra página de diagnóstico</a> é a ferramenta melhor.
diag.xlsx.couldNotRead=Não foi possível ler esse arquivo.
diag.xlsx.file=Arquivo .xlsx
diag.xlsx.action=Ler as primeiras linhas
diag.xlsx.extracted=O que o POI extraiu
diag.xlsx.row=Linha {0}
diag.xlsx.empty=A planilha parece estar vazia.

