# ---- Upload, home, statistics, SPARQL console ----
upload.title=Enviar ao Catálogo
upload.heading=Envio em lote
upload.intro=Envie uma Planilha de Envio em Lote (o formato de 26 colunas da Política e Plano de Implementação de Preservação do NAM, "Upload Spreadsheet and Accession Register") como <code>.xlsx</code> ou <code>.csv</code>. Os cabeçalhos das colunas devem corresponder aos nomes dos campos da planilha (a comparação ignora maiúsculas e espaços, então <code>FixityHashSHA256</code> e <code>fixity hash sha256</code> são tratados igualmente; <code>Original Title</code> também é aceito como cabeçalho alternativo para <code>Title</code>). Campos repetíveis (Subject, Description, Contributor, Date, Type, Format, Identifier, Source, Language, Relation, Coverage, Rights, Provenance, FormatInfo, Semantics, OtherRI) aceitam vários valores em uma célula, separados por <code>;</code>.
upload.preferXlsx=<strong>Prefira .xlsx a .csv se algum dos seus dados estiver em dhivehi (ou em qualquer escrita não latina).</strong> A exportação simples "CSV (separado por vírgulas)" do Excel grava o arquivo na página de código ANSI do sistema, não em UTF-8, a menos que se escolha especificamente "CSV UTF-8 (separado por vírgulas)" -- e a página de código ANSI do Windows não representa a escrita thaana, então essa exportação substitui silenciosamente cada caractere dhivehi por um <code>?</code> literal no próprio arquivo, antes que este aplicativo o veja. Essa corrupção é permanente quando já está no CSV; enviar de novo um CSV já corrompido não a recupera, seja como for que este aplicativo trate a codificação. Enviar o <code>.xlsx</code> original evita totalmente essa etapa com perdas.
upload.rows=Cada linha se torna um documento do Catálogo. O envio inteiro se torna uma entrada do Registro de Entradas que liga todos os documentos que criou. Nenhuma coluna é obrigatória -- uma célula em branco só significa que aquela propriedade não está registrada nesta linha, o que é normal; as linhas só são ignoradas (e relatadas, não descartadas em silêncio) se algo realmente inesperado der errado ao lê-las.
upload.file=Arquivo da planilha (.xlsx ou .csv)
upload.accessionDescription=Descrição da entrada
upload.accessionExample=ex.: Transferência do Ministério da Pesca, março de 2026
upload.depositor=Depositante
upload.depositorHint=Se diferente do criador
upload.archivist=Arquivista responsável pelo registro
upload.yourName=Seu nome
upload.date=Data da entrada
upload.action=Enviar
home.title=Início
home.intro=Um pequeno aplicativo de gestão de arquivos sobre o <a href="https://www.ica.org/standards/RiC/ontology" target="_blank">RiC-O 1.1</a> e o <a href="http://ontology.oais.info/im/" target="_blank">Modelo de Informação OAIS</a>, conectados por uma ontologia de ligação própria. Os documentos são descritos nativamente em RiC-O; a visão <strong>Mapeamento OAIS</strong> de cada documento mostra as classes OAIS correspondentes e, onde os dados de exemplo ligam uma, a estrutura real de descrição de preservação OAIS do mesmo acervo.
home.storage=Os dados ficam no <a href="https://jena.apache.org/documentation/tdb2/" target="_blank">Apache Jena TDB2</a>, um armazenamento de triplas transacional gravado em disco, em <code>{0}</code>. Cada alteração é confirmada como parte da requisição que a fez — não há etapa separada de salvar, e ela sobrevive a reinícios.
home.download.bridge=Baixar a ontologia de ligação (.ttl)
home.download.oais=Baixar a ontologia OAIS (.ttl)
home.download.extensions=Baixar as extensões locais do OAIS (.ttl)
home.card.catalogue=Catálogo do NAM — pesquisa pública, sem precisar entrar
home.card.register=Registro de Entradas do NAM — público, sem precisar entrar
home.card.records=Documentos / Partes de documentos / Conjuntos de documentos
home.card.entities=Navegar e editar todas as entidades (qualquer classe RiC-O ou OAIS)
home.card.triples=Triplas no grafo de dados — abrir o console SPARQL
home.card.graph=Grafo interativo de relacionamentos
statistics.intro=Como as classes e propriedades são de fato usadas em todo o grafo de dados agora, não uma lista estática do que as ontologias definem. Tudo o que tem zero indivíduos ou zero usos fica de fora, em vez de encher estas tabelas de linhas quase vazias. Para uma visão visual, por documento, dos relacionamentos em vez de contagens agregadas, veja o <a href="{0}">grafo</a>, cujos controles de destaque por tipo de entidade e tipo de relacionamento complementam bem estas tabelas.
statistics.types=Tipos de entidade em uso
statistics.properties=Propriedades em uso
statistics.propertiesNote=Contagem de triplas por propriedade; quando difere do número de documentos distintos que a usam, isso é indicado — sinal de que o campo é repetível e vários documentos têm mais de um valor.
