resource.package=Seu pacote
resource.storedAs=Está armazenado como um pacote,
resource.mapPackage=Mapear seu pacote para os componentes do AIP
resource.mapPackageNote=Abre o pacote, verifica seu bag e mostra onde está nele cada componente que o OAIS exige de um AIP — a planilha de envio, METS/PREMIS, checksums — e o que diz lá.
resource.writeOut=Exportá-lo
resource.bagit=Baixar como BagIt
resource.bagitRefer=BagIt, referindo-se aos bits
resource.bagitNote=Este Pacote de Informação de Arquivamento como um bag BagIt (RFC 8493), compactado: <code>data/aip.ttl</code> descreve o AIP e tudo de que é feito, com os bits dos seus Objetos de Dados, cada descrição como um arquivo e as ontologias OAIS, tudo com checksums SHA-256 — completo, para entregar a outro arquivo. Ou refira-se aos bits dos Objetos de Dados em vez de incluí-los: <code>fetch.txt</code> dá a URL de onde buscar cada um (seu local de armazenamento), para dados grandes ou bits guardados onde o destinatário pode buscá-los; o manifesto continua com seus checksums, então o bag fica completo depois de buscados.
resource.aipComplete=Este AIP tem todos os componentes que o OAIS exige.
resource.aipIncomplete=Faltam a este AIP componentes que o OAIS exige.
resource.aipNote=O bag nomeia cada um em <code>oais-aip-components.txt</code> e diz o que falta em <code>bag-info.txt</code>. Acrescente o que falta com o <a href="{0}">editor</a>.
resource.aipMayHold=Estes são os componentes descritos no arquivo; o pacote deste AIP pode conter o resto — <a href="{0}">veja o que há nele</a>.
