sparql.intro=Executa consultas SELECT sobre a união do grafo de dados do arquivo e do grafo de ontologias (esquema OAIS + ontologia de ligação), para consultar juntos os dados das instâncias e os mapeamentos da ponte no nível do esquema (ex.: <code>skos:closeMatch</code>, <code>bridge:mappingRationale</code>). Só consultas SELECT são aceitas aqui.
