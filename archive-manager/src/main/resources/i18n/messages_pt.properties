hand.addIn.intro=Escreva código Python para o driver drb-python gerado chamar, para o que a árvore de elementos não consegue expressar. O driver continua lendo a árvore de elementos; o complemento se encaixa em volta dela, por meio de qualquer uma destas funções:
hand.addIn.prepare=<code>prepare(data)</code> — recebe os bytes do arquivo antes de serem lidos e devolve os bytes a ler: decifre ou descomprima-os aqui.
hand.addIn.check=<code>check(root)</code> — depois da decodificação: devolve uma lista de problemas (checksums, CRCs, verificações cruzadas), somada ao que o complemento <code>checks</code> relata.
hand.addIn.metadata=<code>metadata(root)</code> — devolve um dicionário mesclado ao que o complemento <code>metadata</code> devolve.
hand.addIn.restore=<code>restore(data)</code> — quando o arquivo é regravado: desfaz o <code>prepare()</code> (ex.: cifra de novo), devolvendo os bytes a gravar.
hand.addIn.root=<code>root.original_bytes</code> são os bytes do arquivo, <code>root.decoded_bytes</code> o que <code>prepare()</code> devolveu, e os filhos de <code>root</code> os elementos decodificados. O complemento é o <code>addin.py</code> do pacote baixado, e é salvo no arquivo junto com o driver.
hand.addIn.risk=Um complemento é código Python, que roda com todos os direitos de quem usa o driver. Verifica-se que é Python válido, mas não é possível verificar que é seguro.
hand.addIn.runs=Este servidor executa complementos nos testes com amostras.
hand.addIn.doesNotRun=Este servidor não executa complementos nos testes com amostras (<code>archive.drb-python.run-hand-written-add-ins</code>), então teste o pacote baixado em outro lugar.
hand.intro=Escreva você mesmo a descrição em {0}, para o que a árvore de elementos do editor não consegue expressar — checksums, cifragem, outras compressões, registros espalhados por várias linhas e tudo o mais que a linguagem permite. Depois de salva, ela substitui a descrição gerada na pré-visualização, no teste com amostra, no download e ao salvar no arquivo. A árvore de elementos continua fornecendo os significados (nomes semânticos, unidades, códigos) salvos como Informação de Representação Semântica, mas o teste com amostra de uma descrição escrita à mão mostra a árvore do próprio mecanismo, em vez de alinhá-la com a árvore de elementos.
hand.checked=Um teste com amostra executa a descrição dentro deste aplicativo, então ela é verificada antes: nada de DOCTYPE nem arquivos incluídos de outro lugar (o DFDL pode incluir os esquemas embutidos do próprio Daffodil); no Kaitai Struct, nada de <code>imports</code> nem rotinas <code>process:</code> próprias (zlib, xor, rol e ror são embutidas); no DRB, nada de consultas que chamem Java ou leiam arquivos.
hand.outOfDate=A árvore de elementos mudou desde que isto foi escrito, então o que ela gera agora é diferente. Verifique se a descrição escrita à mão precisa da mesma mudança.
