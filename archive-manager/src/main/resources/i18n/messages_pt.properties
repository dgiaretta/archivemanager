transform.kind.copy=cópia
transform.kind.count=contagem de
transform.asText=O mapeamento como texto
transform.asTextNote=É o que é registrado com a Transformação. Você pode editá-lo aqui em vez de acima: uma regra por linha — <code>for star in stars.entry</code>, <code>star.ra = stars.entry.ra</code>, <code>star.ra_rad = stars.entry.ra * 0.0174532925</code>, <code>n = count(stars.entry)</code>, <code>version = "2"</code>.
transform.useText=Usar este texto, não a tabela acima
transform.properties=Propriedades de Informação de Transformação a verificar
transform.propertiesNote=Os valores que precisam sobreviver à Transformação. Cada um é verificado decodificando os novos dados com sua própria descrição e comparando os valores físicos (depois da escala e do deslocamento de cada lado) — dentro da tolerância informada, nas unidades dos valores, ou então do que os tipos comportam. Os que o Objeto de Informação deste Objeto de Dados já tem estão marcados; os outros são acrescentados a ele quando você transforma.
transform.col.check=Verificar
transform.col.valuesOf=Valores de
transform.col.tolerance=Tolerância
transform.tip=Propriedade de Informação de Transformação
transform.try=Experimentar
transform.external=Ou transforme-o com outro aplicativo
transform.externalNote=Se outro aplicativo faz a Transformação — um conversor de formatos, um script, o software da própria missão — baixe os dados e sua descrição, transforme-os lá, depois envie o resultado aqui e diga o que foi feito. Esse registro se torna a Informação de Proveniência da nova Versão do AIP, para que quem o ler depois saiba como os dados surgiram.
transform.downloadData=1. Baixar os dados
