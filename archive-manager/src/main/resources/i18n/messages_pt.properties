resource.col.individuals=Indivíduos
resource.downloadDescription=Baixar a descrição dos dados
resource.downloadDescriptionNote=Sua Informação de Representação, com tudo de que precisa, como um zip: <code>description.ttl</code> e cada descrição de estrutura e especificação de visão (DFDL, Kaitai Struct, DRB, ...) como um arquivo.
resource.openData=Abrir os dados
resource.openDataNote=Os bits deste Objeto de Dados têm um local de armazenamento, e sua Informação de Representação diz como lê-los. Seu <a href="{0}">manifesto de Informação de Representação</a> (Turtle) nomeia os dados e cada descrição explicitamente; o TOPCAT (com o leitor <code>oais-structure-topcat</code>, formato <code>OAIS-RepInfo</code>) e o SPLAT o abrem por esse endereço.
viewer.viewWith=Ver com {0}
resource.fitsFile=Arquivo FITS
resource.fitsNote=Sua Informação de Representação diz que é um arquivo FITS (PRONOM x-fmt/383), e seus cabeçalhos dizem o que contém: o TOPCAT é oferecido para as tabelas, o DS9 e o Aladin para as imagens. Eles leem o próprio arquivo FITS, como ele é, enviado a eles rodando no seu computador (por SAMP) — a não ser que sua Informação de Representação descreva este arquivo em particular, com uma visão de tabela ou de imagem: então recebem-no decodificado no servidor, com as colunas nomeadas e com suas unidades. O link "Arquivo FITS" funciona em qualquer leitor de FITS.
resource.describeFits=Descrever este arquivo FITS a partir dos cabeçalhos
resource.describeFitsNote=nas Ferramentas de RepInfo: suas colunas e pixels tipados, nomeados e com suas unidades e significados, e os significados das palavras-chave do dicionário de palavras-chave FITS — para salvar como Informação de Representação deste Objeto de Dados, para o arquivo decodificá-lo, mostrar sua tabela e imagem e imprimir seus valores.
resource.tableNote="Ver com TOPCAT" ou "SPLAT" envia os dados, decodificados no servidor como VOTable, para esse aplicativo rodando no seu computador (por SAMP; ele pede que você autorize esta página). O SPLAT é oferecido quando todas as colunas da tabela são numéricas, como as de um espectro. O link VOTable funciona em qualquer ferramenta do OV. As mesmas opções estão no menu de clique direito do Objeto de Dados no grafo.
resource.imageNote=Sua Informação de Representação também diz como vê-lo como imagem. "Ver com DS9" ou "Aladin" envia a imagem, decodificada no servidor como FITS, para esse aplicativo rodando no seu computador (por SAMP). O Fiji/ImageJ não usa SAMP: abra nele o arquivo do link FITS, ou dê a ele o endereço do link em File &rsaquo; Import &rsaquo; URL. O cabeçalho FITS traz as unidades e o significado dos pixels.
resource.launch=Iniciar o {0}
resource.launchNote=Não tem TOPCAT nem SPLAT no seu computador? "Iniciar" abre o aplicativo já com estes dados carregados, baixado do arquivo, sem nada a instalar ou conectar — uma vez que você tenha o <a href="https://openwebstart.com/" target="_blank" rel="noopener">OpenWebStart</a> (gratuito, instalado uma vez; ele abre o arquivo <code>.jnlp</code> que o link baixa). O aplicativo é assinado com o <a href="{0}">certificado autoassinado</a> deste arquivo: na primeira vez, o OpenWebStart pergunta se deve confiar nele; escolha confiar sempre neste editor, e as próximas vezes não vão perguntar.
values.title=Ver os valores aqui
values.note=Decodifica os dados no servidor por meio da sua Informação de Representação e imprime cada valor, com onde está nos bits e o que significa (seu significado, o significado de um código, um valor escalonado com suas unidades), como as Ferramentas de RepInfo fazem com um arquivo de amostra — uma página por vez, para um arquivo grande não sobrecarregar o navegador. A primeira página de um arquivo grande leva um tempo para decodificar; as seguintes, não.
