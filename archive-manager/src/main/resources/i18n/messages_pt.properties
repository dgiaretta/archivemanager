writeBack.title=Regravar
writeBack.intro=Decodifica um arquivo de amostra, depois o regrava com a descrição acima e compara os dois. Sem alterações, é uma ida e volta: bytes idênticos significam que a descrição basta para recriar o arquivo a partir dos valores decodificados. Para gravar um arquivo alterado, informe as alterações em linhas <code>caminho = valor</code>, ex.: <code>/header/count = 3</code>, nomeando os elementos como no teste acima (<code>/sample[2]</code> para o segundo de um elemento repetido). Contagens e comprimentos têm de ser alterados para corresponder.
writeBack.changes=Alterações (opcional)
writeBack.failed=não pôde ser regravado.
writeBack.writtenChanged=({0} bytes) regravado com as alterações:
writeBack.writtenUnchanged=({0} bytes) regravado sem alterações:
writeBack.identical=A descrição cobre toda a amostra e codifica cada valor do jeito que a amostra o armazena.
writeBack.different=Algo na amostra não está descrito, ou não é regravado do jeito que está armazenado: bytes depois dos dados descritos não são gravados, números em texto podem ser gravados de outra forma (<code>1.50</code> como <code>1.5</code>), e dados comprimidos podem ser comprimidos de outro jeito.
writeBack.download=Baixar o arquivo gravado
