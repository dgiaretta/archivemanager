# ---- RepInfo Tools: start page ----
start.intro=Build a Kaitai Struct (.ksy), DFDL (.dfdl.xsd), DRB (SDF schema or drb-python driver) and/or EAST (.east) description for a scientific data format, and give each field a semantic name, a definition, and units -- then save it into the archive as real OAIS Representation Information: Structure Representation Information for the byte/logical layout, and Semantic Representation Information, one individual per field, for what each one means.
start.inProgress=You have a description in progress.
start.resume=Resume editing
start.discardConfirm=Discard the in-progress description? This cannot be undone.
start.discard=Discard it
start.fromTemplate=Start from a template
start.csv=CSV table
start.csv.note=Delimited text: one comma-separated reading per line to the end of the file, with units, a scale factor, a valid range and a fill value on its columns.
start.csv.action=Start from CSV example
start.fits.note=Primary header + data unit, pre-populated with the FITS Standard's required keyword cards (SIMPLE, BITPIX, NAXIS...) and their real meanings.
start.fits.action=Start from FITS
start.hdf5.note=A worked-example logical schema (group/dataset/attribute) to replace with your own tree -- HDF5 has no fixed universal layout to template byte-for-byte.
start.hdf5.action=Start from HDF5 example
start.telemetry=Telemetry packets
start.telemetry.note=A worked binary example using counts, a choice on a packet type, a length-prefixed message, a conditional checksum, and scaled values with units and code lists.
start.telemetry.action=Start from telemetry example
start.fitsHeaders=Or describe a FITS file from its headers
start.fitsHeaders.note=A FITS file describes itself: its headers say what each HDU holds. Its headers become a description of that file in particular — each header a record of its keyword records, each pointing to the keyword's meaning in the FITS keyword dictionary (FITS Standard 4.0); each image as rows of pixels, typed by BITPIX, with BUNIT, BSCALE, BZERO and BLANK as their units, scale, offset and fill value; each table's columns typed by TFORMn and named by TTYPEn, with TUNITn, TSCALn, TZEROn, TNULLn, TLMINn and TLMAXn. Then the archive can decode it, show its table and image, and say what its columns mean. Only the headers are read. A Data Object whose Representation Information says it's FITS can be described the same way from its page.
start.fitsError=The FITS file couldn't be described.
start.fitsFile=FITS file
start.fitsHeaders.action=Describe it from its headers
start.east=Or read a description in EAST
start.east.note=A Data Description Record in the CCSDS data description language EAST (CCSDS 644.0-B-3): its logical package and its physical package. It's kept as written, and tested with the EAST interpreter. Its records, arrays, enumerations and variants also become the element tree, with each enumeration's literals as the meanings of its codes, so Kaitai Struct, DFDL and DRB descriptions can be generated from it and tested against sample data too - when the tree can express it; if not, it's kept as EAST only.
start.eastError=The EAST description couldn't be read.
start.eastFile=EAST file
start.orPaste=or paste it
start.east.action=Read the EAST description
start.byHand=Or write a description by hand
