hand.title=Write by hand
repinfo.backToEditor=Back to editor
repinfo.preview=Preview
hand.heading={0}: {1} by hand
hand.headingAddIn={0}: {1} add-in
hand.addIn.intro=Write Python code for the generated drb-python driver to call, for what the element tree can't express. The driver still reads the element tree; the add-in plugs in around it, through any of these functions:
hand.addIn.prepare=<code>prepare(data)</code> — gets the file's bytes before they're read, and returns the bytes to read: decrypt or decompress them here.
hand.addIn.check=<code>check(root)</code> — after decoding: returns a list of problems (checksums, CRCs, cross-checks), added to what the <code>checks</code> add-on reports.
hand.addIn.metadata=<code>metadata(root)</code> — returns a dict merged into what the <code>metadata</code> add-on returns.
hand.addIn.restore=<code>restore(data)</code> — when the file is written back: undoes <code>prepare()</code> (e.g. encrypts again), returning the bytes to write.
hand.addIn.root=<code>root.original_bytes</code> are the file's bytes, <code>root.decoded_bytes</code> what <code>prepare()</code> returned, and <code>root</code>'s children the decoded elements. The add-in is <code>addin.py</code> in the downloaded package, and is saved to the archive with the driver.
hand.addIn.risk=An add-in is Python code, which runs with the full rights of whoever uses the driver. It's checked to be valid Python, but it can't be checked to be safe.
hand.addIn.runs=This server runs add-ins in sample tests.
hand.addIn.doesNotRun=This server doesn't run add-ins in sample tests (<code>archive.drb-python.run-hand-written-add-ins</code>), so test the downloaded package elsewhere.
hand.intro=Write the {0} description yourself, for what the editor''s element tree can''t express — checksums, encryption, other compression, records spread over several lines, and anything else the language can do. Once saved, it replaces the generated description in the preview, the sample test, the download and when saving to the archive. The element tree still provides the meanings (semantic names, units, codes) saved as Semantic Representation Information, but a sample test of a hand-written description shows the engine''s own tree rather than lining it up with the element tree.
hand.checked=A sample test runs the description inside this application, so it's checked first: no DOCTYPE or files included from elsewhere (DFDL may include Daffodil's own built-in schemas); for Kaitai Struct, no <code>imports</code> or custom <code>process:</code> routines (zlib, xor, rol and ror are built in); for DRB, no queries calling Java or reading files.
hand.outOfDate=The element tree has changed since this was written, so what it generates now is different. Check whether the hand-written description needs the same change.
hand.description={0} description
hand.save=Save and preview
hand.removeAddIn=Remove the add-in
hand.discard=Discard the hand-written version, use the generated one
hand.examples=Examples
hand.examplesNote=Each has been run on sample data by this application's tests.
hand.loadExample=Load this example into the editor
