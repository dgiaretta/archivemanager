# ---- Diagnostics ----
diag.encoding.title=Encoding diagnostics
diag.encoding.intro=This page exists to answer one question definitively: is Dhivehi text showing as question marks because it was already corrupted before reaching this app (most commonly, an Excel "CSV (Comma delimited)" export, which uses the system's ANSI code page and has no representation for Thaana script at all), or because something in this app's own pipeline is at fault?
diag.encoding.testString=Test string
diag.encoding.testStringNote=The text below is written directly into this app's Java source code — it never touched an uploaded file, a spreadsheet, or anything you typed. If it displays correctly, this app's rendering pipeline works and the problem is upstream, in the source spreadsheet. If it <em>also</em> shows as question marks, the bug is in this app's own pipeline, not your data.
diag.encoding.jvm=JVM configuration
diag.encoding.notUtf8=<strong>The JVM's default charset is not UTF-8.</strong> This is the single most likely cause of Dhivehi text corrupting somewhere in this app's own pipeline (as opposed to already being corrupted in your source file) — Java 17 predates Java 18's "UTF-8 by default" change, so on Windows specifically, an unconfigured JVM falls back to the Windows ANSI code page, which has no Thaana support at all. Fix: launch with <code>-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8</code> explicitly — see <code>run.bat</code> in this project, or the README's internationalisation section.
diag.encoding.utf8=<strong>The JVM's default charset is UTF-8.</strong> That specific cause is ruled out; if question marks are still appearing, the corruption most likely already existed in the source spreadsheet before this app read it (see the note above the test string).
diag.encoding.defaultCharset=Default charset
diag.encoding.os=OS
diag.encoding.javaVersion=Java version
diag.encoding.locale=If LANG/LC_ALL/LC_CTYPE are all "(not set)", or something like plain <code>C</code> or <code>POSIX</code> (ASCII-only, no Unicode support), that's a locale configuration issue independent of which OS this is running on — it affects Linux/WSL exactly as much as Windows. <code>C.UTF-8</code> specifically is <strong>not</strong> one of those cases — it's C-style collation with full UTF-8 character support, a real and correctly Unicode-capable locale often used deliberately in containers and minimal server images. <code>run.sh</code> (Linux/macOS) and <code>run.bat</code> (Windows) force UTF-8 explicitly at the JVM level regardless of the surrounding locale, for the (Java 17 and earlier, pre-JEP-400) cases where it matters; on Java 18+ the JVM already defaults to UTF-8 everywhere, so this class of fix has nothing left to do.
diag.encoding.still=Still seeing question marks with a real upload?
diag.encoding.stillXlsx=The test string above only exercises the rendering half of the pipeline — it never went through file reading at all. If your source file passes this page but still shows question marks after importing it, or if you want to test the exact file that''s giving you trouble directly, use the <a href="{0}">XLSX read test</a>: upload the actual file and see precisely what Apache POI extracts from it, before anything else in this app gets involved.
diag.encoding.stillTdb2=If <em>that</em> page also renders correctly but a real import still corrupts, the one remaining untested link is Jena/TDB2''s own storage round trip — neither this page nor the XLSX read test actually writes to or reads from the data graph at all. The <a href="{0}">TDB2 round-trip test</a> writes the same Dhivehi string into the data graph, commits, and reads it back in a genuinely separate request — the same round trip a real import and a later Catalogue page view go through.
diag.tdb2.short=TDB2 round-trip test
diag.tdb2.title=TDB2 storage round-trip test
diag.tdb2.intro=Neither the hardcoded test string on the encoding diagnostics page nor the XLSX read test actually goes through Jena/TDB2 at all — one skips file reading entirely, the other skips storage entirely. This page tests the one remaining link: does a Dhivehi string survive being written to the data graph, committed, and read back in a later, separate request — the same round trip a real import and a later Catalogue page view go through.
diag.tdb2.expected=Expected
diag.tdb2.readBack=What was read back from TDB2
diag.tdb2.nothing=Nothing written yet — click the button below, which writes the expected string above into the data graph and immediately redirects back here as a fresh request, so what you see after is a genuine read-back, not just an echo of what was just submitted.
diag.tdb2.action=Write test string, then read it back
diag.xlsx.title=XLSX read test
diag.xlsx.intro=Upload the actual .xlsx you''re having trouble with. This shows exactly what Apache POI extracts from its first few rows — nothing else touches it: no data graph, no storage, no rendering pipeline. If Dhivehi text already shows as question marks here, the corruption is either already in the file itself, or introduced the moment this specific file is read (a genuine bug, not an environment issue) — either way, it''s happening before any other part of this app gets involved. If it displays correctly here but still shows as question marks in the Catalogue after a real import, the problem is further down the pipeline (storage or rendering), which <a href="{0}">the other diagnostic page</a> is the better tool for.
diag.xlsx.couldNotRead=Could not read that file.
diag.xlsx.file=.xlsx file
diag.xlsx.action=Read first rows
diag.xlsx.extracted=What POI extracted
diag.xlsx.row=Row {0}
diag.xlsx.empty=The sheet appears to be empty.

