resource.fitsFile=FITS file
resource.fitsNote=Its Representation Information says it's a FITS file (PRONOM x-fmt/383), and its headers say what it holds: TOPCAT is offered for its tables, DS9 and Aladin for its images. They read the FITS file itself, as it is, sent to them running on your computer (over SAMP) — unless its Representation Information describes this file in particular, with a table or image view: then they're sent it decoded on the server, its columns named and with their units. The "FITS file" link works in any FITS reader.
resource.describeFits=Describe this FITS file from its headers
resource.describeFitsNote=in RepInfo Tools: its columns and pixels typed, named and given their units and meanings, and its keywords' meanings from the FITS keyword dictionary — to save as Representation Information of this Data Object, for the archive to decode it, view its table and image and print its values.
resource.tableNote="View with TOPCAT" or "SPLAT" sends the data, decoded on the server as a VOTable, to that application running on your computer (over SAMP; it asks you to allow this page). SPLAT is offered when the table's columns are all numeric, as a spectrum's are. The VOTable link works in any VO tool. The same choices are on the Data Object's right-click menu in the graph.
resource.imageNote=Its Representation Information also says how to see it as an image. "View with DS9" or "Aladin" sends the image, decoded on the server as FITS, to that application running on your computer (over SAMP). Fiji/ImageJ doesn't use SAMP: open the FITS link's file in it, or give it the link's address with File &rsaquo; Import &rsaquo; URL. The FITS header carries the pixels' units and meaning.
resource.launch=Launch {0}
resource.launchNote=No TOPCAT or SPLAT on your computer? "Launch" starts the application with this data already loaded, downloaded from the archive, with nothing to install or connect — once you have <a href="https://openwebstart.com/" target="_blank" rel="noopener">OpenWebStart</a> (free, installed once; it opens the <code>.jnlp</code> file the link downloads). The application is signed with this archive''s own <a href="{0}">self-signed certificate</a>: the first time, OpenWebStart asks whether to trust it; choose to always trust this publisher, and later launches won''t ask.
