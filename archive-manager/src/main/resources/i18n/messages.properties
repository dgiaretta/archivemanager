home.title=Home
home.intro=A small archive-management application over <a href="https://www.ica.org/standards/RiC/ontology" target="_blank">RiC-O 1.1</a> and the <a href="http://ontology.oais.info/im/" target="_blank">OAIS Information Model</a>, connected by a custom bridging ontology. Records are described natively in RiC-O; the <strong>OAIS mapping</strong> view on each record shows the corresponding OAIS classes and, where the sample data links one, the actual OAIS preservation-description structure for the same holdings.
home.storage=Data lives in <a href="https://jena.apache.org/documentation/tdb2/" target="_blank">Apache Jena TDB2</a>, a real disk-backed transactional triple store, at <code>{0}</code>. Every change commits as part of the request that made it — there''s no separate save step, and it survives restarts.
