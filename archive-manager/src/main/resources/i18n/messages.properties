transform.title=Transform {0}
transform.intro=A Transformation rewrites this Data Object in another format — here, by mapping it to a format described in the archive, or <a href="#external">with another application</a>. Here, it is decoded with its own Representation Information, each element of the new format is made from its elements as you say below, and the result is written with the new format's DFDL description. The new data is then decoded again with that description to check each Transformation Information Property. Doing it keeps the new data in the archive and records a new Data Object, in an AIP Version whose Provenance Information records the Transformation — this Data Object is left as it is.
