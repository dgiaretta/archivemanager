writeBack.title=Riscrivi
writeBack.intro=Decodifica un file di esempio, poi lo riscrive con la descrizione qui sopra e confronta i due. Senza modifiche è un'andata e ritorno: byte identici significano che la descrizione basta a ricreare il file dai valori decodificati. Per scrivere un file modificato, indica le modifiche come righe <code>percorso = valore</code>, es. <code>/header/count = 3</code>, nominando gli elementi come nella prova qui sopra (<code>/sample[2]</code> per il secondo di un elemento ripetuto). Conteggi e lunghezze vanno modificati di conseguenza.
writeBack.changes=Modifiche (facoltative)
writeBack.failed=non è stato possibile riscriverlo.
writeBack.writtenChanged=({0} byte) riscritto con le modifiche:
writeBack.writtenUnchanged=({0} byte) riscritto senza modifiche:
writeBack.identical=La descrizione copre tutto il campione e codifica ogni valore come lo memorizza il campione.
writeBack.different=Qualcosa nel campione non è descritto, o non viene riscritto come è memorizzato: i byte dopo i dati descritti non vengono scritti, i numeri in testo possono essere scritti in un'altra forma (<code>1.50</code> come <code>1.5</code>) e i dati compressi possono essere compressi diversamente.
