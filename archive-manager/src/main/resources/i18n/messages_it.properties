upload.title=Carica nel Catalogo
upload.heading=Caricamento in blocco
upload.intro=Carica un Foglio di Caricamento in Blocco (il formato a 26 colonne della Politica e del Piano di Attuazione della Conservazione del NAM, "Upload Spreadsheet and Accession Register") come <code>.xlsx</code> o <code>.csv</code>. Le intestazioni delle colonne devono corrispondere ai nomi dei campi del foglio (il confronto ignora maiuscole e spazi, quindi <code>FixityHashSHA256</code> e <code>fixity hash sha256</code> sono trattati allo stesso modo; <code>Original Title</code> è accettato anche come intestazione alternativa di <code>Title</code>). I campi ripetibili (Subject, Description, Contributor, Date, Type, Format, Identifier, Source, Language, Relation, Coverage, Rights, Provenance, FormatInfo, Semantics, OtherRI) accettano più valori in una cella, separati da <code>;</code>.
upload.preferXlsx=<strong>Preferisci .xlsx a .csv se qualcuno dei tuoi dati è in dhivehi (o in qualsiasi scrittura non latina).</strong> L'esportazione semplice "CSV (delimitato da virgole)" di Excel scrive il file con la code page ANSI del sistema, non in UTF-8, a meno di scegliere espressamente "CSV UTF-8 (delimitato da virgole)" -- e la code page ANSI di Windows non rappresenta affatto la scrittura thaana, quindi quell'esportazione sostituisce in silenzio ogni carattere dhivehi con un <code>?</code> letterale nel file stesso, prima ancora che questa applicazione lo veda. Una volta nel CSV, quel danno è permanente; ricaricare un CSV già danneggiato non lo recupera, comunque questa applicazione gestisca la codifica. Caricare l'<code>.xlsx</code> originale evita del tutto il passaggio con perdita.
upload.rows=Ogni riga diventa un documento del Catalogo. L'intero caricamento diventa una voce del Registro degli ingressi che collega ogni documento creato. Nessuna colonna è obbligatoria -- una cella vuota significa solo che quella proprietà non è registrata per quella riga, il che è normale; le righe vengono saltate (e segnalate, non scartate in silenzio) solo se qualcosa di davvero inatteso va storto nel leggerle.
