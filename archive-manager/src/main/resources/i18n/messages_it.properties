resource.downloadDescription=Scarica la descrizione dei dati
resource.downloadDescriptionNote=Le sue Informazioni di Rappresentazione, con tutto ciò di cui hanno bisogno, come zip: <code>description.ttl</code> e ogni descrizione della struttura e specifica di vista (DFDL, Kaitai Struct, DRB, ...) come file.
resource.openData=Apri i dati
resource.openDataNote=I bit di questo Oggetto Dati hanno una posizione di memorizzazione, e le sue Informazioni di Rappresentazione dicono come leggerli. Il suo <a href="{0}">manifesto di Informazioni di Rappresentazione</a> (Turtle) nomina esplicitamente i dati e ogni descrizione; TOPCAT (con il lettore <code>oais-structure-topcat</code>, formato <code>OAIS-RepInfo</code>) e SPLAT lo aprono da quell''indirizzo.
viewer.viewWith=Vedi con {0}
resource.fitsFile=File FITS
resource.fitsNote=Le sue Informazioni di Rappresentazione dicono che è un file FITS (PRONOM x-fmt/383), e i suoi header dicono cosa contiene: TOPCAT è offerto per le sue tabelle, DS9 e Aladin per le sue immagini. Leggono il file FITS stesso, così com'è, inviato a loro in esecuzione sul tuo computer (via SAMP) — a meno che le sue Informazioni di Rappresentazione descrivano questo file in particolare, con una vista tabellare o immagine: allora lo ricevono decodificato sul server, con le colonne nominate e con le loro unità. Il link "File FITS" funziona con qualsiasi lettore FITS.
resource.describeFits=Descrivi questo file FITS dai suoi header
resource.describeFitsNote=negli Strumenti RepInfo: le sue colonne e i suoi pixel tipizzati, nominati e con le loro unità e significati, e i significati delle sue parole chiave dal dizionario delle parole chiave FITS — da salvare come Informazioni di Rappresentazione di questo Oggetto Dati, perché l'archivio lo decodifichi, ne mostri la tabella e l'immagine e ne stampi i valori.
resource.tableNote="Vedi con TOPCAT" o "SPLAT" invia i dati, decodificati sul server come VOTable, a quell'applicazione in esecuzione sul tuo computer (via SAMP; ti chiede di autorizzare questa pagina). SPLAT è offerto quando le colonne della tabella sono tutte numeriche, come quelle di uno spettro. Il link VOTable funziona con qualsiasi strumento VO. Le stesse scelte sono nel menu del clic destro dell'Oggetto Dati nel grafo.
resource.imageNote=Le sue Informazioni di Rappresentazione dicono anche come vederlo come immagine. "Vedi con DS9" o "Aladin" invia l'immagine, decodificata sul server come FITS, a quell'applicazione in esecuzione sul tuo computer (via SAMP). Fiji/ImageJ non usa SAMP: aprici il file del link FITS, o dagli l'indirizzo del link con File &rsaquo; Import &rsaquo; URL. L'header FITS porta le unità e il significato dei pixel.
resource.launch=Avvia {0}
resource.launchNote=Non hai TOPCAT o SPLAT sul tuo computer? "Avvia" apre l''applicazione con questi dati già caricati, scaricata dall''archivio, senza nulla da installare o collegare — una volta che hai <a href="https://openwebstart.com/" target="_blank" rel="noopener">OpenWebStart</a> (gratuito, si installa una volta; apre il file <code>.jnlp</code> che il link scarica). L''applicazione è firmata con il <a href="{0}">certificato autofirmato</a> di questo archivio: la prima volta, OpenWebStart chiede se fidarsene; scegli di fidarti sempre di questo editore, e gli avvii successivi non chiederanno più.
