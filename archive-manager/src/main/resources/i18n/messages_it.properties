transform.propertiesNote=I valori che devono sopravvivere alla Trasformazione. Ognuno viene verificato decodificando i nuovi dati con la loro descrizione e confrontando i valori fisici (dopo la scala e l'offset di ciascun lato) — entro la tolleranza indicata, nelle unità dei valori, o altrimenti ciò che i tipi consentono. Quelle che l'Oggetto Informativo di questo Oggetto Dati ha già sono segnate; le altre gli vengono aggiunte quando trasformi.
