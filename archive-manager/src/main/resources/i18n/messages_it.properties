resource.storedAs=È conservato come pacchetto,
resource.mapPackage=Mappa il suo pacchetto sui componenti dell'AIP
resource.mapPackageNote=Apre il pacchetto, ne verifica il bag e mostra dove si trova ogni componente che l'OAIS richiede a un AIP — il foglio di caricamento, METS/PREMIS, i checksum — e cosa vi si dice.
resource.writeOut=Esportalo
resource.bagit=Scarica come BagIt
resource.bagitRefer=BagIt, con riferimento ai bit
resource.bagitNote=Questo Pacchetto di Informazioni di Archiviazione come bag BagIt (RFC 8493), compresso: <code>data/aip.ttl</code> descrive l'AIP e tutto ciò di cui è fatto, con i bit dei suoi Oggetti Dati, ogni descrizione come file e le ontologie OAIS, tutto con checksum SHA-256 — completo, da consegnare a un altro archivio. Oppure fai riferimento ai bit degli Oggetti Dati invece di includerli: <code>fetch.txt</code> indica l'URL da cui prelevare ciascuno (la sua posizione di memorizzazione), per dati grandi o bit tenuti dove il destinatario può prelevarli; il manifesto conserva i loro checksum, quindi il bag è completo una volta prelevati.
resource.aipComplete=Questo AIP ha ogni componente che l'OAIS richiede.
resource.aipIncomplete=A questo AIP mancano componenti che l'OAIS richiede.
resource.aipNote=Il bag nomina ognuno in <code>oais-aip-components.txt</code> e dice cosa manca in <code>bag-info.txt</code>. Aggiungi ciò che manca con l''<a href="{0}">editor</a>.
resource.aipMayHold=Questi sono i componenti descritti nell''archivio; il pacchetto di questo AIP può contenere il resto — <a href="{0}">guarda cosa contiene</a>.
