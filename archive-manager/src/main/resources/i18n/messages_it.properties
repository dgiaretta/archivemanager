diag.encoding.title=Diagnostica della codifica
diag.encoding.intro=Questa pagina esiste per rispondere in modo definitivo a una domanda: il testo dhivehi appare come punti interrogativi perché era già danneggiato prima di arrivare a questa applicazione (di solito, un'esportazione "CSV (delimitato da virgole)" di Excel, che usa la code page ANSI del sistema e non rappresenta affatto la scrittura thaana), o perché qualcosa nel funzionamento di questa applicazione non va?
diag.encoding.testString=Testo di prova
diag.encoding.testStringNote=Il testo qui sotto è scritto direttamente nel codice sorgente Java di questa applicazione — non è mai passato per un file caricato, un foglio di calcolo o qualcosa che hai digitato. Se appare correttamente, la visualizzazione di questa applicazione funziona e il problema sta a monte, nel foglio di origine. Se <em>anche</em> questo appare come punti interrogativi, l'errore è nel funzionamento di questa applicazione, non nei tuoi dati.
diag.encoding.jvm=Configurazione della JVM
diag.encoding.notUtf8=<strong>Il set di caratteri predefinito della JVM non è UTF-8.</strong> È la causa più probabile di un testo dhivehi che si danneggia da qualche parte nel funzionamento di questa applicazione (invece di essere già danneggiato nel tuo file di origine) — Java 17 precede il passaggio di Java 18 a "UTF-8 per impostazione predefinita", quindi, su Windows in particolare, una JVM non configurata ripiega sulla code page ANSI di Windows, che non supporta affatto il thaana. Soluzione: avvia con <code>-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8</code> esplicitamente — vedi <code>run.bat</code> in questo progetto, o la sezione sull'internazionalizzazione del README.
diag.encoding.utf8=<strong>Il set di caratteri predefinito della JVM è UTF-8.</strong> Questa causa è esclusa; se compaiono ancora punti interrogativi, il danno molto probabilmente esisteva già nel foglio di origine prima che questa applicazione lo leggesse (vedi la nota sopra il testo di prova).
diag.encoding.defaultCharset=Set di caratteri predefinito
diag.encoding.os=Sistema operativo
diag.encoding.javaVersion=Versione di Java
diag.encoding.locale=Se LANG/LC_ALL/LC_CTYPE sono tutti "(not set)", o qualcosa come un semplice <code>C</code> o <code>POSIX</code> (solo ASCII, senza Unicode), è un problema di configurazione della localizzazione indipendente dal sistema operativo — colpisce Linux/WSL esattamente quanto Windows. <code>C.UTF-8</code> in particolare <strong>non</strong> è uno di quei casi — è l'ordinamento in stile C con pieno supporto UTF-8, una localizzazione reale e capace di Unicode, spesso usata di proposito nei container e nelle immagini minimali dei server. <code>run.sh</code> (Linux/macOS) e <code>run.bat</code> (Windows) impongono esplicitamente UTF-8 alla JVM qualunque sia la localizzazione, per i casi (Java 17 e precedenti, prima della JEP 400) in cui conta; da Java 18 la JVM usa già UTF-8 ovunque, quindi questo tipo di correzione non ha più nulla da fare.
diag.encoding.still=Vedi ancora punti interrogativi con un caricamento reale?
diag.encoding.stillXlsx=Il testo di prova qui sopra mette alla prova solo la metà del percorso che riguarda la visualizzazione — non è mai passato per la lettura di file. Se il tuo file di origine supera questa pagina ma mostra ancora punti interrogativi dopo l''importazione, o se vuoi provare direttamente proprio il file che ti dà problemi, usa la <a href="{0}">prova di lettura XLSX</a>: carica il file vero e guarda esattamente cosa ne estrae Apache POI, prima che intervenga qualsiasi altra parte di questa applicazione.
diag.encoding.stillTdb2=Se <em>quella</em> pagina appare corretta ma un''importazione reale continua a danneggiare il testo, l''unico anello rimasto non provato è l''andata e ritorno della memorizzazione di Jena/TDB2 — né questa pagina né la prova di lettura XLSX scrivono o leggono il grafo dei dati. La <a href="{0}">prova di andata e ritorno TDB2</a> scrive lo stesso testo dhivehi nel grafo dei dati, conferma e lo rilegge in una richiesta davvero separata — la stessa andata e ritorno di un''importazione reale e della successiva visita a una pagina del Catalogo.
diag.tdb2.short=Prova di andata e ritorno TDB2
diag.tdb2.title=Prova di andata e ritorno della memorizzazione TDB2
diag.tdb2.intro=Né il testo di prova fisso della pagina di diagnostica della codifica né la prova di lettura XLSX passano per Jena/TDB2 — uno salta del tutto la lettura dei file, l'altra salta del tutto la memorizzazione. Questa pagina prova l'anello rimasto: un testo dhivehi sopravvive all'essere scritto nel grafo dei dati, confermato e riletto in una richiesta successiva e separata — la stessa andata e ritorno di un'importazione reale e della successiva visita a una pagina del Catalogo?
diag.tdb2.expected=Atteso
diag.tdb2.readBack=Cosa è stato riletto da TDB2
diag.tdb2.nothing=Ancora nulla di scritto — fai clic sul pulsante qui sotto, che scrive il testo atteso qui sopra nel grafo dei dati e torna subito qui con una nuova richiesta, così ciò che vedi dopo è una vera rilettura, non solo l'eco di ciò che hai appena inviato.
diag.tdb2.action=Scrivi il testo di prova, poi rileggilo
diag.xlsx.title=Prova di lettura XLSX
diag.xlsx.intro=Carica il vero .xlsx che ti dà problemi. Questa pagina mostra esattamente cosa estrae Apache POI dalle sue prime righe — nient''altro lo tocca: niente grafo dei dati, niente memorizzazione, niente visualizzazione. Se il testo dhivehi appare già qui come punti interrogativi, il danno o è già nel file stesso, o nasce nel momento in cui questo file viene letto (un vero errore, non un problema dell''ambiente) — in ogni caso succede prima che intervenga qualsiasi altra parte di questa applicazione. Se qui appare correttamente ma nel Catalogo, dopo un''importazione reale, appare ancora come punti interrogativi, il problema è più avanti (memorizzazione o visualizzazione), per cui <a href="{0}">l''altra pagina di diagnostica</a> è lo strumento migliore.
