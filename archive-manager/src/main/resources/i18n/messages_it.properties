preview.kaitai.test=Compila la descrizione qui sopra con il compilatore di Kaitai Struct (incluso in questa applicazione ed eseguito come programma a parte), poi decodifica il campione con il risultato, tramite l'adattatore <code>oais-structure-kaitai</code>. Richiede qualche secondo. Il file è usato solo per questa richiesta; non viene memorizzato nulla.
preview.kaitai.writeBack=Per questo la descrizione viene compilata di nuovo, nella modalità di lettura e scrittura di Kaitai Struct, il che richiede qualche secondo.
preview.dfdl.test=Passa lo schema qui sopra ad Apache Daffodil, tramite l'adattatore <code>oais-structure-dfdl</code>, e mostra la struttura decodificata — un rapido controllo che la descrizione corrisponda davvero ai tuoi dati prima di salvarla. Il file è usato solo per questa richiesta; non viene memorizzato nulla.
