preview.drbPython.reference=Uno schema documentato come riferimento, non un driver — su PyPI non è pubblicato alcun driver HDF5 per <a href="https://gitlab.com/drb-python" target="_blank" rel="noopener noreferrer">drb-python</a>.
preview.drbPython.addInTitle=addin.py, scritto a mano
preview.drbPython.test=Esegue il driver qui sopra con drb-python {0} su questo server e mostra l''albero dei nodi decodificato, poi ciò che restituiscono le sue estensioni di metadati e di controlli. Il file è usato solo per questa richiesta; non viene memorizzato nulla.
preview.drbPython.noAddIns=Questo server non esegue estensioni scritte a mano, quindi la prova non può girare finché ce n'è una (vedi <code>archive.drb-python.run-hand-written-add-ins</code>).
