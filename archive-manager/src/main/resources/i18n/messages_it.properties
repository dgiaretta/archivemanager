transform.title=Trasforma {0}
transform.intro=Una Trasformazione riscrive questo Oggetto Dati in un altro formato — qui, mappandolo su un formato descritto nell'archivio, oppure <a href="#external">con un'altra applicazione</a>. Qui viene decodificato con le sue Informazioni di Rappresentazione, ogni elemento del nuovo formato è fatto dai suoi elementi come indichi qui sotto, e il risultato è scritto con la descrizione DFDL del nuovo formato. I nuovi dati vengono poi decodificati di nuovo con quella descrizione per verificare ogni Proprietà dell'Informazione di Trasformazione. Farlo conserva i nuovi dati nell'archivio e registra un nuovo Oggetto Dati, in una Versione dell'AIP le cui Informazioni di Provenienza registrano la Trasformazione — questo Oggetto Dati resta com'è.
transform.notTransformable=Questo Oggetto Dati non può essere trasformato: i suoi bit hanno bisogno di una posizione di memorizzazione, e le sue Informazioni di Rappresentazione di una descrizione DFDL, DRB SDF o Kaitai Struct con cui decodificarli.
