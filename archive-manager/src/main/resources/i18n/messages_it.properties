start.intro=Costruisci una descrizione in Kaitai Struct (.ksy), DFDL (.dfdl.xsd), DRB (schema SDF o driver drb-python) e/o EAST (.east) di un formato di dati scientifici, e dai a ogni campo un nome semantico, una definizione e delle unità -- poi salvala nell'archivio come vere Informazioni di Rappresentazione OAIS: Informazioni di Rappresentazione Strutturale per la disposizione dei byte/logica, e Informazioni di Rappresentazione Semantica, un individuo per campo, per ciò che ognuno significa.
