transform.mappingNote=Un elemento che si ripete ricorre una volta per ogni occorrenza dell'elemento del vecchio formato su cui si ripete; al suo interno, gli elementi del vecchio formato sotto quello sono quelli di quell'occorrenza. Un valore è copiato (per una scala, più un offset, se indicati), contato o una costante. Gli elementi sono stati associati prima per nome o significato: controllali.
