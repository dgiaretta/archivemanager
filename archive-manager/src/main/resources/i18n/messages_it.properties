home.title=Home
home.intro=Una piccola applicazione di gestione archivistica basata su <a href="https://www.ica.org/standards/RiC/ontology" target="_blank">RiC-O 1.1</a> e sul <a href="http://ontology.oais.info/im/" target="_blank">Modello Informativo OAIS</a>, collegati da un'ontologia ponte. I documenti sono descritti nativamente in RiC-O; la vista <strong>Mappatura OAIS</strong> di ogni documento mostra le classi OAIS corrispondenti e, dove i dati di esempio ne collegano una, la vera struttura di descrizione per la conservazione OAIS degli stessi fondi.
home.storage=I dati risiedono in <a href="https://jena.apache.org/documentation/tdb2/" target="_blank">Apache Jena TDB2</a>, un vero triple store transazionale su disco, in <code>{0}</code>. Ogni modifica viene confermata insieme alla richiesta che l''ha fatta — non c''è un passaggio di salvataggio separato, e sopravvive ai riavvii.
