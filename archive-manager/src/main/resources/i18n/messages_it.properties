aip.note=Crea un Pacchetto di Informazioni di Archiviazione attorno a questo Oggetto Dati, con tutto ciò che l'OAIS richiede e che l'archivio sa o riesce a ricavare: le sue Informazioni sul Contenuto (l'Oggetto Dati e le Informazioni di Rappresentazione con cui si interpreta), le Informazioni di Integrità (lo SHA-256 dei suoi bit, prelevati ora), le Informazioni di Riferimento, di Provenienza e di Contesto, e una Descrizione del Pacchetto. Le Informazioni di Impacchettamento vengono fornite quando lo si esporta come BagIt. Ciò che solo tu puoi dire va qui sotto; ciò che resta fuori compare come mancante nella pagina dell'AIP, da aggiungere con l'editor.
