start.fitsHeaders=Oppure descrivi un file FITS dai suoi header
start.fitsHeaders.note=Un file FITS descrive se stesso: i suoi header dicono cosa contiene ogni HDU. I suoi header diventano una descrizione di quel file in particolare — ogni header un record dei suoi record di parole chiave, ognuno collegato al significato della parola chiave nel dizionario delle parole chiave FITS (Standard FITS 4.0); ogni immagine come righe di pixel, tipizzate da BITPIX, con BUNIT, BSCALE, BZERO e BLANK come unità, scala, offset e valore di riempimento; le colonne di ogni tabella tipizzate da TFORMn e nominate da TTYPEn, con TUNITn, TSCALn, TZEROn, TNULLn, TLMINn e TLMAXn. Poi l'archivio può decodificarlo, mostrarne la tabella e l'immagine e dire cosa significano le sue colonne. Si leggono solo gli header. Un Oggetto Dati le cui Informazioni di Rappresentazione dicono che è FITS si può descrivere allo stesso modo dalla sua pagina.
