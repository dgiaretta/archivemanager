preview.east.test=Legge il campione con l'interprete EAST (il modulo <code>oais-structure-east</code>) esattamente come dice la descrizione qui sopra, e mostra ciò che legge: i record, gli array e i valori di EAST stesso, con il letterale di ogni enumerazione come significato. Il file è usato solo per questa richiesta; non viene memorizzato nulla.
preview.logical=Kaitai e DFDL descrivono una disposizione sequenziale di byte, cosa che questo schema logico in stile HDF5 non è -- vedi l'output DRB qui sotto, o aggiungi una descrizione a parte della disposizione dei byte per l'array grezzo di un dataset, se ti serve.
preview.drbPython.driver=Un driver <a href="https://gitlab.com/drb-python" target="_blank" rel="noopener noreferrer">drb-python</a> completo per questa disposizione: ciò che si scarica è un pacchetto installabile — installalo con <code>pip install {0}.zip</code> — la cui firma di argomento permette a drb di sceglierlo automaticamente per
preview.drbPython.explicit=i file che apri esplicitamente con esso (nei dettagli qui sopra non sono indicate estensioni di file)
preview.drbPython.ending=i file che finiscono in <code>{0}</code>
preview.drbPython.nodes=Ogni campo diventa un nodo figlio con la sua posizione/lunghezza in byte e il suo nome semantico, definizione e unità. Il modulo del driver è mostrato qui sotto.
preview.drbPython.addOns=Il pacchetto registra anche quattro estensioni di drb-python, che danno il significato di un file decodificato nel suo insieme e lo riscrivono: <code>{0}</code> (ogni valore con il suo significato), <code>{1}</code> (nome semantico → valore), <code>{2}</code> (valori fuori dall''intervallo valido o dall''elenco dei codici, e byte non coperti) e <code>{3}</code> (il file riscritto, con eventuali modifiche), es. <code>node.get_impl(dict, "{1}")</code>.
preview.drbPython.withAddIn=Con un'estensione scritta a mano, come <code>addin.py</code> nel pacchetto.
preview.drbPython.writeAddIn=Scrivi un'estensione in Python
preview.drbPython.addInFor=codice che il driver chiama per decifrare o decomprimere un file prima di leggerlo, o per verificare checksum e CRC dopo.
