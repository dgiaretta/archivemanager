values.note=Decodifica i dati sul server tramite le loro Informazioni di Rappresentazione e stampa ogni valore, con dove si trova nei bit e cosa significa (il suo significato, il significato di un codice, un valore in scala con le sue unità), come fanno gli Strumenti RepInfo per un file di esempio — una pagina alla volta, perché un file grande non sommerga il browser. La prima pagina di un file grande richiede un po' per essere decodificata; quelle dopo no.
