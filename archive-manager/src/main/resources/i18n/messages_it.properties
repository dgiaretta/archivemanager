edit.structureNote=Il file come albero, nell'ordine dei dati. Un <strong>record</strong> raggruppa elementi (e può ripetersi, o essere una riga di testo delimitato come una riga CSV); un <strong>campo</strong> è un valore; una <strong>scelta</strong> è uno tra diversi record, scelto dal valore di un campo precedente. Conteggi, lunghezze e condizioni possono usare campi precedenti e aritmetica, es. <code>n</code>, <code>rows * cols</code>, <code>flags = 1</code>, e campi dentro un record letto prima, es. <code>header.length + 1</code>. Seleziona un elemento per modificarlo, compreso ciò che significa: il suo nome semantico, la definizione, le unità e altro.
