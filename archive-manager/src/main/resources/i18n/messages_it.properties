hand.addIn.intro=Scrivi codice Python che il driver drb-python generato chiamerà, per ciò che l'albero degli elementi non sa esprimere. Il driver continua a leggere l'albero degli elementi; l'estensione si inserisce attorno, tramite una qualsiasi di queste funzioni:
hand.addIn.prepare=<code>prepare(data)</code> — riceve i byte del file prima che vengano letti e restituisce i byte da leggere: decifrali o decomprimili qui.
hand.addIn.check=<code>check(root)</code> — dopo la decodifica: restituisce un elenco di problemi (checksum, CRC, controlli incrociati), aggiunto a ciò che segnala l'estensione <code>checks</code>.
hand.addIn.metadata=<code>metadata(root)</code> — restituisce un dizionario unito a ciò che restituisce l'estensione <code>metadata</code>.
hand.addIn.restore=<code>restore(data)</code> — quando il file viene riscritto: annulla <code>prepare()</code> (es. cifra di nuovo), restituendo i byte da scrivere.
hand.addIn.root=<code>root.original_bytes</code> sono i byte del file, <code>root.decoded_bytes</code> ciò che ha restituito <code>prepare()</code>, e i figli di <code>root</code> gli elementi decodificati. L'estensione è <code>addin.py</code> nel pacchetto scaricato, e viene salvata nell'archivio insieme al driver.
hand.addIn.risk=Un'estensione è codice Python, che gira con tutti i diritti di chi usa il driver. Si verifica che sia Python valido, ma non si può verificare che sia sicuro.
hand.addIn.runs=Questo server esegue le estensioni nelle prove con campioni.
hand.addIn.doesNotRun=Questo server non esegue le estensioni nelle prove con campioni (<code>archive.drb-python.run-hand-written-add-ins</code>), quindi prova il pacchetto scaricato altrove.
hand.intro=Scrivi tu la descrizione in {0}, per ciò che l''albero degli elementi dell''editor non sa esprimere — checksum, cifratura, altre compressioni, record distribuiti su più righe e tutto ciò che il linguaggio permette. Una volta salvata, sostituisce la descrizione generata nell''anteprima, nella prova con un campione, nello scaricamento e nel salvataggio nell''archivio. L''albero degli elementi fornisce comunque i significati (nomi semantici, unità, codici) salvati come Informazioni di Rappresentazione Semantica, ma la prova con un campione di una descrizione scritta a mano mostra l''albero del motore stesso invece di allinearlo con l''albero degli elementi.
hand.checked=Una prova con un campione esegue la descrizione dentro questa applicazione, quindi prima viene controllata: niente DOCTYPE né file inclusi da altrove (il DFDL può includere gli schemi integrati del Daffodil stesso); per Kaitai Struct, niente <code>imports</code> né routine <code>process:</code> personalizzate (zlib, xor, rol e ror sono integrate); per il DRB, niente query che chiamano Java o leggono file.
hand.outOfDate=L'albero degli elementi è cambiato da quando questa è stata scritta, quindi ciò che genera ora è diverso. Controlla se la descrizione scritta a mano ha bisogno della stessa modifica.
