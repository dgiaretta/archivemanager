start.east.note=Un Registro di Descrizione dei Dati nel linguaggio di descrizione dei dati EAST del CCSDS (CCSDS 644.0-B-3): il suo pacchetto logico e il suo pacchetto fisico. Viene conservato così com'è scritto e provato con l'interprete EAST. I suoi record, array, enumerazioni e varianti diventano anche l'albero degli elementi, con i letterali di ogni enumerazione come significati dei suoi codici, così da poterne generare descrizioni in Kaitai Struct, DFDL e DRB e provarle anch'esse su dati di esempio - quando l'albero lo sa esprimere; altrimenti resta solo in EAST.
