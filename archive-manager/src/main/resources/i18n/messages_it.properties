transform.asTextNote=È ciò che viene registrato con la Trasformazione. Puoi modificarlo qui invece che sopra: una regola per riga — <code>for star in stars.entry</code>, <code>star.ra = stars.entry.ra</code>, <code>star.ra_rad = stars.entry.ra * 0.0174532925</code>, <code>n = count(stars.entry)</code>, <code>version = "2"</code>.
