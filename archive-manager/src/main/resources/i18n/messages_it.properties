preview.drbJava.sdf=Uno schema SDF del DRB: un XML Schema le cui annotazioni <code>sdf:block</code> danno la lunghezza, l'ordine dei byte e la codifica di ogni campo — il linguaggio dichiarativo di descrizione del DRB stesso, applicato dal DRB Java di GAEL (LGPL v3). La definizione di ogni campo diventa il suo <code>xs:documentation</code>.
preview.drbJava.reference=Uno schema documentato come riferimento, non qualcosa che il DRB legge — gli schemi SDF del DRB descrivono disposizioni sequenziali di byte, e il DRB non ha un'implementazione HDF5.
preview.drbJava.test=Applica lo schema qui sopra con il DRB Java, dentro questa applicazione, e mostra l'albero dei nodi decodificato con la posizione in byte di ogni campo. Il file è usato solo per questa richiesta; non viene memorizzato nulla.
preview.drbJava.writeBack=Il DRB scrive ogni valore dove è stato letto: un valore delimitato può cambiare lunghezza, uno di lunghezza fissa no.
preview.viewers=Apri in TOPCAT, SPLAT o in un visualizzatore di immagini
preview.viewers.zip=Uno zip con tutto ciò di cui TOPCAT (con il lettore <code>oais-structure-topcat</code>) o SPLAT (con <code>oais-structure-splat</code>) hanno bisogno per aprire i tuoi dati: un manifesto di Informazioni di Rappresentazione (Turtle) che nomina il file di dati, le descrizioni DFDL e DRB SDF — l'una o l'altra va bene — una vista tabellare generata dall'albero degli elementi (il primo record ripetuto come righe, i suoi campi come colonne, con le loro unità e significati) e cosa significa ogni elemento. Ogni file è nominato nel manifesto, quindi si possono rinominare o spostare modificandolo. Metti il tuo file di dati accanto al manifesto, con il nome che indichi qui.
preview.viewers.image=Un'immagine — un record ripetuto (una riga) che contiene un campo numerico ripetuto (i suoi pixel) — ottiene anche una vista immagine: <code>oais-structure-image</code> la scrive come FITS per Fiji/ImageJ, SAOImage DS9 o Aladin, e una volta salvata nell'archivio con una posizione di memorizzazione, l'archivio stesso serve quel FITS.
preview.viewers.dataFile=Nome del file di dati
preview.viewers.download=Scarica per i visualizzatori (.zip)
preview.save.note=Crea Informazioni di Rappresentazione Strutturale/Semantica collegate a un Oggetto Dati, nello stesso modo in cui il resto dell'archivio modella le Informazioni di Rappresentazione di qualsiasi formato. Scegli quali delle descrizioni generate qui sopra tenere come Informazioni di Rappresentazione Strutturale — la semantica dei campi viene salvata comunque, come un individuo di Informazioni di Rappresentazione Semantica per campo/riga (il nome semantico come suo <code>rdfs:label</code>, la definizione come suo <code>skos:definition</code>, le unità collegate tramite <code>im:hasUnitOfMeasurement</code>), raccolti sotto un'unica Informazione di Rappresentazione Semantica generale per la descrizione nel suo insieme.
