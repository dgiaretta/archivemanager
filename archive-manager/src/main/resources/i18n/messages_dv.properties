edit.languagesNote=ހަތަރު ލެންގުއޭޖާއެކު، ތަފްސީލު ހަނިވެގެންދަނީ ހުރިހާ ލެންގުއޭޖަކަށް ފާޅުކުރެވޭ އެއްޗަކަށް. އެ ލެންގުއޭޖްތަކަށް ހަމައެކަނި ހުއްދަ ކަންކަން ބޭނުންކުރުމަށް މަދު އަދަދެއް ހޮވާ:
