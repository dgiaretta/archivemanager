edit.structureNote=ޑޭޓާގެ ތަރުތީބުން، ފައިލް ޓްރީއެއްގެ ގޮތުގައި. <strong>ރެކޯޑެއް</strong> އެލިމެންޓްތައް ގުޅުވާ (އަދި ތަކުރާރުވެދާނެ، ނުވަތަ CSV ރޯއެއް ފަދަ ވަކިކޮށްފައިވާ ލިޔުމުގެ ލައިނެއް ވެދާނެ)؛ <strong>ފީލްޑަކީ</strong> އެއް އަގެއް؛ <strong>އިޚްތިޔާރަކީ</strong> ކުރީގެ ފީލްޑެއްގެ އަގުން ހޮވާ އެތައް ރެކޯޑެއްގެ ތެރެއިން އެކެއް. ޢަދަދު، ދިގުމިން އަދި ޝަރުތުތަކުގައި ކުރީގެ ފީލްޑްތަކާއި ހިސާބު ބޭނުންކުރެވޭނެ، މިސާލަކަށް <code>n</code>، <code>rows * cols</code>، <code>flags = 1</code>، އަދި ކުރިން ކިޔާފައިވާ ރެކޯޑެއްގެ ތެރޭގެ ފީލްޑް، މިސާލަކަށް <code>header.length + 1</code>. އެޑިޓް ކުރުމަށް އެލިމެންޓެއް ހޮވާ، އެއިން މާނަކުރާ އެއްޗެއް ވެސް ހިމެނޭގޮތަށް: އޭގެ ސިމެންޓިކް ނަން، ތަޢުރީފު، ޔުނިޓް އަދި އެހެނިހެން.
