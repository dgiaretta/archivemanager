aip.accessRightsExample=މިސާލަކަށް: ހުރިހާ ބޭފުޅަކަށް ހުޅުވާލެވިފައި؛ ބޭނުންކުރާއިރު މިޝަން ހަވާލާދޭ
aip.context=ކޮންޓެކްސްޓް: އެހެން މަޢުލޫމާތާ ގުޅޭ ގޮތް (އާކައިވަށް ފެންނަ އެއްޗެހި އާކައިވުން އިތުރުކުރާނެ)
