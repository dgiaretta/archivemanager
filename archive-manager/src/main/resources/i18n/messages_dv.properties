transform.propertiesNote=ޓްރާންސްފޯމޭޝަނުން ސަލާމަތްވާން ޖެހޭ އަގުތައް. ކޮންމެ އެއްޗެއް ޗެކް ކުރެވެނީ އައު ޑޭޓާ އޭގެ އަމިއްލަ ތަފްސީލުން ޑިކޯޑްކޮށް، ފިޒިކަލް އަގުތައް (ކޮންމެ ފަރާތެއްގެ ސްކޭލް އަދި އޮފްސެޓްއަށްފަހު) އަޅާކިޔައިގެން — ދީފައިވާ ޓޮލަރެންސްގެ ތެރޭގައި، އަގުތަކުގެ ޔުނިޓުން، ނޫންނަމަ ބާވަތްތަކުން ހުއްދަ ވަރަކަށް. މި ޑޭޓާ އޮބްޖެކްޓްގެ އިންފޮމޭޝަން އޮބްޖެކްޓުގައި ކުރިން ހުރި އެއްޗެހި ފާހަގަކޮށްފައި؛ އެހެން އެއްޗެހި ޓްރާންސްފޯމް ކުރާއިރު އެއަށް އިތުރުކުރެވޭ.
