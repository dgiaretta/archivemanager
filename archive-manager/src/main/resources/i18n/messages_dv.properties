hand.addIn.intro=އެލިމެންޓް ޓްރީއިން ފާޅުނުކުރެވޭ ކަންކަމަށް، ޖެނެރޭޓްކުރި drb-python ޑްރައިވަރުން ކޯލް ކުރާނެ Python ކޯޑު ލިޔޭ. ޑްރައިވަރު އަދިވެސް އެލިމެންޓް ޓްރީ ކިޔާ؛ އެޑް-އިން އޭގެ ވަށައިގެން ގުޅެނީ މި ފަންކްޝަންތަކުގެ ތެރެއިން ކޮންމެ އެއްޗަކުން:
hand.addIn.prepare=<code>prepare(data)</code> — ފައިލްގެ ބައިޓްތައް ކިޔުމުގެ ކުރިން ލިބި، ކިޔަންޖެހޭ ބައިޓްތައް އަނބުރާ ދޭ: ޑިކްރިޕްޓް ނުވަތަ ޑިކޮމްޕްރެސް ކުރާނީ މިތާގައި.
hand.addIn.check=<code>check(root)</code> — ޑިކޯޑިންގއަށްފަހު: މައްސަލަތަކުގެ ލިސްޓެއް (ޗެކްސަމް، CRC، ކްރޮސް ޗެކް) އަނބުރާ ދޭ، <code>checks</code> އެޑް-އޮން ރިޕޯޓް ކުރާ އެއްޗަކަށް އިތުރުކުރެވޭ.
hand.addIn.metadata=<code>metadata(root)</code> — ޑިކްޝަނަރީއެއް އަނބުރާ ދޭ، <code>metadata</code> އެޑް-އޮން އަނބުރާ ދޭ އެއްޗަކާ ގުޅުވެވޭ.
hand.addIn.restore=<code>restore(data)</code> — ފައިލް އަނބުރާ ލިޔާއިރު: <code>prepare()</code> އަނބުރާ ކުރޭ (މިސާލަކަށް އަލުން އެންކްރިޕްޓް ކުރޭ) އަދި ލިޔަންޖެހޭ ބައިޓްތައް އަނބުރާ ދޭ.
hand.addIn.root=<code>root.original_bytes</code> އަކީ ފައިލްގެ ބައިޓްތައް، <code>root.decoded_bytes</code> އަކީ <code>prepare()</code> އަނބުރާ ދިން އެއްޗެއް، އަދި <code>root</code> ގެ ދަރިންނަކީ ޑިކޯޑްކުރި އެލިމެންޓްތައް. އެޑް-އިން އަކީ ޑައުންލޯޑް ކުރާ ޕެކޭޖުގައިވާ <code>addin.py</code>، އަދި ޑްރައިވަރާއެކު އާކައިވްގައި ރައްކާ ކުރެވޭ.
hand.addIn.risk=އެޑް-އިން އަކީ Python ކޯޑެއް، ޑްރައިވަރު ބޭނުންކުރާ ފަރާތުގެ ހުރިހާ ހައްގުތަކާއެކު ހިނގާ. އެއީ ސައްޙަ Python އެއްކަން ޗެކް ކުރެވޭ، ނަމަވެސް ރައްކާތެރިކަން ޗެކެއް ނުކުރެވޭނެ.
hand.addIn.runs=މި ސާވަރު ނަމޫނާގެ ޓެސްޓްތަކުގައި އެޑް-އިންތައް ހިންގާ.
hand.addIn.doesNotRun=މި ސާވަރު ނަމޫނާގެ ޓެސްޓްތަކުގައި އެޑް-އިންތައް ނުހިންގާ (<code>archive.drb-python.run-hand-written-add-ins</code>)، އެހެންވީމާ ޑައުންލޯޑް ކުރި ޕެކޭޖް އެހެން ތަނެއްގައި ޓެސްޓް ކުރޭ.
hand.intro=އެޑިޓަރުގެ އެލިމެންޓް ޓްރީއިން ފާޅުނުކުރެވޭ ކަންކަމަށް، ތަފްސީލު {0} އިން އަމިއްލައަށް ލިޔޭ — ޗެކްސަމް، އެންކްރިޕްޝަން، އެހެން ކޮމްޕްރެޝަން، އެތައް ލައިނެއްގައިވާ ރެކޯޑް، އަދި ލެންގުއޭޖުން ހުއްދަ ކުރާ އެހެން ހުރިހާ ކަމެއް. ސޭވް ކުރުމުން، ޕްރިވިއު، ނަމޫނާ ޓެސްޓް، ޑައުންލޯޑް، އަދި އާކައިވްގައި ރައްކާކުރުމުގައި ޖެނެރޭޓްކުރި ތަފްސީލުގެ ބަދަލުގައި އެ ބޭނުންކުރެވޭނެ. ސިމެންޓިކް ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުގެ ގޮތުގައި ރައްކާކުރެވޭ މާނަތައް (ސިމެންޓިކް ނަން، ޔުނިޓް، ކޯޑް) އަދިވެސް ލިބެނީ އެލިމެންޓް ޓްރީއިން، ނަމަވެސް އަތުން ލިޔުނު ތަފްސީލެއްގެ ނަމޫނާ ޓެސްޓުން ދައްކަނީ އިންޖީނުގެ އަމިއްލަ ޓްރީ، އެލިމެންޓް ޓްރީއާ ދިމާކޮށްފައެއް ނޫން.
hand.checked=ނަމޫނާ ޓެސްޓަކުން ތަފްސީލު ހިންގަނީ މި އެޕްލިކޭޝަނުގެ ތެރޭގައި، އެހެންވީމާ ކުރިން ޗެކް ކުރެވޭ: DOCTYPE އެއް ނެތް، އަދި އެހެން ތަނަކުން ފައިލެއް ހިމަނާފައެއް ނުވޭ (DFDL އަށް Daffodil ގެ އަމިއްލަ ސްކީމާތައް ހިމެނިދާނެ)؛ Kaitai Struct ގައި <code>imports</code> ނުވަތަ ޚާއްޞަ <code>process:</code> ރޫޓީނެއް ނެތް (zlib، xor، rol އަދި ror ހިމެނިފައި)؛ DRB ގައި Java ކޯލް ކުރާ ނުވަތަ ފައިލް ކިޔާ ކުއެރީއެއް ނެތް.
hand.outOfDate=މިއީ ލިޔުމަށްފަހު އެލިމެންޓް ޓްރީ ބަދަލުވެއްޖެ، އެހެންވީމާ އެއިން މިހާރު ޖެނެރޭޓްކުރާ އެއްޗެއް ތަފާތު. އަތުން ލިޔުނު ތަފްސީލަށް ވެސް ހަމަ އެ ބަދަލު ބޭނުންވޭތޯ ބަލާ.
