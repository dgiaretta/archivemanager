preview.drbJava.sdf=DRB SDF ސްކީމާއެއް: XML Schema އެއް، އޭގެ <code>sdf:block</code> އެނޮޓޭޝަންތަކުން ކޮންމެ ފީލްޑެއްގެ ދިގުމިން، ބައިޓް އޯޑަރ އަދި އެންކޯޑިންގ ދޭ — DRB ގެ އަމިއްލަ ޑިކްލަރޭޓިވް ޑިސްކްރިޕްޝަން ލެންގުއޭޖް، GAEL ގެ Java DRB (LGPL v3) އިން ބޭނުންކުރާ. ކޮންމެ ފީލްޑެއްގެ ތަޢުރީފު ވާނީ އޭގެ <code>xs:documentation</code> އަށް.
preview.drbJava.reference=ރިފަރެންސެއްގެ ގޮތުގައި ޑޮކިއުމެންޓްކުރި ސްކީމާއެއް، DRB ކިޔާ އެއްޗެއް ނޫން — DRB SDF ސްކީމާތަކުން ތަފްސީލުކުރަނީ ތަރުތީބުން ހުންނަ ބައިޓް ލޭއައުޓް، އަދި DRB ގައި HDF5 ގެ އިމްޕްލިމެންޓޭޝަނެއް ނެތް.
preview.drbJava.test=މި އެޕްލިކޭޝަނުގެ ތެރޭގައި Java DRB އިން މަތީގައިވާ ސްކީމާ ބޭނުންކޮށް، ކޮންމެ ފީލްޑެއްގެ ބައިޓް އޮފްސެޓާއެކު ޑިކޯޑްކުރި ނޯޑް ޓްރީ ދައްކާ. ފައިލް ބޭނުންކުރެވެނީ މި ރިކުއެސްޓަށް ހަމައެކަނި؛ އެއްވެސް އެއްޗެއް ރައްކާއެއް ނުކުރެވޭ.
preview.drbJava.writeBack=DRB ކޮންމެ އަގެއް ލިޔަނީ އެ ކިޔުނު ތަނުގައި: ވަކިކޮށްފައިވާ އަގެއްގެ ދިގުމިން ބަދަލުވެދާނެ، ސާބިތު ދިގުމިނެއްގެ އަގެއްގެ ނުވާނެ.
preview.viewers=TOPCAT، SPLAT ނުވަތަ ފޮޓޯ ވިއުއަރެއްގައި ހުޅުވާ
preview.viewers.zip=TOPCAT (<code>oais-structure-topcat</code> ރީޑަރާއެކު) ނުވަތަ SPLAT (<code>oais-structure-splat</code> އާއެކު) އަށް ތިޔަބޭފުޅާގެ ޑޭޓާ ހުޅުވުމަށް ބޭނުންވާ ހުރިހާ އެއްޗެއް ހިމެނޭ zip އެއް: ޑޭޓާ ފައިލްގެ ނަން ބުނާ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުގެ މެނިފެސްޓެއް (Turtle)، DFDL އާއި DRB SDF ތަފްސީލު — ދެމެދުން ކޮންމެ އެއްޗެއް ކަމުދޭ — އެލިމެންޓް ޓްރީއިން ޖެނެރޭޓްކުރި ތާވަލް ވިއުއެއް (ފުރަތަމަ ތަކުރާރުވާ ރެކޯޑް ރޯތަކެއްގެ ގޮތުގައި، އޭގެ ފީލްޑްތައް ކޮލަމްތަކެއްގެ ގޮތުގައި، އެއްޗެހީގެ ޔުނިޓާއި މާނަތަކާއެކު)، އަދި ކޮންމެ އެލިމެންޓެއްގެ މާނަ. ކޮންމެ ފައިލެއްގެ ނަން މެނިފެސްޓްގައި ބުނެފައި، އެހެންވީމާ އެ އެޑިޓް ކޮށްގެން ފައިލްތަކުގެ ނަން ބަދަލުކުރެވޭނެ ނުވަތަ ހިއްލާލެވޭނެ. ތިޔަބޭފުޅާގެ ޑޭޓާ ފައިލް، މިތާގައި ދޭ ނަމުގައި، މެނިފެސްޓްގެ ކައިރީގައި ބަހައްޓާ.
preview.viewers.image=ފޮޓޯއަކަށް — ތަކުރާރުވާ ނަންބަރު ފީލްޑެއް (އޭގެ ޕިކްސެލްތައް) ހިމެނޭ ތަކުރާރުވާ ރެކޯޑެއް (ރޯއެއް) — ފޮޓޯ ވިއުއެއް ވެސް ލިބޭ: <code>oais-structure-image</code> އެ FITS ގެ ގޮތުގައި ލިޔޭ، Fiji/ImageJ، SAOImage DS9 ނުވަތަ Aladin އަށް، އަދި ސްޓޯރޭޖް ލޮކޭޝަނަކާއެކު އާކައިވްގައި ރައްކާކުރުމުން، އާކައިވް އަމިއްލައަށް އެ FITS ދޭ.
