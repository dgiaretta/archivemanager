aip.created=AIP ހެދިއްޖެ. ތިރީގެ ލިސްޓުން OAIS އިން އެއަށް އަދިވެސް ބޭނުންވާ އެއްޗެހި ދައްކާ؛ އެއްޗެހި އެޑިޓަރުން އިތުރުކުރޭ.
aip.createdWithoutFixity=AIP ހެދިއްޖެ، ނަމަވެސް ފިކްސިޓީ މަޢުލޫމާތެއް ނެތި: {0} ތިރީގެ ލިސްޓުން OAIS އިން އެއަށް އަދިވެސް ބޭނުންވާ އެއްޗެހި ދައްކާ.
