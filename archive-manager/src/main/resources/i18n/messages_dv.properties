transform.intro=ޓްރާންސްފޯމޭޝަނަކުން މި ޑޭޓާ އޮބްޖެކްޓް އެހެން ފޯމެޓަކަށް އަލުން ލިޔޭ — މިތާގައި، އާކައިވްގައި ތަފްސީލުކޮށްފައިވާ ފޯމެޓަކަށް މެޕްކޮށްގެން، ނުވަތަ <a href="#external">އެހެން އެޕްލިކޭޝަނަކުން</a>. މިތާގައި އެ ޑިކޯޑް ކުރެވެނީ އޭގެ އަމިއްލަ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުން، އައު ފޯމެޓްގެ ކޮންމެ އެލިމެންޓެއް ހެދެނީ ތިރީގައި ތިޔަބޭފުޅާ ބުނާ ގޮތަށް އޭގެ އެލިމެންޓްތަކުން، އަދި ނަތީޖާ ލިޔެވެނީ އައު ފޯމެޓްގެ DFDL ތަފްސީލުން. ދެން އައު ޑޭޓާ އެ ތަފްސީލުން އަލުން ޑިކޯޑްކޮށް ކޮންމެ ޓްރާންސްފޯމޭޝަނަލް އިންފޮމޭޝަން ޕްރޮޕަޓީއެއް ޗެކް ކުރެވޭ. އެކަން ކުރުމުން އައު ޑޭޓާ އާކައިވްގައި ރައްކާކޮށް، AIP ވަރޝަނެއްގައި، އޭގެ ޕްރޮވެނަންސް މަޢުލޫމާތުގައި ޓްރާންސްފޯމޭޝަން ރެކޯޑްކުރާ، އައު ޑޭޓާ އޮބްޖެކްޓެއް ރެކޯޑް ކުރެވޭ — މި ޑޭޓާ އޮބްޖެކްޓް ހުރި ގޮތަށް ބާކީ ހުންނާނެ.
transform.notTransformable=މި ޑޭޓާ އޮބްޖެކްޓް ޓްރާންސްފޯމެއް ނުކުރެވޭނެ: އޭގެ ބިޓްތަކަށް ސްޓޯރޭޖް ލޮކޭޝަނެއް ބޭނުންވޭ، އަދި އޭގެ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތަށް އެ ޑިކޯޑް ކުރެވޭނެ DFDL، DRB SDF ނުވަތަ Kaitai Struct ތަފްސީލެއް ބޭނުންވޭ.
