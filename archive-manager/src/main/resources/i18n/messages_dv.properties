writeBack.different=ނަމޫނާގައިވާ ބައެއް އެއްޗެހި ތަފްސީލުގައި ނެތް، ނުވަތަ ރައްކާކޮށްފައިވާ ގޮތަށް އަނބުރާ ނުލިޔެވޭ: ތަފްސީލުކޮށްފައިވާ ޑޭޓާގެ ފަހުގައިވާ ބައިޓްތައް ނުލިޔެވޭ، ލިޔުމުގައިވާ ނަންބަރުތައް އެހެން ގޮތަކަށް ލިޔެވިދާނެ (<code>1.50</code> އަކީ <code>1.5</code>)، އަދި ކޮމްޕްރެސްކޮށްފައިވާ ޑޭޓާ އެހެން ގޮތަކަށް ކޮމްޕްރެސް ކުރެވިދާނެ.
