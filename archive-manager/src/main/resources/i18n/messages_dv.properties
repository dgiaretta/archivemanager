start.byHand.note=އިންޖީނެއްގެ އަމިއްލަ ލެންގުއޭޖުން، އެޑިޓަރުގެ އެލިމެންޓް ޓްރީއިން ފާޅުނުކުރެވޭ ކަންކަމަށް: ޗެކްސަމް، އެންކްރިޕްޝަން، އެހެން ކޮމްޕްރެޝަން، އެތައް ލައިނެއްގައިވާ ރެކޯޑް، އަދި ލެންގުއޭޖުން ހުއްދަކުރާ އެހެން ހުރިހާ ކަމެއް. މާނަތަކަށް، ފަހުން އެލިމެންޓް ޓްރީއެއް އިތުރުކުރެވޭނެ.
