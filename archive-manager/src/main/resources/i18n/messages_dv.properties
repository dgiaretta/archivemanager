transform.mappingNote=ތަކުރާރުވާ އެލިމެންޓެއް ފެންނަނީ، އެ ތަކުރާރުވާ ބާވަތުގެ ކުރީގެ ފޯމެޓްގެ އެލިމެންޓް ފެންނަ ކޮންމެ ފަހަރަކު އެއް ފަހަރު؛ އޭގެ ތެރޭގައި، އޭގެ ދަށުގައިވާ ކުރީގެ ފޯމެޓްގެ އެލިމެންޓްތަކަކީ އެ ފަހަރުގެ އެއްޗެހި. އަގެއް ކޮޕީ ކުރެވޭ (ދީފައިވާނަމަ، ސްކޭލަކުން، އޮފްސެޓަކާއެކު)، ގުނޭ، ނުވަތަ ސާބިތު އަގެއް. އެލިމެންޓްތައް ފުރަތަމަ ދިމާކުރެވިފައިވަނީ ނަމުން ނުވަތަ މާނައިން: އެ ޗެކް ކުރޭ.
