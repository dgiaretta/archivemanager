start.east.note=CCSDS ގެ EAST ޑޭޓާ ޑިސްކްރިޕްޝަން ލެންގުއޭޖުގައިވާ ޑޭޓާ ޑިސްކްރިޕްޝަން ރެކޯޑެއް (CCSDS 644.0-B-3): އޭގެ ލޮޖިކަލް ޕެކޭޖާއި ފިޒިކަލް ޕެކޭޖް. ލިޔެފައިވާ ގޮތަށް ރައްކާކޮށް، EAST އިންޓަޕްރެޓަރުން ޓެސްޓް ކުރެވޭ. އޭގެ ރެކޯޑް، އެރޭ، އީނިއުމަރޭޝަން އަދި ވޭރިއަންޓްތައް އެލިމެންޓް ޓްރީއަކަށް ވެސް ވާނެ، ކޮންމެ އީނިއުމަރޭޝަނެއްގެ ލިޓަރަލްތައް އޭގެ ކޯޑުތަކުގެ މާނައެއްގެ ގޮތުގައި، އެހެންކަމުން Kaitai Struct، DFDL އަދި DRB ތަފްސީލުތައް އެއިން ޖެނެރޭޓްކޮށް ނަމޫނާ ޑޭޓާއާ ދެކޮޅަށް ޓެސްޓް ކުރެވޭނެ - ޓްރީއަށް އެ ފާޅުކުރެވޭނަމަ؛ ނޫންނަމަ EAST ގައި ހަމައެކަނި ރައްކާވާނެ.
