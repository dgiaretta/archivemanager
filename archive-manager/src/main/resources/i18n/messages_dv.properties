aip.isIn=މިއީ މީގެ ކޮންޓެންޓް ޑޭޓާ އޮބްޖެކްޓް:
aip.isInNote=އޭގެ ޞަފްޙާއިން OAIS އިން ބޭނުންވާ ހުރިހާ ބައެއް އޭގައި ހުރިތޯ ދައްކާ.
aip.note=މި ޑޭޓާ އޮބްޖެކްޓްގެ ވަށައިގެން އާކައިވަލް އިންފޮމޭޝަން ޕެކޭޖެއް ހަދާ، OAIS އިން ބޭނުންވާ އަދި އާކައިވަށް އެނގޭ ނުވަތަ ހޯދޭ ހުރިހާ އެއްޗަކާއެކު: އޭގެ ކޮންޓެންޓް މަޢުލޫމާތު (ޑޭޓާ އޮބްޖެކްޓާއި، އެ ތަފްސީރުކުރާ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތު)، ފިކްސިޓީ މަޢުލޫމާތު (އޭގެ ބިޓްތަކުގެ SHA-256، މިހާރު ލިބިގަނެވޭ)، ރެފަރެންސް، ޕްރޮވެނަންސް އަދި ކޮންޓެކްސްޓް މަޢުލޫމާތު، އަދި ޕެކޭޖް ޑިސްކްރިޕްޝަނެއް. ޕެކޭޖިންގ މަޢުލޫމާތު ލިބެނީ BagIt ގެ ގޮތުގައި ބޭރަށް ލިޔުމުން. ތިޔަބޭފުޅާއަށް ހަމައެކަނި ބުނެވޭނެ ކަންކަން ތިރީގައި؛ ދޫކޮށްލެވޭ ކަންކަން AIP ގެ ޞަފްޙާގައި ނެތް ކަމަށް ފެންނާނެ، އެޑިޓަރުން އިތުރުކުރުމަށް.
