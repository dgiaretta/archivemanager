resource.fitsFile=FITS ފައިލް
resource.fitsNote=އޭގެ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުން ބުނަނީ މިއީ FITS ފައިލެއް (PRONOM x-fmt/383) ކަމަށް، އަދި އޭގެ ހެޑަރުތަކުން އޭގައި ހުރި އެއްޗެއް ބުނޭ: އޭގެ ތާވަލްތަކަށް TOPCAT، އޭގެ ފޮޓޯތަކަށް DS9 އާއި Aladin ހުށަހެޅޭ. އެއިން ކިޔަނީ FITS ފައިލް އަމިއްލައަށް، އޮތް ގޮތަށް، ތިޔަބޭފުޅާގެ ކޮމްޕިއުޓަރުގައި ހިނގަމުންދާއިރު (SAMP އިން) ފޮނުވައިގެން — އޭގެ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުން މި ހާއްސަ ފައިލް ތާވަލް ނުވަތަ ފޮޓޯ ވިއުއަކާއެކު ތަފްސީލުކުރާނަމަ މެނުވީ: އޭރުން އެއްޗެހިންނަށް ލިބެނީ ސާވަރުގައި ޑިކޯޑްކޮށްފައި، ކޮލަމްތަކަށް ނަން ދީ ޔުނިޓާއެކު. "FITS ފައިލް" ލިންކް ކޮންމެ FITS ރީޑަރަކާއެކު ބޭނުންކުރެވޭ.
resource.describeFits=މި FITS ފައިލް އޭގެ ހެޑަރުތަކުން ތަފްސީލުކުރޭ
resource.describeFitsNote=RepInfo ޓޫލްސްގައި: އޭގެ ކޮލަމްތަކާއި ޕިކްސެލްތައް ބާވަތާއި، ނަމާއި، ޔުނިޓާއި، މާނައާއެކު، އަދި FITS ކީވޯޑް ޑިކްޝަނަރީން އޭގެ ކީވޯޑްތަކުގެ މާނަތަކާއެކު — މި ޑޭޓާ އޮބްޖެކްޓްގެ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުގެ ގޮތުގައި ރައްކާކުރުމަށް، އެހެންކަމުން އާކައިވަށް އެ ޑިކޯޑްކޮށް، އޭގެ ތާވަލާއި ފޮޓޯ ދައްކައި، އޭގެ އަގުތައް ޕްރިންޓް ކުރެވޭނެ.
resource.tableNote="TOPCAT އިން ބަލާ" ނުވަތަ "SPLAT" އިން ޑޭޓާ، ސާވަރުގައި VOTable އެއްގެ ގޮތުގައި ޑިކޯޑްކޮށް، ތިޔަބޭފުޅާގެ ކޮމްޕިއުޓަރުގައި ހިނގާ އެ އެޕްލިކޭޝަނަށް ފޮނުވާ (SAMP އިން؛ މި ޞަފްޙާއަށް ހުއްދަ ދިނުމަށް އެއިން އެދޭނެ). SPLAT ހުށަހެޅެނީ ތާވަލްގެ ހުރިހާ ކޮލަމެއް ނަންބަރުނަމަ، ސްޕެކްޓްރަމެއްގެ ފަދައިން. VOTable ލިންކް ކޮންމެ ވާޗުއަލް އޮބްޒަވޭޓަރީ ޓޫލަކާއެކު ބޭނުންކުރެވޭ. ހަމަ މި އިޚްތިޔާރުތައް ގްރާފުގައި ޑޭޓާ އޮބްޖެކްޓްގެ ރައިޓް ކްލިކް މެނޫގައި ވެސް ހުރި.
resource.imageNote=އޭގެ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުން އެ ފޮޓޯއެއްގެ ގޮތުގައި ބަލާނެ ގޮތް ވެސް ބުނޭ. "DS9 އިން ބަލާ" ނުވަތަ "Aladin" އިން ފޮޓޯ، ސާވަރުގައި FITS ގެ ގޮތުގައި ޑިކޯޑްކޮށް، ތިޔަބޭފުޅާގެ ކޮމްޕިއުޓަރުގައި ހިނގާ އެ އެޕްލިކޭޝަނަށް ފޮނުވާ (SAMP އިން). Fiji/ImageJ އިން SAMP ބޭނުން ނުކުރޭ: FITS ލިންކުގެ ފައިލް އޭގައި ހުޅުވާ، ނުވަތަ File &rsaquo; Import &rsaquo; URL އިން ލިންކުގެ އެޑްރެސް ދޭ. FITS ހެޑަރުގައި ޕިކްސެލްތަކުގެ ޔުނިޓާއި މާނަ ހިމެނޭ.
resource.launch={0} ފައްޓާ
resource.launchNote=ތިޔަބޭފުޅާގެ ކޮމްޕިއުޓަރުގައި TOPCAT ނުވަތަ SPLAT ނެތްތަ؟ "ފައްޓާ" އިން، މި ޑޭޓާ ކުރިން ލޯޑްކޮށް، އާކައިވުން ޑައުންލޯޑްކޮށް، އިންސްޓޯލް ކުރަން ނުވަތަ ކަނެކްޓް ކުރަން އެއްވެސް އެއްޗެއް ނެތި، އެޕްލިކޭޝަން ހުޅުވާ — ތިޔަބޭފުޅާގެ ގައި <a href="https://openwebstart.com/" target="_blank" rel="noopener">OpenWebStart</a> (ހިލޭ، އެއް ފަހަރު އިންސްޓޯލް ކުރާ؛ ލިންކުން ޑައުންލޯޑްކުރާ <code>.jnlp</code> ފައިލް އެއިން ހުޅުވާ) ހުރުމުން. އެޕްލިކޭޝަން ސައިން ކޮށްފައިވަނީ މި އާކައިވްގެ <a href="{0}">އަމިއްލައަށް ސައިންކުރި ސެޓްފިކެޓުން</a>: ފުރަތަމަ ފަހަރު، OpenWebStart އިން އެއަށް އިތުބާރު ކުރަންތޯ އަހާ؛ މި ޕަބްލިޝަރަށް އަބަދު އިތުބާރު ކުރުން ހޮވާ، ދެން ފެށުމުގައި ނާހާނެ.
values.title=އަގުތައް މިތާގައި ބަލާ
values.note=ސާވަރުގައި އޭގެ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުން ޑޭޓާ ޑިކޯޑްކޮށް ކޮންމެ އަގެއް ޕްރިންޓް ކުރޭ، ބިޓްތަކުގައި އެ ހުރި ތަނާއި، އެއިން މާނަކުރާ އެއްޗަކާއެކު (އޭގެ މާނަ، ކޯޑެއްގެ މާނަ، ޔުނިޓާއެކު ސްކޭލް ކުރެވިފައިވާ އަގެއް)، RepInfo ޓޫލްސްއިން ނަމޫނާ ފައިލަކަށް ކުރާ ގޮތަށް — އެއް ފަހަރާ އެއް ޞަފްޙާ، ބޮޑު ފައިލަކުން ބްރައުޒަރު ފުރިނުގަތުމަށް. ބޮޑު ފައިލެއްގެ ފުރަތަމަ ޞަފްޙާ ޑިކޯޑް ކުރަން ވަގުތު ނަގާ؛ ދެން އަންނަ ޞަފްޙާތައް ނުނަގާ.
