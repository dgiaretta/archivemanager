edit.handWrittenNote=އެ ލެންގުއޭޖުގައި މި ޓްރީއިން ޖެނެރޭޓްކުރާ އެއްޗެއްގެ ބަދަލުގައި ބޭނުންކުރެވޭ. ތަފްސީލާއެކު ރައްކާކުރެވޭ މާނަތައް އަދިވެސް ލިބެނީ ޓްރީއިން (އަދި ހަމައެކަނި އަތުން ލިޔާނަމަ ޓްރީ އިޚްތިޔާރީ).
edit.oneProblem=ތަފްސީލު އޭގެ ލެންގުއޭޖްތަކުގައި ޖެނެރޭޓް ކުރެވުމުގެ ކުރިން ރަނގަޅުކުރަން ޖެހޭ 1 މައްސަލަ - ތިރީގައި ބަލާ.
