aip.alreadyIn=މި ޑޭޓާ އޮބްޖެކްޓް ކުރިން މި AIP ގައި ހުރި.
aip.noStorage=ޑޭޓާ އޮބްޖެކްޓްގެ ބިޓްތަކަށް ސްޓޯރޭޖް ލޮކޭޝަނެއް ނެތް.
