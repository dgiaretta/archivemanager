transform.asTextNote=ޓްރާންސްފޯމޭޝަނާއެކު ރެކޯޑް ކުރެވެނީ މިއީ. މަތީގެ ބަދަލުގައި މިތާގައި އެޑިޓް ކުރެވޭނެ: ކޮންމެ ލައިނެއްގައި އެއް ގަވާއިދު — <code>for star in stars.entry</code>، <code>star.ra = stars.entry.ra</code>، <code>star.ra_rad = stars.entry.ra * 0.0174532925</code>، <code>n = count(stars.entry)</code>، <code>version = "2"</code>.
