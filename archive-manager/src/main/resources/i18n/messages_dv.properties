image.note=ހިއްލުމަށް ދަމާ، ނުވަތަ ޒޫމް ކުރުމަށް މައުސްގެ ވީލް ބޭނުންކުރޭ. "ފުރަތަމަ ރޯ ތިރީގައި" އަކީ އެސްޓްރޮނޮމީގެ ގަވާއިދު، DS9 އާއި Aladin އިން FITS ފޮޓޯ ދައްކާ ގޮތަށް.
