import.intro=ފުރިހަމަ، އަމިއްލައަށް ކަނޑައެޅިފައިވާ Turtle އެއް ޕޭސްޓް ކުރޭ -- އޭގެ އަމިއްލަ <code>@prefix</code> ލައިންތައް ވެސް ހިމެނޭގޮތަށް؛ އެއީ އެހެން ތަނަކުން ލިބޭ އެއްޗެއް ނޫން. މި ޕްރޮޖެކްޓްގެ <code>rdf/*.ttl</code> ފައިލްތަކުގެ ތެރެއިން ކޮންމެ ފައިލެއްގެ ކޮންޓެންޓް (މިސާލަކަށް <code>sample-data-science.ttl</code>) ސީދާ ޕޭސްޓް ކުރެވޭނެ. ޕޭސްޓް ކުރާ ކޮންޓެންޓް ފުރަތަމަ ކިޔާލަނީ ވަގުތީ މޮޑެލެއްގައި: އެއީ ސައްޙަ އެއްޗެއް ނޫންނަމަ، ތިޔަބޭފުޅާގެ އަސްލު ޑޭޓާއަށް އަތެއް ނުލާނެ -- ރަނގަޅުކޮށް އަލުން ފޮނުވާ.
