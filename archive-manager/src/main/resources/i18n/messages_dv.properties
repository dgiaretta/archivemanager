upload.intro=ބަލްކް އަޕްލޯޑް ސްޕްރެޑްޝީޓެއް (NAM ގެ ޕްރިޒަވޭޝަން ޕޮލިސީ އަދި އިމްޕްލިމެންޓޭޝަން ޕްލޭނުގެ "Upload Spreadsheet and Accession Register" ގައިވާ 26 ކޮލަމްގެ ފޯމެޓް) <code>.xlsx</code> ނުވަތަ <code>.csv</code> ގެ ގޮތުގައި އަޕްލޯޑް ކުރޭ. ކޮލަމްގެ ހެޑަރުތައް ސްޕްރެޑްޝީޓްގެ ފީލްޑްގެ ނަންތަކާ އެއްގޮތް ވާން ޖެހޭ (ބޮޑު/ކުޑަ އަކުރާއި ހުސްޖާގަ ބަލައެއް ނުގަނެވޭ، އެހެންވީމާ <code>FixityHashSHA256</code> އާއި <code>fixity hash sha256</code> އެއްގޮތެވެ؛ <code>Title</code> ގެ ބަދަލުގައި <code>Original Title</code> ވެސް ބަލައިގަނެވޭނެ). ތަކުރާރުކުރެވޭ ފީލްޑްތަކުގައި (Subject, Description, Contributor, Date, Type, Format, Identifier, Source, Language, Relation, Coverage, Rights, Provenance, FormatInfo, Semantics, OtherRI) އެއް ސެލެއްގައި <code>;</code> އިން ވަކިކޮށް އެތައް އަގެއް ލިޔެވޭނެ.
upload.preferXlsx=<strong>ތިޔަބޭފުޅާގެ ޑޭޓާގެ ތެރޭގައި ދިވެހި (ނުވަތަ ލެޓިން ނޫން އެއްވެސް އަކުރެއް) ހިމެނޭނަމަ .csv ގެ ބަދަލުގައި .xlsx ބޭނުންކުރައްވާ.</strong> Excel ގެ "CSV (Comma delimited)" އެކްސްޕޯޓް ފައިލް ލިޔަނީ ސިސްޓަމްގެ ANSI ކޯޑްޕޭޖުން، UTF-8 އިން ނޫން، "CSV UTF-8 (Comma delimited)" ހާއްސަކޮށް ހޮވައިފިނަމަ މެނުވީ -- އަދި Windows ގެ ANSI ކޯޑްޕޭޖަށް ތާނަ އަކުރު އެއްގޮތަކަށްވެސް ނުކިޔޭ، އެހެންވީމާ އެ އެކްސްޕޯޓުން ކޮންމެ ދިވެހި އަކުރެއްގެ ބަދަލުގައި ފައިލުގައި <code>?</code> އެއް ލިޔެވެނީ، މި އެޕްލިކޭޝަނަށް ފައިލް ލިބުމުގެ ކުރިން. CSV އަށް ވަދެއްޖެނަމަ އެ ގެއްލުން ދާއިމީ؛ ގެއްލިފައިވާ CSV އެއް އަލުން އަޕްލޯޑް ކުރިޔަސް، މި އެޕްލިކޭޝަނުގައި ކޯޑިންގ ހިންގާ ގޮތަކުން ވެސް އެ ރަނގަޅެއް ނުވާނެ. އަސްލު <code>.xlsx</code> އަޕްލޯޑް ކުރުމުން އެ ގެއްލުން ލިބޭ ފިޔަވަޅު މުޅިން ދޫކޮށްލެވޭނެ.
upload.rows=ކޮންމެ ރޯއެއް ކެޓަލޮގުގެ ރެކޯޑަކަށް ވާނެ. މުޅި އަޕްލޯޑް ވާނީ އެކްސެޝަން ރަޖިސްޓަރީގެ އެއް އެންޓްރީއަކަށް، އެއިން ހެދުނު ހުރިހާ ރެކޯޑަކާ ގުޅިގެން. އެއްވެސް ކޮލަމެއް ލާޒިމެއް ނޫން -- ހުސް ސެލަކުން ދައްކަނީ އެ ރޯއަށް އެ ޕްރޮޕަޓީ ރެކޯޑްކޮށްފައި ނެތްކަން، އެއީ އާދައިގެ ކަމެއް؛ ރޯއެއް ދޫކޮށްލެވެނީ (އަދި އެކަން ރިޕޯޓް ކުރެވޭނެ، ސިއްރުން ދޫކޮށެއް ނުލެވޭ) އެ ކިޔުމުގައި ހަގީގީ ގޮތެއްގައި ނުވިސްނޭ މައްސަލައެއް ދިމާވެއްޖެނަމަ ހަމައެކަނި.
upload.file=ސްޕްރެޑްޝީޓް ފައިލް (.xlsx ނުވަތަ .csv)
upload.accessionDescription=އެކްސެޝަންގެ ތަފްސީލު
upload.accessionExample=މިސާލަކަށް: މަސްވެރިކަމުގެ ވުޒާރާއިން ހަވާލުކުރުން، މާރިޗު 2026
upload.depositor=ހަވާލުކުރި ފަރާތް
upload.depositorHint=އުފެއްދި ފަރާތާ ތަފާތުނަމަ
upload.archivist=ރެކޯޑްކުރި އާކައިވިސްޓް
