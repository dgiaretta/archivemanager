edit.quote=ކޯޓް (މިސާލަކަށް <code>"</code>): ސެޕަރޭޓަރ ހިމެނޭ އަގުތައް އޭގެ ތެރޭގައި، އަދި ތެރޭގައި ދެފަހަރު ލިޔެފައިވާ ކޯޓަކީ އެއް ކޯޓް؛ އަގުތައް ދުވަހަކުވެސް ކޯޓް ނުކުރާނަމަ ހުސްކޮށް ބާއްވާ
