start.known.note=ސްޕްރެޑްޝީޓަކަށް ނުވަތަ ވަކިކޮށްފައިވާ ލިޔުމަކަށް، ޝާއިޢުކޮށްފައިވާ ސްޕެސިފިކޭޝަނަކުން އޭގެ ބިނާ ކަނޑައަޅާ، އަދި ސޮފްޓްވެއަރެއް ކުރިން އެ ކިޔާ: ކޮންމެ ކޮލަމެއްގެ މާނަ ހަމައެކަނި ތަފްސީލުކުރޭ. އެ ރައްކާކުރެވެނީ ސިމެންޓިކް ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުގެ ގޮތުގައި، ފޯމެޓް ޕްރޮފައިލަކާއި (ސްޓްރަކްޗަރ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތު) ފޯމެޓް ކިޔާ ސޮފްޓްވެއަރާއެކު (އެހެނިހެން ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތު: އެތައް އެޕްލިކޭޝަނެއްގެ ތެރެއިން ކޮންމެ އެއްޗެއް)، ނުވަތަ ކުރިން އާކައިވްގައި ހުރި ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތާއެކު ބޭނުންކުރެވޭ.
