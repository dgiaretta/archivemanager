transform.tipsNote=ސަލާމަތްވާން ޖެހޭ ކޮންމެ އަގަކަށް، ނަތީޖާއާއި އެ ޗެކްކުރި ގޮތް ރެކޯޑް ކުރޭ. އައު ފޯމެޓްގައި އަގުތައް ހުރި ތަން (<code>star.ra</code> ފަދަ ޕާތެއް) ދީފައިވެ، އައު ޑޭޓާގެ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުން އެ ޑިކޯޑް ކުރެވޭނަމަ، ކުރީގެ އަދި އައު ޑޭޓާ ޑިކޯޑްކޮށް އާކައިވް އަމިއްލައަށް އެ ޗެކްކޮށް، އެކަން ރެކޯޑް ކުރާނެ.
