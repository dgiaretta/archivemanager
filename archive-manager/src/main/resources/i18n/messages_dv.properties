start.fits.note=ޕްރައިމަރީ ހެޑަރ + ޑޭޓާ ޔުނިޓް، FITS ސްޓޭންޑަރޑްގެ ލާޒިމީ ކީވޯޑް ކާޑުތަކާއި (SIMPLE، BITPIX، NAXIS...) އެއްޗެހީގެ ހަގީގީ މާނަތަކުން ކުރިން ފުރާފައި.
start.fits.action=FITS އިން ފަށާ
start.hdf5.note=ތިޔަބޭފުޅާގެ އަމިއްލަ ޓްރީއަކުން ބަދަލުކުރުމަށް ލޮޖިކަލް ސްކީމާއެއްގެ މިސާލެއް (ގްރޫޕް/ޑޭޓާސެޓް/އެޓްރިބިއުޓް) -- HDF5 ގައި ބައިޓަށް ބައިޓް މޮޑެލް ކުރެވޭނެ ސާބިތު އާންމު ލޭއައުޓެއް ނެތް.
start.hdf5.action=HDF5 މިސާލުން ފަށާ
start.telemetry=ޓެލެމެޓްރީ ޕެކެޓްތައް
start.telemetry.note=ޢަދަދުތަކާއި، ޕެކެޓްގެ ބާވަތުން ކުރާ އިޚްތިޔާރެއް، ދިގުމިން ކުރިން އަންނަ މެސެޖެއް، ޝަރުތީ ޗެކްސަމެއް، އަދި ޔުނިޓާއި ކޯޑް ލިސްޓްތަކާއެކު ސްކޭލް ކުރެވިފައިވާ އަގުތައް ބޭނުންކުރާ ބައިނަރީ މިސާލެއް.
start.telemetry.action=ޓެލެމެޓްރީ މިސާލުން ފަށާ
start.fitsHeaders=ނުވަތަ FITS ފައިލެއް އޭގެ ހެޑަރުތަކުން ތަފްސީލުކުރޭ
start.fitsHeaders.note=FITS ފައިލަކީ އަމިއްލައަށް އަމިއްލަ ނަފްސު ތަފްސީލުކުރާ ފައިލެއް: އޭގެ ހެޑަރުތަކުން ކޮންމެ HDU އެއްގައި ހުރި އެއްޗެއް ބުނޭ. އޭގެ ހެޑަރުތައް ވާނީ އެ ހާއްސަ ފައިލްގެ ތަފްސީލަކަށް — ކޮންމެ ހެޑަރެއް އޭގެ ކީވޯޑް ރެކޯޑްތަކުގެ ރެކޯޑަކަށް، ކޮންމެ އެއްޗެއް FITS ކީވޯޑް ޑިކްޝަނަރީގައިވާ (FITS ސްޓޭންޑަރޑް 4.0) އެ ކީވޯޑްގެ މާނައާ ގުޅިގެން؛ ކޮންމެ ފޮޓޯއެއް ޕިކްސެލް ރޯތަކެއްގެ ގޮތުގައި، BITPIX އިން ބާވަތް ކަނޑައަޅައި، BUNIT، BSCALE، BZERO އަދި BLANK އަކީ އޭގެ ޔުނިޓް، ސްކޭލް، އޮފްސެޓް އަދި ފިލް އަގު؛ ކޮންމެ ތާވަލެއްގެ ކޮލަމްތައް TFORMn އިން ބާވަތް ކަނޑައަޅައި TTYPEn އިން ނަން ދީ، TUNITn، TSCALn، TZEROn، TNULLn، TLMINn އަދި TLMAXn އާއެކު. ދެން އާކައިވަށް އެ ޑިކޯޑްކޮށް، އޭގެ ތާވަލާއި ފޮޓޯ ދައްކައި، އޭގެ ކޮލަމްތަކުގެ މާނަ ބުނެވޭނެ. ކިޔެނީ ހެޑަރުތައް ހަމައެކަނި. ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުން FITS ކަމަށް ބުނާ ޑޭޓާ އޮބްޖެކްޓެއް އޭގެ ޞަފްޙާއިން ހަމަ މިގޮތަށް ތަފްސީލު ކުރެވޭނެ.
