preview.save.note=ޑޭޓާ އޮބްޖެކްޓަކާ ގުޅުވައިފައިވާ ސްޓްރަކްޗަރ/ސިމެންޓިކް ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތު ހަދާ، އާކައިވްގެ އެހެން ބައިތަކުގައި ކޮންމެ ފޯމެޓެއްގެ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތު މޮޑެލް ކުރާ ގޮތަށް. މަތީގައި ޖެނެރޭޓްކުރި ތަފްސީލުތަކުގެ ތެރެއިން ސްޓްރަކްޗަރ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުގެ ގޮތުގައި ބާއްވާނެ އެއްޗެހި ހޮވާ — ފީލްޑްތަކުގެ ސިމެންޓިކްސް ކޮންމެ ގޮތެއްގައި ވެސް ރައްކާ ކުރެވޭ، ފީލްޑް/ރޯ އަކަށް އެއް ސިމެންޓިކް ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުގެ އިންޑިވިޖުއަލްގެ ގޮތުގައި (ސިމެންޓިކް ނަން އޭގެ <code>rdfs:label</code>، ތަޢުރީފު އޭގެ <code>skos:definition</code>، ޔުނިޓް <code>im:hasUnitOfMeasurement</code> އިން ގުޅުވައިފައި)، މުޅި ތަފްސީލަށް އާންމު ސިމެންޓިކް ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތެއްގެ ދަށުގައި އެއްކޮށްފައި.
