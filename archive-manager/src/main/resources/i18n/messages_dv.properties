start.csv.note=ވަކިކޮށްފައިވާ ލިޔުން: ފައިލް ނިމެންދެން ކޮންމެ ލައިނެއްގައި ކޮމާއިން ވަކިކޮށްފައިވާ އެއް ރީޑިންގ، އޭގެ ކޮލަމްތަކުގައި ޔުނިޓް، ސްކޭލް ފެކްޓަރ، ސައްޙަ ރޭންޖް އަދި ފިލް އަގު.
