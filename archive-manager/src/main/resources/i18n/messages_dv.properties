register.intro=ކޮންމެ އެކްސެޝަނެއް (އެއް ފަހަރާ، އެއް ޕްރޮވެނަންސަކުން NAM އަށް ހަވާލުކުރެވުނު ރެކޯޑްތަކުގެ ސެޓެއް) މިތާގައި ލިސްޓްކޮށްފައިވާނެ، ލޮގިން ނުވެ ކޮންމެ ބޭފުޅަކަށް ބެލޭނެ ގޮތަށް. ކޮންމެ އެންޓްރީއަކުން އޭގެ ފުރިހަމަ ތަފްސީލަށް ދެވޭނެ -- ސިފަތައް، ބައިވެރިވި ފަރާތްތައް، އަދި އެ އެކްސެޝަނުގައި ހިމެނޭ ކޮންމެ ރެކޯޑެއް.
