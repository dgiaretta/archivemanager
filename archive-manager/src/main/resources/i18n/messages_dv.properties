resource.aipNote=bag އިން ކޮންމެ އެއްޗެއްގެ ނަން <code>oais-aip-components.txt</code> ގައި ބުނޭ، އަދި ނެތް އެއްޗެއް <code>bag-info.txt</code> ގައި ބުނޭ. ނެތް އެއްޗެހި <a href="{0}">އެޑިޓަރުން</a> އިތުރުކުރޭ.
