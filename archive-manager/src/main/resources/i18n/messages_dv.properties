entity.literalsNote=މިތާގައި މޮޑެލް ކުރެވިފައިވާ OAIS އިންފޮމޭޝަން މޮޑެލްގައި އޭގެ އަމިއްލަ ސާދާ ލިޔުމުގެ ޕްރޮޕަޓީއެއް ނެތް — ކޮންމެ OAIS ޕްރޮޕަޓީއެއް ކްލާހެއް އަނެއް ކްލާހަކާ ގުޅުވާ (މިސާލަކަށް އެކްސެސް ރައިޓްސް މަޢުލޫމާތު، ޑޭޓާ އޮބްޖެކްޓް)، އެހެންވީމާ ތިރީގެ ލިސްޓުގައި އެއްވެސް އެއްޗެއް ނުފެންނާނެ. OAIS އެންޓިޓީއަކަށް ތަފްސީލެއް އިތުރުކުރުމަށް <strong>Common (RDFS)</strong> → <code>rdfs:comment</code> ބޭނުންކުރޭ (ނަމޫނާ ޑޭޓާއިން ކުރަނީ މިއީ)، ނުވަތަ ތިރީގައިވާ <strong>ގުޅުންތައް</strong> ގައި ހަގީގީ OAIS ގުޅުމެއް އިތުރުކުރޭ.
