resource.openDataNote=މި ޑޭޓާ އޮބްޖެކްޓްގެ ބިޓްތަކަށް ސްޓޯރޭޖް ލޮކޭޝަނެއް އެބައޮތް، އަދި އޭގެ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުން އެ ކިޔާނެ ގޮތް ބުނޭ. އޭގެ <a href="{0}">ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުގެ މެނިފެސްޓް</a> (Turtle) އިން ޑޭޓާއާއި ކޮންމެ ތަފްސީލެއްގެ ނަން ސާފުކޮށް ބުނޭ؛ TOPCAT (<code>oais-structure-topcat</code> ރީޑަރާއެކު، <code>OAIS-RepInfo</code> ފޯމެޓް) އާއި SPLAT އެ ހުޅުވަނީ އެ އެޑްރެހުން.
