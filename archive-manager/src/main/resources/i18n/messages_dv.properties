package.intro=OAIS އިން އާކައިވަލް އިންފޮމޭޝަން ޕެކޭޖަކަށް ބޭނުންވާ ކޮންމެ ބައެއް {0} ރައްކާކޮށްފައިވާ ޕެކޭޖުގައި ހުރި ތަނާއި، އެތާގައި ބުނާ އެއްޗެއް: ޕެކޭޖް އޭގެ ސްޓޯރޭޖް ލޮކޭޝަނުން ލިބިގަނެ ހުޅުވައި، އޭގެ bag ޗެކްކޮށް، އޭގެ ފައިލްތައް ކިޔާލެވޭ — އަޕްލޯޑް ސްޕްރެޑްޝީޓް (<code>metadata.csv</code>)، METS ފައިލްގެ PREMIS، ޗެކްސަމް އޮޑިޓް، އަދި ޕްރިޒަވޭޝަން ޑިސްކްރިޕްޝަން މަޢުލޫމާތުގެ ފައިލް.
