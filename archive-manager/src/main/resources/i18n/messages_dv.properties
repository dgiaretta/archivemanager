start.intro=ސައިންޓިފިކް ޑޭޓާ ފޯމެޓެއްގެ Kaitai Struct (.ksy)، DFDL (.dfdl.xsd)، DRB (SDF ސްކީމާ ނުވަތަ drb-python ޑްރައިވަރ) އަދި/ނުވަތަ EAST (.east) ތަފްސީލެއް ބިނާކޮށް، ކޮންމެ ފީލްޑަކަށް ސިމެންޓިކް ނަމެއް، ތަޢުރީފެއް އަދި ޔުނިޓް ދޭ -- ދެން އެ އާކައިވްގައި ހަގީގީ OAIS ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތުގެ ގޮތުގައި ރައްކާކުރޭ: ބައިޓް/ލޮޖިކަލް ލޭއައުޓަށް ސްޓްރަކްޗަރ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތު، އަދި ކޮންމެ ފީލްޑެއްގެ މާނައަށް ފީލްޑަކަށް އެއް އިންޑިވިޖުއަލްގެ ގޮތުގައި ސިމެންޓިކް ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތު.
