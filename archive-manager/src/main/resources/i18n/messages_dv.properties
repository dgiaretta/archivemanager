diag.encoding.intro=މި ޞަފްޙާ ހުރީ އެއް ސުވާލަކަށް ޔަގީން ޖަވާބެއް ދިނުމަށް: ދިވެހި ލިޔުން ސުވާލު ފާހަގައަކަށް ފެންނަނީ މި އެޕްލިކޭޝަނަށް އައުމުގެ ކުރިން ގެއްލިފައިވާތީތަ (އެންމެ ގިނައިން، Excel ގެ "CSV (Comma delimited)" އެކްސްޕޯޓް، ސިސްޓަމްގެ ANSI ކޯޑްޕޭޖް ބޭނުންކުރާ، ތާނަ އަކުރު އެއްގޮތަކަށްވެސް ނުކިޔޭ)، ނުވަތަ މި އެޕްލިކޭޝަން ހިނގާ ގޮތުގައި އެއްޗެއް ކުށްވާތީތަ؟
diag.encoding.testString=ޓެސްޓް ލިޔުން
diag.encoding.testStringNote=ތިރީގައިވާ ލިޔުން ލިޔެފައިވަނީ ސީދާ މި އެޕްލިކޭޝަންގެ Java ސޯސް ކޯޑުގައި — އެއީ އަޕްލޯޑް ކުރެވުނު ފައިލެއް، ސްޕްރެޑްޝީޓެއް، ނުވަތަ ތިޔަބޭފުޅާ ލިޔުނު އެއްޗަކުން ދިޔަ އެއްޗެއް ނޫން. ރަނގަޅަށް ފެނިއްޖެނަމަ، މި އެޕްލިކޭޝަނުގެ ޑިސްޕްލޭ ރަނގަޅު، އަދި މައްސަލަ އޮތީ ކުރިއަށް، އަސްލު ސްޕްރެޑްޝީޓުގައި. މިއީ <em>ވެސް</em> ސުވާލު ފާހަގަތަކަކަށް ފެނިއްޖެނަމަ، ކުށް އޮތީ މި އެޕްލިކޭޝަނުގައި، ތިޔަބޭފުޅާގެ ޑޭޓާގައެއް ނޫން.
diag.encoding.jvm=JVM ގެ ސެޓިންގްސް
diag.encoding.notUtf8=<strong>JVM ގެ ޑިފޯލްޓް ކެރެކްޓަރ ސެޓަކީ UTF-8 އެއް ނޫން.</strong> ދިވެހި ލިޔުން މި އެޕްލިކޭޝަނުގެ ތެރޭގައި (އަސްލު ފައިލުގައި ނޫން) ގެއްލުމުގެ އެންމެ ގާތް ސަބަބަކީ މިއީ — Java 17 އަކީ Java 18 ގެ "ޑިފޯލްޓްކޮށް UTF-8" ބަދަލުގެ ކުރީގެ ވަރޝަނެއް، އެހެންވީމާ، ހާއްސަކޮށް Windows ގައި، ސެޓް ނުކުރާ JVM އެއް ބޭނުންކުރަނީ Windows ގެ ANSI ކޯޑްޕޭޖް، ތާނަ އަކުރަށް އެއްވެސް ސަޕޯޓެއް ނެތް. ހައްލު: <code>-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8</code> އާއެކު ސާފުކޮށް ފައްޓާ — މި ޕްރޮޖެކްޓްގެ <code>run.bat</code>، ނުވަތަ README ގެ އިންޓަނޭޝަނަލައިޒޭޝަން ބައި ބަލާ.
diag.encoding.utf8=<strong>JVM ގެ ޑިފޯލްޓް ކެރެކްޓަރ ސެޓަކީ UTF-8.</strong> އެ ސަބަބު ނަފީ ކުރެވިއްޖެ؛ ސުވާލު ފާހަގަތައް އަދިވެސް ފެންނަނަމަ، ގިނަ ފަހަރަށް ގެއްލުން ލިބިފައިވަނީ މި އެޕްލިކޭޝަނުން ކިޔުމުގެ ކުރިން އަސްލު ސްޕްރެޑްޝީޓުގައި (ޓެސްޓް ލިޔުމާ ބެހޭ ނޯޓު ބަލާ).
diag.encoding.defaultCharset=ޑިފޯލްޓް ކެރެކްޓަރ ސެޓް
diag.encoding.os=އޮޕަރޭޓިންގ ސިސްޓަމް
diag.encoding.javaVersion=Java ވަރޝަން
diag.encoding.locale=LANG/LC_ALL/LC_CTYPE ހުރިހާ އެއްޗެއް "(not set)" ނުވަތަ ހަމައެކަނި <code>C</code> ނުވަތަ <code>POSIX</code> (ASCII ހަމައެކަނި، Unicode ނެތް) ފަދަ އެއްޗެއްނަމަ، އެއީ އޮޕަރޭޓިންގ ސިސްޓަމާ ނުބެހޭ ވަކި ލޯކަލް މައްސަލައެއް — Windows އަށް ވެސް Linux/WSL އަށް ވެސް އަސަރުކުރާ. <code>C.UTF-8</code> އަކީ އެއިން އެއްޗެއް <strong>ނޫން</strong> — އެއީ C ގޮތަށް ތަރުތީބުކުރާ، ފުރިހަމަ UTF-8 ސަޕޯޓް ލިބޭ، ހަގީގީ Unicode ލޯކަލެއް، ގިނަ ފަހަރަށް ކޮންޓެއިނަރުތަކާއި ކުޑަ ސާވަރ އިމޭޖްތަކުގައި ގަސްދުގައި ބޭނުންކުރާ. <code>run.sh</code> (Linux/macOS) އާއި <code>run.bat</code> (Windows) ލޯކަލް ކޮންމެ ގޮތެއްގައި ވިޔަސް JVM އަށް UTF-8 ސާފުކޮށް ލާޒިމުކުރޭ، އެކަން މުހިންމުވާ ހާލަތްތަކަށް (Java 17 އާއި އޭގެ ކުރީގެ ވަރޝަންތައް، JEP 400 ގެ ކުރިން)؛ Java 18 އިން ފެށިގެން JVM ހުރިހާ ތަނެއްގައި UTF-8 ބޭނުންކުރާތީ، މި ހައްލަކުން އިތުރަށް ކުރާނެ ކަމެއް ނެތް.
diag.encoding.still=ހަގީގީ އަޕްލޯޑަކުން އަދިވެސް ސުވާލު ފާހަގަތައް ފެނޭތަ؟
diag.encoding.stillXlsx=މަތީގައިވާ ޓެސްޓް ލިޔުމުން ޓެސްޓް ކުރެވެނީ ޕައިޕްލައިންގެ ޑިސްޕްލޭ ބައި ހަމައެކަނި — އެއީ ފައިލް ކިޔުމުން ދިޔަ އެއްޗެއް ނޫން. ތިޔަބޭފުޅާގެ އަސްލު ފައިލް މި ޞަފްޙާ ފާސްވެ، ނަމަވެސް އިމްޕޯޓް ކުރުމަށްފަހު ސުވާލު ފާހަގަތައް ފެނޭނަމަ، ނުވަތަ މައްސަލަ ދިމާވާ ފައިލް ސީދާ ޓެސްޓް ކުރަން ބޭނުންނަމަ، <a href="{0}">XLSX ކިޔުމުގެ ޓެސްޓް</a> ބޭނުންކުރޭ: ހަގީގީ ފައިލް އަޕްލޯޑްކޮށް، މި އެޕްލިކޭޝަނުގެ އެހެން އެއްވެސް ބައެއް ހިނގުމުގެ ކުރިން Apache POI އެ ފައިލުން ނަގާ އެއްޗެއް ބަލާ.
diag.encoding.stillTdb2=<em>އެ</em> ޞަފްޙާ ވެސް ރަނގަޅު، ނަމަވެސް ހަގީގީ އިމްޕޯޓަކުން ލިޔުން ގެއްލޭނަމަ، ޓެސްޓް ނުކުރެވި ހުރި ހަމައެކަނި ބައަކީ Jena/TDB2 ސްޓޯރޭޖްގެ ދިއުމާއި އައުން — މި ޞަފްޙާއިން ވެސް XLSX ކިޔުމުގެ ޓެސްޓުން ވެސް ޑޭޓާ ގްރާފަށް ލިޔުމެއް ނުވަތަ އެއިން ކިޔުމެއް ނުކުރެވޭ. <a href="{0}">TDB2 ދިއުމާއި އައުމުގެ ޓެސްޓް</a> ހަމަ އެ ދިވެހި ލިޔުން ޑޭޓާ ގްރާފަށް ލިޔެ، ކޮމިޓްކޮށް، ހަގީގަތުގައި ވަކި ރިކުއެސްޓެއްގައި އަލުން ކިޔާލައެވެ — ހަގީގީ އިމްޕޯޓަކާއި ފަހުން ކެޓަލޮގް ޞަފްޙާއެއް ބެލުމާ އެއްގޮތަށް.
diag.tdb2.short=TDB2 ދިއުމާއި އައުމުގެ ޓެސްޓް
diag.tdb2.title=TDB2 ސްޓޯރޭޖްގެ ދިއުމާއި އައުމުގެ ޓެސްޓް
diag.tdb2.intro=އެންކޯޑިންގ ޑައިގްނޯސްޓިކްސް ޞަފްޙާގެ ސާބިތު ޓެސްޓް ލިޔުމުން ވެސް XLSX ކިޔުމުގެ ޓެސްޓުން ވެސް Jena/TDB2 އަށް އަތެއް ނުލާ — އެކަކު ފައިލް ކިޔުން މުޅިން ދޫކޮށްލާ، އަނެކަކު ސްޓޯރޭޖް މުޅިން ދޫކޮށްލާ. މި ޞަފްޙާ ޓެސްޓް ކުރަނީ ބާކީ ބައި: ދިވެހި ލިޔުމަކީ ޑޭޓާ ގްރާފަށް ލިޔެ، ކޮމިޓްކޮށް، ފަހުން ވަކި ރިކުއެސްޓެއްގައި އަލުން ކިޔާއިރު ސަލާމަތްވާ އެއްޗެއްތަ — ހަގީގީ އިމްޕޯޓަކާއި ފަހުން ކެޓަލޮގް ޞަފްޙާއެއް ބެލުމާ އެއްގޮތަށް؟
diag.tdb2.expected=ލިބެންވީ އެއްޗެއް
diag.tdb2.readBack=TDB2 އިން އަލުން ކިޔުނު އެއްޗެއް
diag.tdb2.nothing=އަދި އެއްވެސް އެއްޗެއް ލިޔެފައެއް ނުވޭ — ތިރީގައިވާ ބަޓަން އަޅާ، އެއިން މަތީގައިވާ ލިބެންވީ ލިޔުން ޑޭޓާ ގްރާފަށް ލިޔެ، އާ ރިކުއެސްޓަކުން ވަގުތުން މިތަނަށް އަނބުރާ ގެންދާނެ، އެހެންކަމުން ދެން ފެންނަ އެއްޗަކީ ހަގީގީ ކިޔުމެއް، ހަމައެކަނި ފޮނުވި އެއްޗެއްގެ އަޑުގަދަކުރުމެއް ނޫން.
diag.tdb2.action=ޓެސްޓް ލިޔުން ލިޔެ އަލުން ކިޔާ
diag.xlsx.title=XLSX ކިޔުމުގެ ޓެސްޓް
diag.xlsx.intro=މައްސަލަ ދިމާވާ ހަގީގީ .xlsx ފައިލް އަޕްލޯޑް ކުރޭ. މި ޞަފްޙާއިން ދައްކަނީ Apache POI އޭގެ ފުރަތަމަ ރޯތަކުން ނަގާ އެއްޗެއް ހަމައެކަނި — އެހެން އެއްވެސް އެއްޗަކަށް އަތެއް ނުލާ: ޑޭޓާ ގްރާފް، ސްޓޯރޭޖް، ނުވަތަ ޑިސްޕްލޭ. ދިވެހި ލިޔުން މިތާގައި ވެސް ސުވާލު ފާހަގަތަކަކަށް ފެނިއްޖެނަމަ، ގެއްލުން އޮތީ ފައިލުގައި، ނުވަތަ މި ފައިލް ކިޔާ ވަގުތުގައި (ހަގީގީ ބަގެއް، ސިސްޓަމްގެ މައްސަލައެއް ނޫން) — ކޮންމެ ގޮތެއްގައި ވިޔަސް، މި އެޕްލިކޭޝަނުގެ އެހެން ބައެއް ހިނގުމުގެ ކުރިން. މިތާގައި ރަނގަޅު، ނަމަވެސް ހަގީގީ އިމްޕޯޓަކަށްފަހު ކެޓަލޮގުގައި ސުވާލު ފާހަގައަށް ފެނިއްޖެނަމަ، މައްސަލަ އޮތީ ފަހުން (ސްޓޯރޭޖް ނުވަތަ ޑިސްޕްލޭ)، އަދި އެކަމަށް <a href="{0}">އަނެއް ޑައިގްނޯސްޓިކް ޞަފްޙާ</a> ރަނގަޅު.
