aip.community.description=އެމީހުންނަށް އެނގޭ އަދި ބޭނުންވާ ކަންކަން
aip.community.descriptionExample=މިސާލަކަށް: FITS އާއި އުޑުގެ ކޯޑިނޭޓްސް އެނގޭ؛ ޔުނިޓާއި ކެލިބްރޭޝަން ބޭނުންވޭ
aip.objective=ޕްރިޒަވޭޝަން އޮބްޖެކްޓިވް: ޑެޒިގްނޭޓެޑް ކޮމިއުނިޓީއަށް އެއިން ކުރެވެން ޖެހޭ ކަންކަން
aip.objectiveExample=މިސާލަކަށް: ފޮޓޯ ދައްކައި، ކޮންމެ ޕިކްސެލެއްގެ ފްލަކްސް އޭގެ ޔުނިޓުން ކިޔުން
