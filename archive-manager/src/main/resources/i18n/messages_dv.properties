resource.downloadDescriptionNote=އޭގެ ރެޕްރެޒެންޓޭޝަން މަޢުލޫމާތު، އެއަށް ބޭނުންވާ ހުރިހާ އެއްޗަކާއެކު، zip އެއްގެ ގޮތުގައި: <code>description.ttl</code>، އަދި ކޮންމެ ސްޓްރަކްޗަރ ތަފްސީލެއް އަދި ވިއު ސްޕެސިފިކޭޝަނެއް (DFDL، Kaitai Struct، DRB، ...) ފައިލެއްގެ ގޮތުގައި.
