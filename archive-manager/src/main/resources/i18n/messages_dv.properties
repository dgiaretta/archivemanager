graph.truncated.full=ފުރިހަމަ ގްރާފުގައި، މި ވިއުއިން އެއް ފަހަރާ ދައްކާ ވަރަށްވުރެ ގިނަ ރިސޯސް-ރިސޯސް ޓްރިޕަލް ހުރި. މިކަމުގެ ބަދަލުގައި ވަކި ރެކޯޑެއް/އޭޖެންޓެއް/އަދި އެހެނިހެން އެއްޗަކަށް ފޯކަސް ކުރާ ވިއުއެއް (އޭގެ ޞަފްޙާގައިވާ "ގްރާފުގައި ބަލާ") ބޭނުންކުރޭ، އެއިން ފުންމިން ބަދަލުކުރެވޭނެ އަދި ކޮންމެ ސައިޒެއްގެ އާކައިވެއްގައި ވެސް ހަލުވިކޮށް ހިނގާނެ.
graph.truncated.focus=މި ރިސޯހުގެ ވަށައިގެންވާ ތަނުގައި، މި ވިއުއިން އެއް ފަހަރާ ދައްކާ ވަރަށްވުރެ ގިނަ ގުޅިފައިވާ ނޯޑް ހުރި. މަތީގައިވާ ބާރުން ކުޑަ ފުންމިނެއް ބޭނުންކުރޭ.
graph.truncated.multi=މި ހޮވުމުގެ ގުޅުވައިފައިވާ ވަށައިގެންވާ ތަނުގައި، މި ވިއުއިން އެއް ފަހަރާ ދައްކާ ވަރަށްވުރެ ގިނަ ގުޅިފައިވާ ނޯޑް ހުރި. މަތީގައިވާ ބާރުން ކުޑަ ފުންމިނެއް ބޭނުންކުރޭ، ނުވަތަ އެއް ފަހަރާ މަދު އެއްޗެހި ގްރާފް ކުރޭ (މިސާލަކަށް ދިގު ލިސްޓެއްގެ ބަދަލުގައި ނަތީޖާގެ އެއް ޞަފްޙާ).
