upload.date=އެކްސެޝަންގެ ތާރީޚް
upload.action=އަޕްލޯޑް
home.title=ފުރަތަމަ ޞަފްޙާ
home.intro=<a href="https://www.ica.org/standards/RiC/ontology" target="_blank">RiC-O 1.1</a> އާއި <a href="http://ontology.oais.info/im/" target="_blank">OAIS އިންފޮމޭޝަން މޮޑެލް</a> ގެ މައްޗަށް ބިނާކޮށް، ޚާއްޞަ ބްރިޖް އޮންޓޮލޮޖީއަކުން ގުޅުވައިފައިވާ ކުޑަ އާކައިވް މެނޭޖްމަންޓް އެޕްލިކޭޝަނެއް. ރެކޯޑްތައް ސިފަކުރެވެނީ RiC-O އިން؛ ކޮންމެ ރެކޯޑެއްގެ <strong>OAIS މެޕިންގ</strong> ވިއުއިން އެއާ ގުޅޭ OAIS ކްލާސްތައް ދައްކާނެ، އަދި ނަމޫނާ ޑޭޓާގައި ގުޅުމެއް އޮތްނަމަ، ހަމަ އެ ހޯލްޑިންގްސްގެ ހަގީގީ OAIS ޕްރިޒަވޭޝަން ތަފްސީލުގެ ބިނާ ވެސް ދައްކާނެ.
home.storage=ޑޭޓާ ރައްކާކޮށްފައިވަނީ <a href="https://jena.apache.org/documentation/tdb2/" target="_blank">Apache Jena TDB2</a> ގައި، ޑިސްކުގައިވާ ހަގީގީ ޓްރާންޒެކްޝަނަލް ޓްރިޕަލް ސްޓޯރެއް، <code>{0}</code> ގައި. ކޮންމެ ބަދަލެއް ކޮމިޓް ކުރެވެނީ އެ ބަދަލު ގެނައި ރިކުއެސްޓްގެ ބައެއްގެ ގޮތުގައި — ވަކި ސޭވް ކުރާ ފިޔަވަޅެއް ނެތް، އަދި ރީސްޓާޓް ކުރިޔަސް ބާކީ ހުންނާނެ.
home.download.bridge=ބްރިޖް އޮންޓޮލޮޖީ ޑައުންލޯޑް ކުރޭ (.ttl)
home.download.oais=OAIS އޮންޓޮލޮޖީ ޑައުންލޯޑް ކުރޭ (.ttl)
home.download.extensions=ލޯކަލް OAIS އެކްސްޓެންޝަންސް ޑައުންލޯޑް ކުރޭ (.ttl)
home.card.catalogue=NAM ކެޓަލޮގް — އާންމު ހޯދުން، ލޮގިން ނުވެ
home.card.register=NAM އެކްސެޝަން ރަޖިސްޓަރީ — އާންމު، ލޮގިން ނުވެ
home.card.records=ރެކޯޑްތައް / ރެކޯޑްގެ ބައިތައް / ރެކޯޑް ސެޓްތައް
home.card.entities=ހުރިހާ އެންޓިޓީއެއް ބަލާ އަދި އެޑިޓް ކުރޭ (ކޮންމެ RiC-O ނުވަތަ OAIS ކްލާހެއް)
home.card.triples=ޑޭޓާ ގްރާފުގައިވާ ޓްރިޕަލްތައް — SPARQL ކޮންސޯލް ހުޅުވާ
home.card.graph=ގުޅުންތަކުގެ އިންޓަރެކްޓިވް ގްރާފް
statistics.intro=މިހާރު މުޅި ޑޭޓާ ގްރާފުގައި ކްލާސްތަކާއި ޕްރޮޕަޓީތައް ހަގީގަތުގައި ބޭނުންކުރެވިފައިވާ ގޮތް، އޮންޓޮލޮޖީތަކުގައި ކަނޑައަޅާފައިވާ ތަކެތީގެ ސާބިތު ލިސްޓެއް ނޫން. އިންޑިވިޖުއަލް ނުވަތަ ބޭނުން ސުމެއް ކަމުގައިވާ ތަކެތި ދޫކޮށްލެވިފައި. ގިނަ ޢަދަދުތަކުގެ ބަދަލުގައި، ރެކޯޑަށް ރެކޯޑް ގުޅުންތައް ފެންނަ ގޮތަކަށް ބަލާލުމަށް <a href="{0}">ގްރާފް</a> ބަލާ؛ އޭގެ އެންޓިޓީ ބާވަތާއި ގުޅުމުގެ ބާވަތުން ހައިލައިޓް ކުރާ ކޮންޓްރޯލްތައް މި ތާވަލްތަކާ ރަނގަޅަށް ގުޅޭ.
statistics.types=ބޭނުންކުރެވިފައިވާ އެންޓިޓީ ބާވަތްތައް
statistics.properties=ބޭނުންކުރެވިފައިވާ ޕްރޮޕަޓީތައް
statistics.propertiesNote=ކޮންމެ ޕްރޮޕަޓީއެއްގެ ޓްރިޕަލްގެ ޢަދަދު؛ އެ ބޭނުންކުރާ ތަފާތު ރެކޯޑްގެ ޢަދަދާ ތަފާތުނަމަ، އެކަން ފާހަގަކޮށްފައި — އެއީ އެ ފީލްޑް ތަކުރާރު ކުރެވޭކަމާއި، ބައެއް ރެކޯޑްތަކުގައި އެއަށްވުރެ ގިނަ އަގު ހުރިކަމުގެ ހެއްކެއް.
statistics.noData=އަދި އެއްވެސް ޑޭޓާއެއް ނެތް.
sparql.intro=އާކައިވްގެ ޑޭޓާ ގްރާފާއި އޮންޓޮލޮޖީ ގްރާފް (OAIS ސްކީމާ + ބްރިޖް އޮންޓޮލޮޖީ) ގުޅުވައިގެން SELECT ކުއެރީތައް ހިންގާ، އެހެންކަމުން އިންސްޓަންސް ޑޭޓާއާއި ސްކީމާ ލެވެލްގެ ބްރިޖް މެޕިންގ (މިސާލަކަށް <code>skos:closeMatch</code>، <code>bridge:mappingRationale</code>) އެކުގައި ކުއެރީ ކުރެވޭނެ. މިތާގައި ބަލައިގަނެވެނީ SELECT ކުއެރީ ހަމައެކަނި.
sparql.query=ކުއެރީ
sparql.run=ހިންގާ
sparql.error=މައްސަލަ:
sparql.noGraphable=މި ނަތީޖާތަކުގައި ގްރާފް ކުރެވޭނެ ރިސޯސެއް ނެތް (އެއްވެސް ކޮލަމެއް URI ރިސޯސަކާ ބަނދެވިފައެއް ނުވޭ) — މަތީގައިވާ "ގްރާފެއްގެ ގޮތުގައި ބަލާ" ބަޓަން ފެންނަނީ މަދުވެގެން އެއްޗެއް އެގޮތަށް ވާނަމަ.
oais.heading={0} ގެ OAIS މެޕިންގ
