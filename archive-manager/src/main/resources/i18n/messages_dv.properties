resource.mapPackageNote=ޕެކޭޖް ހުޅުވައި، އޭގެ bag ޗެކްކޮށް، OAIS އިން AIP އަކަށް ބޭނުންވާ ކޮންމެ ބައެއް ހުރި ތަނާއި — އަޕްލޯޑް ސްޕްރެޑްޝީޓް، METS/PREMIS، ޗެކްސަމް — އެތާގައި ބުނާ އެއްޗެއް ދައްކާ.
resource.writeOut=އެ ބޭރަށް ލިޔޭ
resource.bagit=BagIt ގެ ގޮތުގައި ޑައުންލޯޑް ކުރޭ
resource.bagitRefer=BagIt، ބިޓްތަކަށް ރިފަރ ކޮށްގެން
resource.bagitNote=މި އާކައިވަލް އިންފޮމޭޝަން ޕެކޭޖް BagIt (RFC 8493) bag އެއްގެ ގޮތުގައި، zip ކޮށްފައި: <code>data/aip.ttl</code> އިން AIP އާއި އެ ހެދިފައިވާ ހުރިހާ އެއްޗެއް ތަފްސީލުކުރޭ، އޭގެ ޑޭޓާ އޮބްޖެކްޓްތަކުގެ ބިޓްތަކާއި، ކޮންމެ ތަފްސީލެއް ފައިލެއްގެ ގޮތުގައި، އަދި OAIS އޮންޓޮލޮޖީތަކާއެކު، ހުރިހާ އެއްޗެއް SHA-256 ޗެކްސަމާއެކު — ފުރިހަމަ، އެހެން އާކައިވަކަށް ހަވާލުކުރުމަށް. ނުވަތަ ޑޭޓާ އޮބްޖެކްޓްތަކުގެ ބިޓްތައް ހިމަނުމުގެ ބަދަލުގައި އެއަށް ރިފަރ ކުރޭ: <code>fetch.txt</code> އިން ކޮންމެ އެއްޗެއް ލިބޭނެ URL (އޭގެ ސްޓޯރޭޖް ލޮކޭޝަން) ދޭ، ބޮޑު ޑޭޓާއަށް ނުވަތަ ލިބޭ ފަރާތަށް ހޯދޭނެ ތަނެއްގައި ރައްކާކޮށްފައިވާ ބިޓްތަކަށް؛ މެނިފެސްޓްގައި އެއްޗެހީގެ ޗެކްސަމް ބާކީ ހުންނާތީ، އެއްޗެހި ލިބުމުން bag ފުރިހަމަ ވާނެ.
