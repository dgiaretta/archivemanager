transform.externalNote=ޓްރާންސްފޯމޭޝަން ކުރަނީ އެހެން އެޕްލިކޭޝަނެއްނަމަ — ފޯމެޓް ކޮންވަޓަރެއް، ސްކްރިޕްޓެއް، މިޝަނެއްގެ ސޮފްޓްވެއަރ — ޑޭޓާއާއި އޭގެ ތަފްސީލު ޑައުންލޯޑްކޮށް، އެތާގައި ޓްރާންސްފޯމްކޮށް، ދެން ނަތީޖާ މިތަނަށް އަޕްލޯޑްކޮށް ކުރި ކަމެއް ބުނޭ. އެ ރެކޯޑް ވާނީ އައު AIP ވަރޝަންގެ ޕްރޮވެނަންސް މަޢުލޫމާތަށް، ފަހުން ކިޔާ ފަރާތަކަށް ޑޭޓާ ލިބުނު ގޮތް އެނގޭނެ ގޮތަށް.
