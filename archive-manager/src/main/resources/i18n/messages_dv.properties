writeBack.intro=ނަމޫނާ ފައިލެއް ޑިކޯޑްކޮށް، މަތީގައިވާ ތަފްސީލުން އަލުން ލިޔެ، ދެ ފައިލް އަޅާކިޔާ. ބަދަލެއް ނެތިއްޖެނަމަ މިއީ ދިއުމާއި އައުމެއް: އެއްގޮތް ބައިޓްތަކުން ދައްކަނީ ޑިކޯޑްކުރި އަގުތަކުން ފައިލް އަލުން ހެދުމަށް ތަފްސީލު ފުދޭކަން. ބަދަލުކުރި ފައިލެއް ލިޔުމަށް، ބަދަލުތައް <code>path = value</code> ލައިންތަކެއްގެ ގޮތުގައި ދޭ، މިސާލަކަށް <code>/header/count = 3</code>، އެލިމެންޓްތަކަށް ނަން ދޭނީ މަތީގެ ޓެސްޓުގައިވާ ގޮތަށް (ތަކުރާރުވާ އެލިމެންޓެއްގެ ދެވަނަ އެއްޗަކަށް <code>/sample[2]</code>). ޢަދަދުތަކާއި ދިގުމިނުތައް ވެސް އެއާ ގުޅޭގޮތަށް ބަދަލުކުރަން ޖެހޭ.
