start.blank.byte.note=ތަރުތީބުން ހުންނަ ބައިނަރީ ފޯމެޓެއް (FITS ފަދަ): ފައިލުގައިވާ ތަރުތީބުން ފީލްޑްތައް ކަނޑައަޅާ، ކޮންމެ އެއްޗެއްގެ ބާވަތް، ދިގުމިން، ބައިޓް އޯޑަރ، ސިމެންޓިކް ނަން، ތަޢުރީފު އަދި ޔުނިޓާއެކު. Kaitai، DFDL އަދި DRB ޖެނެރޭޓް ކުރޭ.
