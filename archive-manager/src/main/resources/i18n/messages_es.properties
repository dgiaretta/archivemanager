preview.east.test=Lee la muestra con el intérprete EAST (el módulo <code>oais-structure-east</code>) exactamente como dice la descripción de arriba, y muestra lo que lee: los registros, vectores y valores propios de EAST, con el literal de cada enumeración como significado. El archivo solo se usa para esta petición; no se guarda nada.
preview.logical=Kaitai y DFDL describen una disposición secuencial de bytes, cosa que este esquema lógico de estilo HDF5 no es -- vea la salida DRB de abajo, o añada una descripción aparte de la disposición de bytes del vector bruto de un conjunto de datos si la necesita.
