preview.drbJava.sdf=Un esquema SDF de DRB: un XML Schema cuyas anotaciones <code>sdf:block</code> dan la longitud, el orden de bytes y la codificación de cada campo — el lenguaje declarativo de descripción propio de DRB, aplicado por el DRB en Java de GAEL (LGPL v3). La definición de cada campo se convierte en su <code>xs:documentation</code>.
preview.drbJava.reference=Un esquema documentado como referencia, no algo que DRB lea — los esquemas SDF de DRB describen disposiciones secuenciales de bytes, y DRB no tiene implementación de HDF5.
preview.drbJava.test=Aplica el esquema de arriba con el DRB en Java, dentro de esta aplicación, y muestra el árbol de nodos decodificado con la posición en bytes de cada campo. El archivo solo se usa para esta petición; no se guarda nada.
preview.drbJava.writeBack=DRB escribe cada valor donde se leyó: un valor delimitado puede cambiar de longitud, uno de longitud fija no.
preview.viewers=Abrir en TOPCAT, SPLAT o un visor de imágenes
preview.viewers.zip=Un zip con todo lo que TOPCAT (con el lector <code>oais-structure-topcat</code>) o SPLAT (con <code>oais-structure-splat</code>) necesitan para abrir sus datos: un manifiesto de Información de Representación (Turtle) que nombra el archivo de datos, las descripciones DFDL y DRB SDF — sirve cualquiera de las dos — una vista de tabla generada a partir del árbol de elementos (el primer registro repetido como filas, sus campos como columnas, con sus unidades y significados), y lo que significa cada elemento. Cada archivo se nombra en el manifiesto, así que pueden renombrarse o moverse editándolo. Coloque su archivo de datos junto al manifiesto, con el nombre que indique aquí.
preview.viewers.image=Una imagen — un registro repetido (una fila) que contiene un campo numérico repetido (sus píxeles) — obtiene también una vista de imagen: <code>oais-structure-image</code> la escribe como FITS para Fiji/ImageJ, SAOImage DS9 o Aladin, y una vez guardada en el archivo con una ubicación de almacenamiento, el propio archivo sirve ese FITS.
preview.viewers.dataFile=Nombre del archivo de datos
preview.viewers.download=Descargar para los visores (.zip)
preview.save.note=Crea Información de Representación Estructural/Semántica enlazada a un Objeto de Datos, del mismo modo que el resto del archivo modela la Información de Representación de cualquier formato. Elija cuáles de las descripciones generadas arriba conservar como Información de Representación Estructural — la semántica de los campos se guarda de todos modos, como un individuo de Información de Representación Semántica por campo/fila (el nombre semántico como su <code>rdfs:label</code>, la definición como su <code>skos:definition</code>, las unidades enlazadas mediante <code>im:hasUnitOfMeasurement</code>), reunidos bajo una Información de Representación Semántica general para la descripción en su conjunto.
preview.filterEntities=Escriba para filtrar las entidades...
preview.save.description=Guardar la descripción {0}
preview.save.sdf=esquema SDF
