start.telemetry.action=Empezar con el ejemplo de telemetría
start.fitsHeaders=O describa un archivo FITS a partir de sus cabeceras
start.fitsHeaders.note=Un archivo FITS se describe a sí mismo: sus cabeceras dicen qué contiene cada HDU. Sus cabeceras se convierten en una descripción de ese archivo en concreto — cada cabecera un registro de sus registros de palabras clave, cada uno enlazado al significado de la palabra clave en el diccionario de palabras clave FITS (Norma FITS 4.0); cada imagen como filas de píxeles, tipadas por BITPIX, con BUNIT, BSCALE, BZERO y BLANK como unidades, escala, desplazamiento y valor de relleno; las columnas de cada tabla tipadas por TFORMn y nombradas por TTYPEn, con TUNITn, TSCALn, TZEROn, TNULLn, TLMINn y TLMAXn. Entonces el archivo puede decodificarlo, mostrar su tabla e imagen y decir qué significan sus columnas. Solo se leen las cabeceras. Un Objeto de Datos cuya Información de Representación dice que es FITS se puede describir del mismo modo desde su página.
