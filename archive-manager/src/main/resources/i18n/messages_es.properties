transform.externalNote=Si otra aplicación hace la Transformación — un conversor de formatos, un script, el software de una misión — descargue los datos y su descripción, transfórmelos allí, y luego cargue aquí el resultado e indique qué se hizo. Ese registro se convierte en la Información de Procedencia de la nueva Versión del AIP, para que quien lo lea más adelante sepa cómo se originaron los datos.
