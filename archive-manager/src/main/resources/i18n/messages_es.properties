edit.structureNote=El archivo como árbol, en el orden de los datos. Un <strong>registro</strong> agrupa elementos (y puede repetirse, o ser una línea de texto delimitado como una fila CSV); un <strong>campo</strong> es un valor; una <strong>elección</strong> es uno de varios registros, escogido por el valor de un campo anterior. Los recuentos, longitudes y condiciones pueden usar campos anteriores y aritmética, p. ej. <code>n</code>, <code>rows * cols</code>, <code>flags = 1</code>, y campos dentro de un registro leído antes, p. ej. <code>header.length + 1</code>. Seleccione un elemento para editarlo, incluido lo que significa: su nombre semántico, definición, unidades y más.
