preview.drbPython.test=Ejecuta el controlador de arriba con drb-python {0} en este servidor y muestra el árbol de nodos decodificado, y luego lo que devuelven sus complementos de metadatos y comprobaciones. El archivo solo se usa para esta petición; no se guarda nada.
preview.drbPython.noAddIns=Este servidor no ejecuta complementos escritos a mano, así que la prueba no puede ejecutarse mientras haya uno (vea <code>archive.drb-python.run-hand-written-add-ins</code>).
