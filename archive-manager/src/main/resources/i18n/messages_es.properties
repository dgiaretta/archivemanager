transform.mapping=Qué forma cada elemento del nuevo formato
transform.mappingNote=Un elemento que se repite aparece una vez por cada aparición del elemento del formato antiguo sobre el que se repite; dentro de él, los elementos del formato antiguo bajo ese son los de esa aparición. Un valor se copia (por una escala, más un desplazamiento, si se indican), se cuenta o es una constante. Los elementos se emparejaron primero por nombre o significado: compruébelos.
