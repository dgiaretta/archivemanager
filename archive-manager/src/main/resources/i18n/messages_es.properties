diag.encoding.title=Diagnóstico de codificación
diag.encoding.intro=Esta página existe para responder de forma definitiva a una pregunta: ¿el texto en dhivehi aparece como signos de interrogación porque ya estaba dañado antes de llegar a esta aplicación (lo más habitual, una exportación "CSV (delimitado por comas)" de Excel, que usa la página de códigos ANSI del sistema y no representa en absoluto la escritura thaana), o porque algo en el funcionamiento de esta aplicación falla?
diag.encoding.testString=Texto de prueba
diag.encoding.testStringNote=El texto de abajo está escrito directamente en el código fuente Java de esta aplicación — nunca ha pasado por un archivo cargado, una hoja de cálculo ni nada que usted haya escrito. Si se ve bien, la visualización de esta aplicación funciona y el problema está antes, en la hoja de origen. Si <em>también</em> aparece como signos de interrogación, el error está en esta aplicación, no en sus datos.
diag.encoding.jvm=Configuración de la JVM
diag.encoding.notUtf8=<strong>El juego de caracteres predeterminado de la JVM no es UTF-8.</strong> Es la causa más probable de que el texto en dhivehi se dañe en algún punto de esta aplicación (y no ya en su archivo de origen) — Java 17 es anterior al cambio de Java 18 a "UTF-8 por defecto", así que, sobre todo en Windows, una JVM sin configurar recurre a la página de códigos ANSI de Windows, que no admite el thaana en absoluto. Solución: iniciar con <code>-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8</code> de forma explícita — vea <code>run.bat</code> en este proyecto, o la sección de internacionalización del README.
diag.encoding.utf8=<strong>El juego de caracteres predeterminado de la JVM es UTF-8.</strong> Esa causa queda descartada; si siguen apareciendo signos de interrogación, lo más probable es que el daño ya existiera en la hoja de origen antes de que esta aplicación la leyera (vea la nota sobre el texto de prueba).
diag.encoding.defaultCharset=Juego de caracteres predeterminado
diag.encoding.os=Sistema operativo
diag.encoding.javaVersion=Versión de Java
diag.encoding.locale=Si LANG/LC_ALL/LC_CTYPE son todos "(not set)", o algo como un simple <code>C</code> o <code>POSIX</code> (solo ASCII, sin Unicode), es un problema de configuración regional independiente del sistema operativo — afecta a Linux/WSL tanto como a Windows. <code>C.UTF-8</code> en concreto <strong>no</strong> es uno de esos casos — es la ordenación al estilo C con compatibilidad UTF-8 completa, una configuración regional real y capaz de Unicode que a menudo se usa a propósito en contenedores e imágenes mínimas de servidor. <code>run.sh</code> (Linux/macOS) y <code>run.bat</code> (Windows) fuerzan UTF-8 de forma explícita en la JVM sea cual sea la configuración regional, para los casos (Java 17 y anteriores, antes de la JEP 400) en que importa; desde Java 18 la JVM ya usa UTF-8 en todas partes, así que este tipo de corrección no tiene nada más que hacer.
diag.encoding.still=¿Sigue viendo signos de interrogación con una carga real?
diag.encoding.stillXlsx=El texto de prueba de arriba solo pone a prueba la mitad del proceso que corresponde a la visualización — nunca ha pasado por la lectura de archivos. Si su archivo de origen supera esta página pero sigue mostrando signos de interrogación después de importarlo, o si quiere probar directamente el archivo exacto que le da problemas, use la <a href="{0}">prueba de lectura de XLSX</a>: cargue el archivo real y vea exactamente qué extrae de él Apache POI, antes de que intervenga cualquier otra parte de esta aplicación.
diag.encoding.stillTdb2=Si <em>esa</em> página también se ve bien pero una importación real sigue dañando el texto, el único eslabón sin probar es el viaje de ida y vuelta del propio almacenamiento de Jena/TDB2 — ni esta página ni la prueba de lectura de XLSX escriben ni leen el grafo de datos. La <a href="{0}">prueba de ida y vuelta de TDB2</a> escribe el mismo texto en dhivehi en el grafo de datos, lo confirma y lo vuelve a leer en una petición realmente separada — el mismo viaje de ida y vuelta que una importación real y una visita posterior a una página del Catálogo.
diag.tdb2.short=Prueba de ida y vuelta de TDB2
diag.tdb2.title=Prueba de ida y vuelta del almacenamiento TDB2
diag.tdb2.intro=Ni el texto de prueba fijo de la página de diagnóstico de codificación ni la prueba de lectura de XLSX pasan por Jena/TDB2 — uno se salta por completo la lectura de archivos, la otra se salta por completo el almacenamiento. Esta página prueba el eslabón que falta: ¿sobrevive un texto en dhivehi a escribirse en el grafo de datos, confirmarse y volver a leerse en una petición posterior y separada — el mismo viaje de ida y vuelta que una importación real y una visita posterior a una página del Catálogo?
diag.tdb2.expected=Esperado
diag.tdb2.readBack=Lo que se volvió a leer de TDB2
diag.tdb2.nothing=Aún no se ha escrito nada — pulse el botón de abajo, que escribe el texto esperado de arriba en el grafo de datos y vuelve enseguida aquí con una petición nueva, de modo que lo que vea después es una lectura real, no solo el eco de lo que se acaba de enviar.
diag.tdb2.action=Escribir el texto de prueba y volver a leerlo
diag.xlsx.title=Prueba de lectura de XLSX
diag.xlsx.intro=Cargue el .xlsx real que le da problemas. Esta página muestra exactamente lo que Apache POI extrae de sus primeras filas — nada más lo toca: ni el grafo de datos, ni el almacenamiento, ni la visualización. Si el texto en dhivehi ya aparece aquí como signos de interrogación, el daño o ya está en el propio archivo, o se produce en el momento de leer este archivo (un error real, no un problema del entorno) — en cualquier caso, ocurre antes de que intervenga cualquier otra parte de esta aplicación. Si aquí se ve bien pero en el Catálogo, tras una importación real, sigue apareciendo como signos de interrogación, el problema está más adelante (almacenamiento o visualización), y para eso <a href="{0}">la otra página de diagnóstico</a> es la mejor herramienta.
