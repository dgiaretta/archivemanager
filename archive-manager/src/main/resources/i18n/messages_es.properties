upload.title=Cargar al Catálogo
upload.heading=Carga masiva
upload.intro=Cargue una Hoja de Carga Masiva (el formato de 26 columnas de la Política y el Plan de Aplicación de la Preservación del NAM, "Upload Spreadsheet and Accession Register") como <code>.xlsx</code> o <code>.csv</code>. Los encabezados de las columnas deben coincidir con los nombres de los campos de la hoja (la comparación no distingue mayúsculas ni espacios, así que <code>FixityHashSHA256</code> y <code>fixity hash sha256</code> se tratan igual; <code>Original Title</code> también se acepta como encabezado alternativo de <code>Title</code>). Los campos repetibles (Subject, Description, Contributor, Date, Type, Format, Identifier, Source, Language, Relation, Coverage, Rights, Provenance, FormatInfo, Semantics, OtherRI) aceptan varios valores en una celda, separados por <code>;</code>.
upload.preferXlsx=<strong>Prefiera .xlsx a .csv si alguno de sus datos está en dhivehi (o en cualquier escritura no latina).</strong> La exportación simple "CSV (delimitado por comas)" de Excel escribe el archivo con la página de códigos ANSI del sistema, no en UTF-8, a menos que se elija expresamente "CSV UTF-8 (delimitado por comas)" -- y la página de códigos ANSI de Windows no representa en absoluto la escritura thaana, así que esa exportación sustituye en silencio cada carácter dhivehi por un <code>?</code> literal en el propio archivo, antes de que esta aplicación lo vea. Una vez en el CSV, ese daño es permanente; volver a cargar un CSV ya dañado no lo recupera, se maneje como se maneje la codificación en esta aplicación. Cargar el <code>.xlsx</code> original evita por completo ese paso con pérdidas.
upload.rows=Cada fila se convierte en un documento del Catálogo. La carga entera se convierte en una entrada del Registro de ingresos que enlaza todos los documentos que creó. Ninguna columna es obligatoria -- una celda vacía solo significa que esa propiedad no está registrada para esa fila, lo cual es normal; las filas solo se omiten (y se informa de ello, no se descartan en silencio) si algo realmente inesperado falla al leerlas.
upload.file=Archivo de la hoja (.xlsx o .csv)
upload.accessionDescription=Descripción del ingreso
upload.accessionExample=p. ej. Transferencia del Ministerio de Pesca, marzo de 2026
upload.depositor=Depositante
upload.depositorHint=Si es distinto del creador
