transform.title=Transformar {0}
transform.intro=Una Transformación reescribe este Objeto de Datos en otro formato — aquí, relacionándolo con un formato descrito en el archivo, o <a href="#external">con otra aplicación</a>. Aquí se decodifica con su propia Información de Representación, cada elemento del nuevo formato se forma con sus elementos como usted indique abajo, y el resultado se escribe con la descripción DFDL del nuevo formato. Después los nuevos datos se vuelven a decodificar con esa descripción para comprobar cada Propiedad de Información de Transformación. Hacerlo conserva los nuevos datos en el archivo y registra un nuevo Objeto de Datos, en una Versión del AIP cuya Información de Procedencia registra la Transformación — este Objeto de Datos queda como está.
transform.notTransformable=Este Objeto de Datos no se puede transformar: sus bits necesitan una ubicación de almacenamiento, y su Información de Representación una descripción DFDL, DRB SDF o Kaitai Struct con la que decodificarlos.
