hand.addIn.intro=Escriba código Python para que lo llame el controlador drb-python generado, para lo que el árbol de elementos no puede expresar. El controlador sigue leyendo el árbol de elementos; el complemento se acopla a su alrededor mediante cualquiera de estas funciones:
hand.addIn.prepare=<code>prepare(data)</code> — recibe los bytes del archivo antes de leerlos y devuelve los bytes que hay que leer: descífrelos o descomprímalos aquí.
hand.addIn.check=<code>check(root)</code> — tras la decodificación: devuelve una lista de problemas (sumas de verificación, CRC, comprobaciones cruzadas), que se añade a lo que informa el complemento <code>checks</code>.
hand.addIn.metadata=<code>metadata(root)</code> — devuelve un diccionario que se combina con lo que devuelve el complemento <code>metadata</code>.
hand.addIn.restore=<code>restore(data)</code> — cuando se reescribe el archivo: deshace <code>prepare()</code> (p. ej. vuelve a cifrar) y devuelve los bytes que hay que escribir.
hand.addIn.root=<code>root.original_bytes</code> son los bytes del archivo, <code>root.decoded_bytes</code> lo que devolvió <code>prepare()</code>, y los hijos de <code>root</code> los elementos decodificados. El complemento es <code>addin.py</code> en el paquete descargado, y se guarda en el archivo junto con el controlador.
hand.addIn.risk=Un complemento es código Python, que se ejecuta con todos los derechos de quien usa el controlador. Se comprueba que sea Python válido, pero no se puede comprobar que sea seguro.
hand.addIn.runs=Este servidor ejecuta los complementos en las pruebas con muestras.
hand.addIn.doesNotRun=Este servidor no ejecuta los complementos en las pruebas con muestras (<code>archive.drb-python.run-hand-written-add-ins</code>), así que pruebe el paquete descargado en otro sitio.
hand.intro=Escriba usted mismo la descripción en {0}, para lo que el árbol de elementos del editor no puede expresar — sumas de verificación, cifrado, otras compresiones, registros repartidos en varias líneas y todo lo demás que permita el lenguaje. Una vez guardada, sustituye a la descripción generada en la vista previa, la prueba con una muestra, la descarga y al guardar en el archivo. El árbol de elementos sigue aportando los significados (nombres semánticos, unidades, códigos) guardados como Información de Representación Semántica, pero la prueba con una muestra de una descripción escrita a mano muestra el árbol propio del motor en lugar de alinearlo con el árbol de elementos.
hand.checked=Una prueba con una muestra ejecuta la descripción dentro de esta aplicación, así que antes se comprueba: nada de DOCTYPE ni archivos incluidos desde otro sitio (DFDL puede incluir los esquemas integrados del propio Daffodil); en Kaitai Struct, nada de <code>imports</code> ni rutinas <code>process:</code> propias (zlib, xor, rol y ror vienen integradas); en DRB, nada de consultas que llamen a Java o lean archivos.
hand.outOfDate=El árbol de elementos ha cambiado desde que se escribió esto, así que lo que genera ahora es distinto. Compruebe si la descripción escrita a mano necesita el mismo cambio.
hand.description=Descripción en {0}
