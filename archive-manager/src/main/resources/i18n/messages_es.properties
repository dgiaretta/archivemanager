start.intro=Construya una descripción en Kaitai Struct (.ksy), DFDL (.dfdl.xsd), DRB (esquema SDF o controlador drb-python) y/o EAST (.east) de un formato de datos científicos, y dé a cada campo un nombre semántico, una definición y unidades -- después guárdela en el archivo como auténtica Información de Representación OAIS: Información de Representación Estructural para la disposición de bytes/lógica, e Información de Representación Semántica, un individuo por campo, para lo que significa cada uno.
