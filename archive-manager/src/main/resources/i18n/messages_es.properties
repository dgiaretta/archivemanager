writeBack.title=Reescribir
writeBack.intro=Decodifica un archivo de muestra, lo vuelve a escribir con la descripción de arriba y compara los dos. Sin cambios es un viaje de ida y vuelta: bytes idénticos significan que la descripción basta para recrear el archivo a partir de sus valores decodificados. Para escribir un archivo modificado, indique los cambios como líneas <code>ruta = valor</code>, p. ej. <code>/header/count = 3</code>, nombrando los elementos como en la prueba de arriba (<code>/sample[2]</code> para el segundo de un elemento repetido). Los recuentos y longitudes deben cambiarse en consonancia.
writeBack.changes=Cambios (opcionales)
writeBack.failed=no se pudo reescribir.
writeBack.writtenChanged=({0} bytes) reescrito con los cambios:
writeBack.writtenUnchanged=({0} bytes) reescrito sin cambios:
writeBack.identical=La descripción cubre toda la muestra y codifica cada valor tal como lo guarda la muestra.
writeBack.different=Algo en la muestra no está descrito, o no se reescribe tal como está guardado: los bytes posteriores a los datos descritos no se escriben, los números en texto pueden escribirse de otra forma (<code>1.50</code> como <code>1.5</code>) y los datos comprimidos pueden comprimirse de otra manera.
