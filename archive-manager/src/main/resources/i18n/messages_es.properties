start.fitsFile=Archivo FITS
start.fitsHeaders.action=Describirlo a partir de sus cabeceras
start.east=O lea una descripción en EAST
start.east.note=Un Registro de Descripción de Datos en el lenguaje de descripción de datos EAST del CCSDS (CCSDS 644.0-B-3): su paquete lógico y su paquete físico. Se conserva tal como está escrito y se prueba con el intérprete EAST. Sus registros, vectores, enumeraciones y variantes se convierten también en el árbol de elementos, con los literales de cada enumeración como significados de sus códigos, de modo que se pueden generar a partir de él descripciones en Kaitai Struct, DFDL y DRB y probarlas también con datos de muestra - cuando el árbol puede expresarlo; si no, se conserva solo en EAST.
