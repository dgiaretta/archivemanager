home.title=Inicio
home.intro=Una pequeña aplicación de gestión de archivos sobre <a href="https://www.ica.org/standards/RiC/ontology" target="_blank">RiC-O 1.1</a> y el <a href="http://ontology.oais.info/im/" target="_blank">Modelo de Información OAIS</a>, conectados por una ontología puente propia. Los documentos se describen de forma nativa en RiC-O; la vista <strong>Correspondencia OAIS</strong> de cada documento muestra las clases OAIS correspondientes y, cuando los datos de ejemplo enlazan una, la estructura real de descripción de preservación OAIS de los mismos fondos.
home.storage=Los datos residen en <a href="https://jena.apache.org/documentation/tdb2/" target="_blank">Apache Jena TDB2</a>, un almacén de tripletas transaccional real en disco, en <code>{0}</code>. Cada cambio se confirma como parte de la petición que lo hizo — no hay un paso de guardado aparte, y sobrevive a los reinicios.
