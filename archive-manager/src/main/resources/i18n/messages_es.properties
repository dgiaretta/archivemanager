transform.asText=La correspondencia como texto
transform.asTextNote=Es lo que se registra con la Transformación. Puede editarlo aquí en lugar de arriba: una regla por línea — <code>for star in stars.entry</code>, <code>star.ra = stars.entry.ra</code>, <code>star.ra_rad = stars.entry.ra * 0.0174532925</code>, <code>n = count(stars.entry)</code>, <code>version = "2"</code>.
transform.useText=Usar este texto, no la tabla de arriba
transform.properties=Propiedades de Información de Transformación que comprobar
transform.propertiesNote=Los valores que deben sobrevivir a la Transformación. Cada uno se comprueba decodificando los nuevos datos con su propia descripción y comparando los valores físicos (tras la escala y el desplazamiento de cada lado) — dentro de la tolerancia indicada, en las unidades de los valores, o si no lo que admitan los tipos. Las que el Objeto de Información de este Objeto de Datos ya tiene están marcadas; las demás se le añaden al transformar.
