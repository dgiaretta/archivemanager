preview.drbPython.nodes=Cada campo se convierte en un nodo hijo con su posición/longitud en bytes y su nombre semántico, definición y unidades. El módulo del controlador se muestra abajo.
preview.drbPython.addOns=El paquete también registra cuatro complementos de drb-python, que dan el significado de un archivo decodificado en su conjunto y lo reescriben: <code>{0}</code> (cada valor con su significado), <code>{1}</code> (nombre semántico → valor), <code>{2}</code> (valores fuera de su intervalo válido o de su lista de códigos, y bytes no cubiertos) y <code>{3}</code> (el archivo reescrito, con los cambios que haya), p. ej. <code>node.get_impl(dict, "{1}")</code>.
