transform.chooseFormat=Elija un formato
transform.noTargets=Aún no hay ningún formato al que transformar: hace falta una descripción DFDL en el archivo, usada por algún Objeto de Datos. Descríbalo en las Herramientas RepInfo y guárdelo en el archivo.
