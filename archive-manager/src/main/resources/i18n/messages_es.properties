resource.downloadDescriptionNote=Su Información de Representación, con todo lo que necesita, como zip: <code>description.ttl</code> y cada descripción de estructura y especificación de vista (DFDL, Kaitai Struct, DRB, ...) como un archivo.
resource.openData=Abrir los datos
resource.openDataNote=Los bits de este Objeto de Datos tienen una ubicación de almacenamiento, y su Información de Representación dice cómo leerlos. Su <a href="{0}">manifiesto de Información de Representación</a> (Turtle) nombra explícitamente los datos y cada descripción; TOPCAT (con el lector <code>oais-structure-topcat</code>, formato <code>OAIS-RepInfo</code>) y SPLAT lo abren por esa dirección.
viewer.viewWith=Ver con {0}
resource.fitsFile=Archivo FITS
resource.fitsNote=Su Información de Representación dice que es un archivo FITS (PRONOM x-fmt/383), y sus cabeceras dicen qué contiene: se ofrece TOPCAT para sus tablas, DS9 y Aladin para sus imágenes. Leen el propio archivo FITS, tal cual, enviado a ellos mientras se ejecutan en su ordenador (por SAMP) — a menos que su Información de Representación describa este archivo en concreto, con una vista de tabla o de imagen: entonces lo reciben decodificado en el servidor, con sus columnas nombradas y con sus unidades. El enlace "Archivo FITS" funciona con cualquier lector de FITS.
resource.describeFits=Describir este archivo FITS a partir de sus cabeceras
resource.describeFitsNote=en las Herramientas RepInfo: sus columnas y píxeles tipados, nombrados y con sus unidades y significados, y los significados de sus palabras clave según el diccionario de palabras clave FITS — para guardarlo como Información de Representación de este Objeto de Datos, de modo que el archivo lo decodifique, muestre su tabla e imagen e imprima sus valores.
resource.tableNote="Ver con TOPCAT" o "SPLAT" envía los datos, decodificados en el servidor como VOTable, a esa aplicación que se ejecuta en su ordenador (por SAMP; le pide que autorice esta página). SPLAT se ofrece cuando todas las columnas de la tabla son numéricas, como las de un espectro. El enlace VOTable funciona con cualquier herramienta del Observatorio Virtual. Las mismas opciones están en el menú del clic derecho del Objeto de Datos en el grafo.
resource.imageNote=Su Información de Representación también dice cómo verlo como imagen. "Ver con DS9" o "Aladin" envía la imagen, decodificada en el servidor como FITS, a esa aplicación que se ejecuta en su ordenador (por SAMP). Fiji/ImageJ no usa SAMP: abra en él el archivo del enlace FITS, o dele la dirección del enlace con File &rsaquo; Import &rsaquo; URL. La cabecera FITS lleva las unidades y el significado de los píxeles.
resource.launch=Iniciar {0}
resource.launchNote=¿No tiene TOPCAT ni SPLAT en su ordenador? "Iniciar" abre la aplicación con estos datos ya cargados, descargada del archivo, sin nada que instalar ni conectar — una vez que tenga <a href="https://openwebstart.com/" target="_blank" rel="noopener">OpenWebStart</a> (gratuito, se instala una vez; abre el archivo <code>.jnlp</code> que descarga el enlace). La aplicación está firmada con el <a href="{0}">certificado autofirmado</a> de este archivo: la primera vez, OpenWebStart pregunta si confiar en él; elija confiar siempre en este editor, y los inicios siguientes no preguntarán.
