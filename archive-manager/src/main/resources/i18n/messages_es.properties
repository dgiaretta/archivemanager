preview.kaitai.test=Compila la descripción de arriba con el compilador de Kaitai Struct (incluido en esta aplicación y ejecutado como un programa aparte), y después decodifica la muestra con el resultado, mediante el adaptador <code>oais-structure-kaitai</code>. Tarda unos segundos. El archivo solo se usa para esta petición; no se guarda nada.
