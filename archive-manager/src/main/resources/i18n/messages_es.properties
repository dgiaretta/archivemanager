resource.storedAs=Está almacenado como un paquete,
resource.mapPackage=Relacionar su paquete con los componentes del AIP
resource.mapPackageNote=Abre el paquete, verifica su bag y muestra dónde está cada componente que OAIS exige a un AIP — la hoja de carga, METS/PREMIS, las sumas de verificación — y qué dice allí.
resource.writeOut=Exportarlo
resource.bagit=Descargar como BagIt
resource.bagitRefer=BagIt, con referencia a los bits
resource.bagitNote=Este Paquete de Información de Archivo como bag BagIt (RFC 8493), comprimido: <code>data/aip.ttl</code> describe el AIP y todo aquello de lo que está hecho, con los bits de sus Objetos de Datos, cada descripción como un archivo y las ontologías OAIS, todo con sumas de verificación SHA-256 — completo, para entregar a otro archivo. O haga referencia a los bits de los Objetos de Datos en lugar de incluirlos: <code>fetch.txt</code> da la URL de donde obtener cada uno (su ubicación de almacenamiento), para datos grandes o bits guardados donde el destinatario puede obtenerlos; el manifiesto conserva sus sumas de verificación, así que el bag está completo una vez obtenidos.
resource.aipComplete=Este AIP tiene todos los componentes que exige OAIS.
resource.aipIncomplete=A este AIP le faltan componentes que exige OAIS.
resource.aipNote=El bag nombra cada uno en <code>oais-aip-components.txt</code> y dice qué falta en <code>bag-info.txt</code>. Añada lo que falta con el <a href="{0}">editor</a>.
resource.aipMayHold=Estos son los componentes descritos en el archivo; el paquete de este AIP puede contener el resto — <a href="{0}">vea lo que contiene</a>.
