transform.title=Transformer {0}
transform.intro=Une Transformation réécrit cet Objet-données dans un autre format — ici, en le faisant correspondre à un format décrit dans l'archive, ou <a href="#external">avec une autre application</a>. Ici, il est décodé avec sa propre Information de représentation, chaque élément du nouveau format est fait de ses éléments comme vous l'indiquez ci-dessous, et le résultat est écrit avec la description DFDL du nouveau format. Les nouvelles données sont ensuite décodées de nouveau avec cette description pour vérifier chaque Propriété d'information de transformation. Le faire conserve les nouvelles données dans l'archive et enregistre un nouvel Objet-données, dans une Version d'AIP dont l'Information de provenance enregistre la Transformation — cet Objet-données reste tel quel.
transform.notTransformable=Cet Objet-données ne peut pas être transformé : ses bits ont besoin d'un emplacement de stockage, et son Information de représentation d'une description DFDL, DRB SDF ou Kaitai Struct pour les décoder.
transform.newFormat=Le nouveau format
transform.into=Le transformer en
transform.chooseFormat=Choisir un format
transform.noTargets=Aucun format ne peut encore servir de cible : il faut une description DFDL dans l'archive, utilisée par un Objet-données. Décrivez-le dans les Outils RepInfo et enregistrez-le dans l'archive.
transform.choose=Choisir
transform.mapping=Ce qui forme chaque élément du nouveau format
transform.mappingNote=Un élément qui se répète apparaît une fois pour chaque occurrence de l'élément de l'ancien format sur lequel il se répète ; à l'intérieur, les éléments de l'ancien format situés sous celui-ci sont ceux de cette occurrence. Une valeur est copiée (multipliée par une échelle, plus un décalage, s'ils sont donnés), comptée, ou une constante. Les éléments ont d'abord été associés par nom ou signification : vérifiez-les.
