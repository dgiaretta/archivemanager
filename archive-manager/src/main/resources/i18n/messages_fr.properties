diag.encoding.title=Diagnostic de l'encodage
diag.encoding.intro=Cette page existe pour répondre définitivement à une question : le texte dhivehi s'affiche-t-il en points d'interrogation parce qu'il était déjà corrompu avant d'arriver dans cette application (le plus souvent, un export « CSV (séparateur : virgule) » d'Excel, qui utilise la page de code ANSI du système et ne représente pas du tout l'écriture thaana), ou parce que quelque chose dans le fonctionnement de cette application est en cause ?
diag.encoding.testString=Texte de test
diag.encoding.testStringNote=Le texte ci-dessous est écrit directement dans le code source Java de cette application — il n'est jamais passé par un fichier téléversé, une feuille de calcul ou ce que vous avez saisi. S'il s'affiche correctement, l'affichage de cette application fonctionne et le problème est en amont, dans la feuille d'origine. S'il s'affiche <em>aussi</em> en points d'interrogation, le bogue est dans cette application, pas dans vos données.
diag.encoding.jvm=Configuration de la JVM
diag.encoding.notUtf8=<strong>Le jeu de caractères par défaut de la JVM n'est pas UTF-8.</strong> C'est la cause la plus probable d'une corruption du texte dhivehi quelque part dans cette application (et non déjà dans votre fichier d'origine) — Java 17 précède le passage de Java 18 à « UTF-8 par défaut », donc sous Windows en particulier, une JVM non configurée se rabat sur la page de code ANSI de Windows, qui ne prend pas du tout en charge le thaana. Solution : lancer avec <code>-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8</code> explicitement — voir <code>run.bat</code> dans ce projet, ou la section sur l'internationalisation du README.
diag.encoding.utf8=<strong>Le jeu de caractères par défaut de la JVM est UTF-8.</strong> Cette cause est écartée ; si des points d'interrogation apparaissent encore, la corruption existait très probablement déjà dans la feuille d'origine avant que cette application la lise (voir la note au-dessus du texte de test).
diag.encoding.defaultCharset=Jeu de caractères par défaut
diag.encoding.os=Système d'exploitation
diag.encoding.javaVersion=Version de Java
diag.encoding.locale=Si LANG/LC_ALL/LC_CTYPE sont tous « (not set) », ou quelque chose comme un simple <code>C</code> ou <code>POSIX</code> (ASCII seul, sans Unicode), c'est un problème de configuration des paramètres régionaux indépendant du système d'exploitation — il touche Linux/WSL tout autant que Windows. <code>C.UTF-8</code> en particulier n'est <strong>pas</strong> l'un de ces cas — c'est l'ordre de tri de type C avec une prise en charge complète d'UTF-8, des paramètres régionaux réels et compatibles Unicode, souvent utilisés délibérément dans les conteneurs et les images de serveur minimales. <code>run.sh</code> (Linux/macOS) et <code>run.bat</code> (Windows) imposent explicitement UTF-8 à la JVM quels que soient les paramètres régionaux, pour les cas (Java 17 et antérieurs, avant la JEP 400) où cela compte ; depuis Java 18, la JVM utilise déjà UTF-8 partout, donc ce genre de correctif n'a plus rien à faire.
diag.encoding.still=Vous voyez encore des points d'interrogation avec un vrai téléversement ?
diag.encoding.stillXlsx=Le texte de test ci-dessus ne met à l''épreuve que la moitié affichage du traitement — il n''est jamais passé par la lecture de fichiers. Si votre fichier d''origine passe cette page mais affiche encore des points d''interrogation après l''import, ou si vous voulez tester directement le fichier exact qui vous pose problème, utilisez le <a href="{0}">test de lecture XLSX</a> : téléversez le vrai fichier et voyez précisément ce qu''Apache POI en extrait, avant que toute autre partie de cette application intervienne.
diag.encoding.stillTdb2=Si <em>cette</em> page s''affiche aussi correctement mais qu''un vrai import corrompt encore, le seul maillon non testé est l''aller-retour du stockage de Jena/TDB2 lui-même — ni cette page ni le test de lecture XLSX n''écrivent ni ne lisent le graphe de données. Le <a href="{0}">test d''aller-retour TDB2</a> écrit le même texte dhivehi dans le graphe de données, valide, et le relit dans une requête vraiment séparée — le même aller-retour qu''un vrai import suivi d''une visite d''une page du Catalogue.
diag.tdb2.short=Test d'aller-retour TDB2
diag.tdb2.title=Test d'aller-retour du stockage TDB2
diag.tdb2.intro=Ni le texte de test codé en dur de la page de diagnostic de l'encodage ni le test de lecture XLSX ne passent par Jena/TDB2 — l'un saute entièrement la lecture des fichiers, l'autre saute entièrement le stockage. Cette page teste le maillon restant : un texte dhivehi survit-il à son écriture dans le graphe de données, à la validation, et à sa relecture dans une requête ultérieure et séparée — le même aller-retour qu'un vrai import suivi d'une visite d'une page du Catalogue ?
diag.tdb2.expected=Attendu
diag.tdb2.readBack=Ce qui a été relu depuis TDB2
diag.tdb2.nothing=Rien d'écrit pour l'instant — cliquez sur le bouton ci-dessous, qui écrit le texte attendu ci-dessus dans le graphe de données et revient aussitôt ici par une nouvelle requête, de sorte que ce que vous voyez ensuite est une vraie relecture, pas seulement l'écho de ce qui vient d'être envoyé.
diag.tdb2.action=Écrire le texte de test, puis le relire
diag.xlsx.title=Test de lecture XLSX
diag.xlsx.intro=Téléversez le vrai .xlsx qui vous pose problème. Cette page montre exactement ce qu''Apache POI extrait de ses premières lignes — rien d''autre n''y touche : ni graphe de données, ni stockage, ni affichage. Si le texte dhivehi apparaît déjà ici en points d''interrogation, la corruption est soit déjà dans le fichier lui-même, soit introduite au moment où ce fichier est lu (un vrai bogue, pas un problème d''environnement) — dans tous les cas, cela se produit avant que toute autre partie de cette application intervienne. S''il s''affiche correctement ici mais encore en points d''interrogation dans le Catalogue après un vrai import, le problème est plus loin dans le traitement (stockage ou affichage), pour lequel <a href="{0}">l''autre page de diagnostic</a> est le meilleur outil.
