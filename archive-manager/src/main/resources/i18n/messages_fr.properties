resource.downloadDescription=Télécharger la description des données
resource.downloadDescriptionNote=Son Information de représentation, avec tout ce dont elle a besoin, sous forme de zip : <code>description.ttl</code> et chaque description de structure et spécification de vue (DFDL, Kaitai Struct, DRB, ...) sous forme de fichier.
resource.openData=Ouvrir les données
resource.openDataNote=Les bits de cet Objet-données ont un emplacement de stockage, et son Information de représentation dit comment les lire. Son <a href="{0}">manifeste d''Information de représentation</a> (Turtle) nomme explicitement les données et chaque description ; TOPCAT (avec le lecteur <code>oais-structure-topcat</code>, format <code>OAIS-RepInfo</code>) et SPLAT l''ouvrent à cette adresse.
viewer.viewWith=Voir avec {0}
resource.fitsFile=Fichier FITS
resource.fitsNote=Son Information de représentation dit que c'est un fichier FITS (PRONOM x-fmt/383), et ses en-têtes disent ce qu'il contient : TOPCAT est proposé pour ses tables, DS9 et Aladin pour ses images. Ils lisent le fichier FITS lui-même, tel quel, qui leur est envoyé alors qu'ils tournent sur votre ordinateur (par SAMP) — sauf si son Information de représentation décrit ce fichier en particulier, avec une vue tabulaire ou image : ils le reçoivent alors décodé sur le serveur, avec ses colonnes nommées et leurs unités. Le lien « Fichier FITS » fonctionne avec n'importe quel lecteur FITS.
resource.describeFits=Décrire ce fichier FITS d'après ses en-têtes
resource.describeFitsNote=dans les Outils RepInfo : ses colonnes et ses pixels typés, nommés et dotés de leurs unités et significations, et les significations de ses mots-clés d'après le dictionnaire des mots-clés FITS — à enregistrer comme Information de représentation de cet Objet-données, pour que l'archive le décode, montre sa table et son image et imprime ses valeurs.
resource.tableNote=« Voir avec TOPCAT » ou « SPLAT » envoie les données, décodées sur le serveur en VOTable, à cette application tournant sur votre ordinateur (par SAMP ; elle vous demande d'autoriser cette page). SPLAT est proposé quand les colonnes de la table sont toutes numériques, comme celles d'un spectre. Le lien VOTable fonctionne avec n'importe quel outil de l'Observatoire virtuel. Les mêmes choix figurent dans le menu du clic droit de l'Objet-données dans le graphe.
resource.imageNote=Son Information de représentation dit aussi comment la voir comme image. « Voir avec DS9 » ou « Aladin » envoie l'image, décodée sur le serveur en FITS, à cette application tournant sur votre ordinateur (par SAMP). Fiji/ImageJ n'utilise pas SAMP : ouvrez-y le fichier du lien FITS, ou donnez-lui l'adresse du lien avec File &rsaquo; Import &rsaquo; URL. L'en-tête FITS porte les unités et la signification des pixels.
resource.launch=Lancer {0}
resource.launchNote=Pas de TOPCAT ni de SPLAT sur votre ordinateur ? « Lancer » démarre l''application avec ces données déjà chargées, téléchargée depuis l''archive, sans rien à installer ni à connecter — dès que vous avez <a href="https://openwebstart.com/" target="_blank" rel="noopener">OpenWebStart</a> (gratuit, installé une fois ; il ouvre le fichier <code>.jnlp</code> que le lien télécharge). L''application est signée avec le <a href="{0}">certificat autosigné</a> propre à cette archive : la première fois, OpenWebStart demande s''il faut lui faire confiance ; choisissez de toujours faire confiance à cet éditeur, et les lancements suivants ne demanderont plus rien.
values.title=Voir les valeurs ici
values.note=Décode les données sur le serveur au moyen de leur Information de représentation et imprime chaque valeur, avec son emplacement dans les bits et ce qu'elle signifie (sa signification, la signification d'un code, une valeur mise à l'échelle avec ses unités), comme les Outils RepInfo le font pour un fichier d'exemple — une page à la fois, pour qu'un gros fichier ne submerge pas le navigateur. La première page d'un gros fichier prend du temps à décoder ; les suivantes, non.
