preview.drbPython.nodes=Chaque champ devient un nœud enfant portant sa position/longueur en octets et son nom sémantique, sa définition et ses unités. Le module du pilote est montré ci-dessous.
preview.drbPython.addOns=Le paquet enregistre aussi quatre modules complémentaires drb-python, qui donnent la signification d''un fichier décodé dans son ensemble et le réécrivent : <code>{0}</code> (chaque valeur avec sa signification), <code>{1}</code> (nom sémantique → valeur), <code>{2}</code> (valeurs hors de leur intervalle valide ou de leur liste de codes, et octets non couverts) et <code>{3}</code> (le fichier réécrit, avec d''éventuelles modifications), p. ex. <code>node.get_impl(dict, "{1}")</code>.
preview.drbPython.withAddIn=Avec un module complémentaire écrit à la main, sous la forme d'<code>addin.py</code> dans le paquet.
