statistics.intro=Comment les classes et les propriétés sont réellement utilisées dans tout le graphe de données en ce moment, et non une liste statique de ce que définissent les ontologies. Tout ce qui a zéro individu ou zéro usage est entièrement exclu, plutôt que de remplir ces tableaux de lignes presque vides. Pour une vue visuelle des relations, document par document, plutôt que des totaux, voyez le <a href="{0}">graphe</a>, dont les commandes de mise en évidence par type d''entité et type de relation complètent bien ces tableaux.
