start.telemetry.note=Un exemple binaire utilisant des nombres, un choix sur le type de paquet, un message préfixé par sa longueur, une somme de contrôle conditionnelle et des valeurs mises à l'échelle avec unités et listes de codes.
start.telemetry.action=Partir de l'exemple de télémesure
start.fitsHeaders=Ou décrire un fichier FITS d'après ses en-têtes
start.fitsHeaders.note=Un fichier FITS se décrit lui-même : ses en-têtes disent ce que contient chaque HDU. Ses en-têtes deviennent une description de ce fichier en particulier — chaque en-tête un enregistrement de ses enregistrements de mots-clés, chacun pointant vers la signification du mot-clé dans le dictionnaire des mots-clés FITS (norme FITS 4.0) ; chaque image en lignes de pixels, typées par BITPIX, avec BUNIT, BSCALE, BZERO et BLANK comme unités, échelle, décalage et valeur de remplissage ; les colonnes de chaque table typées par TFORMn et nommées par TTYPEn, avec TUNITn, TSCALn, TZEROn, TNULLn, TLMINn et TLMAXn. L'archive peut alors le décoder, montrer sa table et son image et dire ce que signifient ses colonnes. Seuls les en-têtes sont lus. Un Objet-données dont l'Information de représentation dit qu'il est en FITS peut être décrit de la même façon depuis sa page.
start.fitsError=Le fichier FITS n'a pas pu être décrit.
start.fitsFile=Fichier FITS
start.fitsHeaders.action=Le décrire d'après ses en-têtes
start.east=Ou lire une description en EAST
start.east.note=Un Enregistrement de description de données dans le langage de description de données EAST du CCSDS (CCSDS 644.0-B-3) : son paquetage logique et son paquetage physique. Il est conservé tel qu'il est écrit et testé avec l'interpréteur EAST. Ses enregistrements, tableaux, énumérations et variantes deviennent aussi l'arbre des éléments, avec les littéraux de chaque énumération comme significations de ses codes, de sorte que des descriptions en Kaitai Struct, DFDL et DRB peuvent en être générées et testées elles aussi sur des données d'exemple - quand l'arbre peut l'exprimer ; sinon, il reste en EAST seulement.
