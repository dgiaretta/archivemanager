edit.structureNote=Le fichier sous forme d'arbre, dans l'ordre des données. Un <strong>enregistrement</strong> regroupe des éléments (et peut être répété, ou être une ligne de texte délimité comme une ligne CSV) ; un <strong>champ</strong> est une valeur ; un <strong>choix</strong> est l'un de plusieurs enregistrements, choisi d'après la valeur d'un champ précédent. Les nombres, longueurs et conditions peuvent utiliser des champs précédents et de l'arithmétique, p. ex. <code>n</code>, <code>rows * cols</code>, <code>flags = 1</code>, et des champs d'un enregistrement lu auparavant, p. ex. <code>header.length + 1</code>. Sélectionnez un élément pour le modifier, y compris ce qu'il signifie : son nom sémantique, sa définition, ses unités et plus.
