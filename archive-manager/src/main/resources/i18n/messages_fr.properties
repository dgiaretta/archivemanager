aip.note=Créez un paquet d'informations archivé autour de cet Objet-données, avec tout ce que l'OAIS exige et que l'archive connaît ou peut déduire : son Information de contenu (l'Objet-données et l'Information de représentation avec laquelle il est interprété), l'Information d'intégrité (le SHA-256 de ses bits, récupérés maintenant), les Informations de référence, de provenance et de contexte, et une Description du paquet. L'Information d'empaquetage est fournie lorsqu'il est exporté en BagIt. Ce que vous seul pouvez dire se met ci-dessous ; ce qui est omis apparaît comme manquant sur la page de l'AIP, à ajouter avec l'éditeur.
