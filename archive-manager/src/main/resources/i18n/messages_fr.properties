preview.drbPython.test=Exécute le pilote ci-dessus avec drb-python {0} sur ce serveur et montre l''arbre des nœuds décodé, puis ce que renvoient ses modules de métadonnées et de vérifications. Le fichier ne sert que pour cette requête ; rien n''est conservé.
preview.drbPython.noAddIns=Ce serveur n'exécute pas les modules complémentaires écrits à la main, le test ne peut donc pas s'exécuter tant qu'il y en a un (voir <code>archive.drb-python.run-hand-written-add-ins</code>).
