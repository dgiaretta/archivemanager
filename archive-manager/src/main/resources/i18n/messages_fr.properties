hand.addIn.intro=Écrivez du code Python que le pilote drb-python généré appellera, pour ce que l'arbre des éléments ne peut pas exprimer. Le pilote lit toujours l'arbre des éléments ; le module complémentaire s'y greffe, au moyen de n'importe laquelle de ces fonctions :
hand.addIn.prepare=<code>prepare(data)</code> — reçoit les octets du fichier avant leur lecture et renvoie les octets à lire : déchiffrez-les ou décompressez-les ici.
hand.addIn.check=<code>check(root)</code> — après le décodage : renvoie une liste de problèmes (sommes de contrôle, CRC, vérifications croisées), ajoutée à ce que signale le module <code>checks</code>.
hand.addIn.metadata=<code>metadata(root)</code> — renvoie un dictionnaire fusionné avec ce que renvoie le module <code>metadata</code>.
hand.addIn.restore=<code>restore(data)</code> — quand le fichier est réécrit : annule <code>prepare()</code> (p. ex. chiffre de nouveau) et renvoie les octets à écrire.
hand.addIn.root=<code>root.original_bytes</code> sont les octets du fichier, <code>root.decoded_bytes</code> ce qu'a renvoyé <code>prepare()</code>, et les enfants de <code>root</code> les éléments décodés. Le module complémentaire est <code>addin.py</code> dans le paquet téléchargé, et il est enregistré dans l'archive avec le pilote.
hand.addIn.risk=Un module complémentaire est du code Python, qui s'exécute avec tous les droits de celui qui utilise le pilote. On vérifie que c'est du Python valide, mais on ne peut pas vérifier qu'il est sûr.
hand.addIn.runs=Ce serveur exécute les modules complémentaires lors des tests sur échantillon.
hand.addIn.doesNotRun=Ce serveur n'exécute pas les modules complémentaires lors des tests sur échantillon (<code>archive.drb-python.run-hand-written-add-ins</code>), testez donc le paquet téléchargé ailleurs.
hand.intro=Écrivez vous-même la description en {0}, pour ce que l''arbre des éléments de l''éditeur ne peut pas exprimer — sommes de contrôle, chiffrement, autres compressions, enregistrements répartis sur plusieurs lignes, et tout ce que permet le langage. Une fois enregistrée, elle remplace la description générée dans l''aperçu, le test sur échantillon, le téléchargement et l''enregistrement dans l''archive. L''arbre des éléments fournit toujours les significations (noms sémantiques, unités, codes) enregistrées comme Information de représentation sémantique, mais le test sur échantillon d''une description écrite à la main montre l''arbre propre au moteur au lieu de l''aligner sur l''arbre des éléments.
hand.checked=Un test sur échantillon exécute la description dans cette application, elle est donc d'abord vérifiée : pas de DOCTYPE ni de fichiers inclus depuis ailleurs (le DFDL peut inclure les schémas intégrés de Daffodil) ; pour Kaitai Struct, pas d'<code>imports</code> ni de routines <code>process:</code> personnalisées (zlib, xor, rol et ror sont intégrées) ; pour DRB, pas de requêtes appelant Java ou lisant des fichiers.
hand.outOfDate=L'arbre des éléments a changé depuis que ceci a été écrit, ce qu'il génère maintenant est donc différent. Vérifiez si la description écrite à la main a besoin de la même modification.
