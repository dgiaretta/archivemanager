preview.drbJava.sdf=Un schéma SDF de DRB : un XML Schema dont les annotations <code>sdf:block</code> donnent la longueur, l'ordre des octets et l'encodage de chaque champ — le langage déclaratif de description propre à DRB, appliqué par le DRB Java de GAEL (LGPL v3). La définition de chaque champ devient son <code>xs:documentation</code>.
preview.drbJava.reference=Un schéma documenté pour référence, pas quelque chose que DRB lit — les schémas SDF de DRB décrivent des agencements séquentiels d'octets, et DRB n'a pas d'implémentation HDF5.
preview.drbJava.test=Applique le schéma ci-dessus avec le DRB Java, dans cette application, et montre l'arbre des nœuds décodé avec la position en octets de chaque champ. Le fichier ne sert que pour cette requête ; rien n'est conservé.
preview.drbJava.writeBack=DRB écrit chaque valeur là où elle a été lue : une valeur délimitée peut changer de longueur, une de longueur fixe ne le peut pas.
preview.viewers=Ouvrir dans TOPCAT, SPLAT ou une visionneuse d'images
preview.viewers.zip=Un zip contenant tout ce dont TOPCAT (avec le lecteur <code>oais-structure-topcat</code>) ou SPLAT (avec <code>oais-structure-splat</code>) ont besoin pour ouvrir vos données : un manifeste d'Information de représentation (Turtle) nommant le fichier de données, les descriptions DFDL et DRB SDF — l'une ou l'autre convient — une vue tabulaire générée à partir de l'arbre des éléments (le premier enregistrement répété comme lignes, ses champs comme colonnes, avec leurs unités et significations), et ce que signifie chaque élément. Chaque fichier est nommé dans le manifeste, on peut donc les renommer ou les déplacer en le modifiant. Placez votre fichier de données à côté du manifeste, sous le nom que vous donnez ici.
preview.viewers.image=Une image — un enregistrement répété (une ligne) contenant un champ numérique répété (ses pixels) — reçoit aussi une vue image : <code>oais-structure-image</code> l'écrit en FITS pour Fiji/ImageJ, SAOImage DS9 ou Aladin, et une fois enregistrée dans l'archive avec un emplacement de stockage, l'archive sert elle-même ce FITS.
preview.viewers.dataFile=Nom du fichier de données
preview.viewers.download=Télécharger pour les visionneuses (.zip)
preview.save.note=Crée une Information de représentation structurelle/sémantique liée à un Objet-données, de la même manière que le reste de l'archive modélise l'Information de représentation de tout format. Choisissez lesquelles des descriptions générées ci-dessus garder comme Information de représentation structurelle — la sémantique des champs est enregistrée de toute façon, comme un individu d'Information de représentation sémantique par champ/ligne (le nom sémantique comme son <code>rdfs:label</code>, la définition comme son <code>skos:definition</code>, les unités liées via <code>im:hasUnitOfMeasurement</code>), regroupés sous une Information de représentation sémantique générale pour la description dans son ensemble.
