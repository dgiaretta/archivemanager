start.intro=Construisez une description en Kaitai Struct (.ksy), DFDL (.dfdl.xsd), DRB (schéma SDF ou pilote drb-python) et/ou EAST (.east) d'un format de données scientifiques, et donnez à chaque champ un nom sémantique, une définition et des unités -- puis enregistrez-la dans l'archive comme de véritables Informations de représentation OAIS : Information de représentation structurelle pour l'agencement des octets/logique, et Information de représentation sémantique, un individu par champ, pour ce que chacun signifie.
