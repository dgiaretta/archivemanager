transform.kind.count=nombre de
transform.asText=La correspondance sous forme de texte
transform.asTextNote=C'est ce qui est enregistré avec la Transformation. Vous pouvez le modifier ici plutôt que ci-dessus : une règle par ligne — <code>for star in stars.entry</code>, <code>star.ra = stars.entry.ra</code>, <code>star.ra_rad = stars.entry.ra * 0.0174532925</code>, <code>n = count(stars.entry)</code>, <code>version = "2"</code>.
transform.useText=Utiliser ce texte, pas le tableau ci-dessus
transform.properties=Propriétés d'information de transformation à vérifier
transform.propertiesNote=Les valeurs qui doivent survivre à la Transformation. Chacune est vérifiée en décodant les nouvelles données avec leur propre description et en comparant les valeurs physiques (après l'échelle et le décalage de chaque côté) — dans la tolérance donnée, dans les unités des valeurs, ou sinon ce que les types permettent. Celles que l'Objet d'information de cet Objet-données a déjà sont cochées ; les autres lui sont ajoutées quand vous transformez.
transform.col.check=Vérifier
transform.col.valuesOf=Valeurs de
transform.col.tolerance=Tolérance
transform.tip=Propriété d'information de transformation
transform.try=Essayer
transform.external=Ou le transformer avec une autre application
transform.externalNote=Si une autre application effectue la Transformation — un convertisseur de formats, un script, le logiciel d'une mission — téléchargez les données et leur description, transformez-les là-bas, puis téléversez ici le résultat et dites ce qui a été fait. Cet enregistrement devient l'Information de provenance de la nouvelle Version d'AIP, pour que ceux qui la liront plus tard sachent comment les données sont nées.
