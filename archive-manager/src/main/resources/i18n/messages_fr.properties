writeBack.title=Réécrire
writeBack.intro=Décode un fichier d'exemple, puis le réécrit avec la description ci-dessus et compare les deux. Sans modification, c'est un aller-retour : des octets identiques signifient que la description suffit à recréer le fichier à partir de ses valeurs décodées. Pour écrire un fichier modifié, indiquez les modifications sous forme de lignes <code>chemin = valeur</code>, p. ex. <code>/header/count = 3</code>, en nommant les éléments comme dans le test ci-dessus (<code>/sample[2]</code> pour le deuxième d'un élément répété). Les nombres et longueurs doivent être modifiés en conséquence.
