writeBack.writtenUnchanged=({0} octets) réécrit sans modification :
writeBack.identical=La description couvre tout l'échantillon et encode chaque valeur comme l'échantillon la stocke.
writeBack.different=Quelque chose dans l'échantillon n'est pas décrit, ou n'est pas réécrit comme il est stocké : les octets après les données décrites ne sont pas écrits, les nombres en texte peuvent être écrits sous une autre forme (<code>1.50</code> comme <code>1.5</code>), et les données compressées peuvent être compressées différemment.
