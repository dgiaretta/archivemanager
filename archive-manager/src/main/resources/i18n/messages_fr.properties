resource.mapPackage=Faire correspondre son paquet aux composants de l'AIP
resource.mapPackageNote=Ouvre le paquet, vérifie son bag, et montre où se trouve chaque composant que l'OAIS exige d'un AIP — la feuille de téléversement, METS/PREMIS, les sommes de contrôle — et ce qu'il y dit.
resource.writeOut=L'exporter
resource.bagit=Télécharger en BagIt
resource.bagitRefer=BagIt, en faisant référence aux bits
resource.bagitNote=Ce paquet d'informations archivé sous forme de bag BagIt (RFC 8493), compressé : <code>data/aip.ttl</code> décrit l'AIP et tout ce dont il est fait, avec les bits de ses Objets-données, chaque description sous forme de fichier, et les ontologies OAIS, le tout avec des sommes de contrôle SHA-256 — complet, à remettre à une autre archive. Ou faites référence aux bits des Objets-données plutôt que de les inclure : <code>fetch.txt</code> donne l'URL où récupérer chacun (son emplacement de stockage), pour les données volumineuses ou les bits conservés là où le destinataire peut les récupérer ; le manifeste garde leurs sommes de contrôle, le bag est donc complet une fois qu'ils sont récupérés.
resource.aipComplete=Cet AIP a tous les composants que l'OAIS exige.
resource.aipIncomplete=Il manque à cet AIP des composants que l'OAIS exige.
resource.aipNote=Le bag nomme chacun dans <code>oais-aip-components.txt</code> et dit ce qui manque dans <code>bag-info.txt</code>. Ajoutez ce qui manque avec l''<a href="{0}">éditeur</a>.
resource.aipMayHold=Ce sont les composants décrits dans l''archive ; le paquet de cet AIP peut contenir le reste — <a href="{0}">voyez ce qu''il contient</a>.
