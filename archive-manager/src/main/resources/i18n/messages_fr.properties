upload.title=Téléverser dans le Catalogue
upload.heading=Téléversement groupé
upload.intro=Téléversez une Feuille de téléversement groupé (le format à 26 colonnes de la Politique et du Plan de mise en œuvre de la préservation du NAM, « Upload Spreadsheet and Accession Register ») au format <code>.xlsx</code> ou <code>.csv</code>. Les en-têtes de colonnes doivent correspondre aux noms des champs de la feuille (la comparaison ignore la casse et les espaces, donc <code>FixityHashSHA256</code> et <code>fixity hash sha256</code> sont traités de la même façon ; <code>Original Title</code> est aussi accepté comme en-tête alternatif de <code>Title</code>). Les champs répétables (Subject, Description, Contributor, Date, Type, Format, Identifier, Source, Language, Relation, Coverage, Rights, Provenance, FormatInfo, Semantics, OtherRI) acceptent plusieurs valeurs dans une cellule, séparées par <code>;</code>.
upload.preferXlsx=<strong>Préférez .xlsx à .csv si certaines de vos données sont en dhivehi (ou dans toute écriture non latine).</strong> L'export simple « CSV (séparateur : virgule) » d'Excel écrit le fichier dans la page de code ANSI du système, pas en UTF-8, sauf si l'on choisit explicitement « CSV UTF-8 (séparateur : virgule) » -- et la page de code ANSI de Windows ne représente pas du tout l'écriture thaana, donc cet export remplace silencieusement chaque caractère dhivehi par un <code>?</code> littéral dans le fichier lui-même, avant même que cette application le voie. Une fois dans le CSV, cette corruption est définitive ; téléverser à nouveau un CSV déjà corrompu ne la répare pas, quelle que soit la manière dont cette application gère l'encodage. Téléverser le <code>.xlsx</code> d'origine évite entièrement l'étape avec perte.
upload.rows=Chaque ligne devient un document du Catalogue. L'ensemble du téléversement devient une entrée du Registre des entrées qui relie chaque document créé. Aucune colonne n'est obligatoire -- une cellule vide signifie seulement que cette propriété n'est pas enregistrée pour cette ligne, ce qui est normal ; les lignes ne sont ignorées (et signalées, pas abandonnées en silence) que si quelque chose de vraiment inattendu se produit à leur lecture.
