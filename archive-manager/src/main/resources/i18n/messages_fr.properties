home.title=Accueil
home.intro=Une petite application de gestion d'archives fondée sur <a href="https://www.ica.org/standards/RiC/ontology" target="_blank">RiC-O 1.1</a> et le <a href="http://ontology.oais.info/im/" target="_blank">Modèle d'information OAIS</a>, reliés par une ontologie passerelle. Les documents sont décrits nativement en RiC-O ; la vue <strong>Correspondance OAIS</strong> de chaque document montre les classes OAIS correspondantes et, lorsque les données d'exemple en relient une, la véritable structure OAIS de description pour la préservation des mêmes fonds.
home.storage=Les données résident dans <a href="https://jena.apache.org/documentation/tdb2/" target="_blank">Apache Jena TDB2</a>, un véritable triplestore transactionnel sur disque, dans <code>{0}</code>. Chaque modification est validée avec la requête qui l''a faite — il n''y a pas d''étape d''enregistrement séparée, et elle survit aux redémarrages.
